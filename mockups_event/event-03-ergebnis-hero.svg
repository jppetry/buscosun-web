<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1620" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bgGrad03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#EDE6D3"/>
    </linearGradient>
    <linearGradient id="tempFill03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97B47" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C97B47" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1440" height="1620" fill="url(#bgGrad03)"/>

  <!-- ================= TOP-NAV ================= -->
  <g transform="translate(32,24)">
    <!-- Marke -->
    <g transform="translate(0,18)">
      <circle cx="10" cy="0" r="6" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.7" stroke-linecap="round">
        <line x1="10" y1="-11" x2="10" y2="-8.5"/>
        <line x1="10" y1="11" x2="10" y2="8.5"/>
        <line x1="-1" y1="0" x2="1.5" y2="0"/>
        <line x1="18.5" y1="0" x2="21" y2="0"/>
        <line x1="2.2" y1="-7.8" x2="4" y2="-6"/>
        <line x1="16" y1="6" x2="17.8" y2="7.8"/>
        <line x1="17.8" y1="-7.8" x2="16" y2="-6"/>
        <line x1="4" y1="6" x2="2.2" y2="7.8"/>
      </g>
      <text x="30" y="5" font-size="18" font-weight="500" letter-spacing="-0.5" fill="#2C2A26">buscosun</text>
    </g>
    <!-- Tabs mittig -->
    <g transform="translate(560,8)" font-size="13">
      <text x="0" y="14" fill="#5C5447">Karte</text>
      <text x="62" y="14" fill="#5C5447">Route</text>
      <rect x="118" y="-2" width="74" height="28" rx="14" fill="#2C2A26"/>
      <text x="155" y="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">Event</text>
      <text x="208" y="14" fill="#5C5447">Tagesablauf</text>
    </g>
    <!-- Rechts -->
    <g transform="translate(1130,8)">
      <circle cx="6" cy="9" r="4" fill="#7A9466"/>
      <text x="18" y="13" font-size="12" fill="#5C5447">Daten live</text>
      <g transform="translate(120,0)" stroke="#5C5447" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 12 a7 7 0 0 1 14 0 v3 l2 3 h-18 l2 -3 z"/>
        <path d="M5 18 a2 2 0 0 0 4 0"/>
      </g>
      <g transform="translate(178,-10)">
        <circle cx="20" cy="19" r="20" fill="#FFFFFF"/>
        <circle cx="20" cy="13" r="7" fill="#7A9466"/>
        <text x="20" y="32" font-size="11" font-weight="600" fill="#5C5447" text-anchor="middle">JS</text>
      </g>
    </g>
  </g>

  <!-- ================= VORHABEN-KOPF ================= -->
  <g transform="translate(80,108)">
    <!-- Ring-Icon-Badge -->
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#FAF6EA" stroke="#E0D6BE" stroke-width="0.5"/>
    <g transform="translate(28,30)" stroke="#8B7355" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-6" cy="2" r="8"/>
      <circle cx="9" cy="3" r="6"/>
      <path d="M-6 -8 l-3 -5 h6 z" fill="#FAEEDA" stroke="#C97B47"/>
    </g>
    <!-- Text -->
    <text x="78" y="14" font-size="10" font-weight="500" letter-spacing="2.5" fill="#A89A7A">DEIN VORHABEN</text>
    <text x="78" y="42" font-size="28" font-weight="400" letter-spacing="-0.6" fill="#2C2A26">Hochzeit · Meersburg am Bodensee</text>
    <g transform="translate(458,26)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="#F0F4EA" stroke="#7A9466" stroke-width="0.5"/>
      <text x="38" y="15" font-size="11" font-weight="500" fill="#5F7951" text-anchor="middle">angepasst</text>
    </g>
    <!-- Phasen-Zeile -->
    <g transform="translate(78,58)">
      <g stroke="#8B7355" stroke-width="1.6" fill="none" stroke-linecap="round">
        <circle cx="7" cy="7" r="7"/>
        <line x1="7" y1="7" x2="7" y2="3"/>
        <line x1="7" y1="7" x2="10" y2="9"/>
      </g>
      <text x="24" y="12" font-size="13" fill="#5C5447">3 Phasen einzeln bewertet: Trauung · Empfang · Abendfeier</text>
    </g>
    <!-- Geist-Button rechts -->
    <g transform="translate(1080,8)">
      <rect x="0" y="0" width="200" height="40" rx="20" fill="none" stroke="#D9D0B8" stroke-width="1"/>
      <text x="100" y="25" font-size="13" fill="#5C5447" text-anchor="middle">Angaben ändern</text>
    </g>
  </g>

  <!-- ================= HERO BESTER-TAG-KARTE ================= -->
  <g transform="translate(80,232)">
    <rect x="0" y="0" width="1280" height="300" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>

    <!-- Score-Donut -->
    <g transform="translate(86,110)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="#E0D6BE" stroke-width="8"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#C97B47" stroke-width="8" stroke-linecap="round"
              stroke-dasharray="237.0 289.0" transform="rotate(-90)"/>
      <text x="0" y="2" font-size="24" font-weight="600" fill="#2C2A26" text-anchor="middle">82</text>
      <text x="0" y="20" font-size="7" letter-spacing="0.18" fill="#A89A82" text-anchor="middle">SCORE</text>
    </g>

    <!-- MAIN -->
    <g transform="translate(184,44)">
      <text x="0" y="6" font-size="10" font-weight="500" letter-spacing="2.5" fill="#A89A7A">BESTER TAG FÜR HOCHZEIT</text>
      <!-- Konfidenz-Pille rechts -->
      <g transform="translate(792,-10)">
        <rect x="0" y="0" width="248" height="32" rx="16" fill="#F0F4EA" stroke="#7A9466" stroke-width="0.5"/>
        <g transform="translate(16,10)">
          <rect x="0" y="6" width="4" height="6" rx="1" fill="#5F7951"/>
          <rect x="7" y="3" width="4" height="9" rx="1" fill="#5F7951"/>
          <rect x="14" y="0" width="4" height="12" rx="1" fill="#5F7951"/>
        </g>
        <text x="44" y="21" font-size="12" font-weight="500" fill="#5F7951">Konfidenz hoch · 88 %</text>
      </g>

      <text x="0" y="42" font-size="32" font-weight="400" letter-spacing="-0.6" fill="#2C2A26">Sonntag, 14. Juni</text>
      <text x="0" y="72" font-size="14" fill="#5C5447">Trocken und mild über alle drei Phasen, am Abend frischt der Wind nur leicht auf —</text>
      <text x="0" y="92" font-size="14" fill="#5C5447">der ausgewogenste Tag im Zeitraum.</text>

      <!-- Faktor-Chips-Reihe -->
      <g transform="translate(0,116)">
        <!-- 1 Trockenheit (primary) -->
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="246" height="58" rx="12" fill="#FFFFFF" stroke="#2C2A26" stroke-width="1"/>
          <circle cx="16" cy="22" r="4" fill="#C97B47"/>
          <text x="30" y="20" font-size="9" font-weight="500" letter-spacing="1.5" fill="#A89A7A">TROCKENHEIT</text>
          <g transform="translate(178,8)">
            <rect x="0" y="0" width="56" height="16" rx="8" fill="#FAEEDA"/>
            <text x="28" y="11" font-size="8.5" font-weight="500" fill="#A85E2E" text-anchor="middle">wichtigste</text>
          </g>
          <text x="30" y="44" font-size="16" font-weight="500" fill="#2C2A26">0,2 mm</text>
        </g>
        <!-- 2 Temperatur -->
        <g transform="translate(262,0)">
          <rect x="0" y="0" width="246" height="58" rx="12" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
          <circle cx="16" cy="22" r="4" fill="#C97B47"/>
          <text x="30" y="25" font-size="9" font-weight="500" letter-spacing="1.5" fill="#A89A7A">TEMPERATUR</text>
          <text x="30" y="46" font-size="16" font-weight="500" fill="#2C2A26">gefühlt 22°</text>
        </g>
        <!-- 3 Windruhe -->
        <g transform="translate(524,0)">
          <rect x="0" y="0" width="246" height="58" rx="12" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
          <circle cx="16" cy="22" r="4" fill="#D4A373"/>
          <text x="30" y="25" font-size="9" font-weight="500" letter-spacing="1.5" fill="#A89A7A">WINDRUHE</text>
          <text x="30" y="46" font-size="16" font-weight="500" fill="#2C2A26">Böen 14 m/s</text>
        </g>
        <!-- 4 Sonne / Sicht -->
        <g transform="translate(786,0)">
          <rect x="0" y="0" width="246" height="58" rx="12" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
          <circle cx="16" cy="22" r="4" fill="#D4A373"/>
          <text x="30" y="25" font-size="9" font-weight="500" letter-spacing="1.5" fill="#A89A7A">SONNE / SICHT</text>
          <text x="30" y="46" font-size="16" font-weight="500" fill="#2C2A26">wechselnd</text>
        </g>
      </g>

      <!-- Legende -->
      <text x="0" y="204" font-size="11" fill="#8B7355">Faktoren nach Wichtigkeit für Hochzeit · gut · okay · kritisch</text>
    </g>

    <!-- Aktionen unten rechts -->
    <g transform="translate(700,234)">
      <!-- Kalender-Button -->
      <g>
        <rect x="0" y="0" width="244" height="40" rx="20" fill="#FFFFFF" stroke="#D9D0B8" stroke-width="1"/>
        <g transform="translate(18,11)" stroke="#5C5447" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="2" width="18" height="15" rx="3"/>
          <line x1="0" y1="7" x2="18" y2="7"/>
          <line x1="5" y1="0" x2="5" y2="4"/>
          <line x1="13" y1="0" x2="13" y2="4"/>
        </g>
        <text x="48" y="25" font-size="13" font-weight="500" fill="#2C2A26">In den Kalender (3 Phasen)</text>
      </g>
      <!-- Teilen-Button -->
      <g transform="translate(258,0)">
        <rect x="0" y="0" width="148" height="40" rx="20" fill="#FFFFFF" stroke="#D9D0B8" stroke-width="1"/>
        <g transform="translate(18,9)" stroke="#5C5447" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="2" cy="11" r="3"/>
          <circle cx="16" cy="3" r="3"/>
          <circle cx="16" cy="19" r="3"/>
          <line x1="4.6" y1="9.6" x2="13.4" y2="4.4"/>
          <line x1="4.6" y1="12.4" x2="13.4" y2="17.6"/>
        </g>
        <text x="48" y="25" font-size="13" font-weight="500" fill="#2C2A26">Link teilen</text>
      </g>
      <text x="0" y="58" font-size="10" fill="#A89A7A">.ics &amp; Link — offline, ganz ohne Konto</text>
    </g>
  </g>

  <!-- ================= WINDOW-RISK-BANNER ================= -->
  <g transform="translate(80,564)">
    <rect x="0" y="0" width="1280" height="64" rx="14" fill="#FAEEDA" stroke="#D4A373" stroke-width="0.5"/>
    <g transform="translate(28,20)" stroke="#A85E2E" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 0 L24 22 H0 Z"/>
      <line x1="12" y1="8" x2="12" y2="14"/>
      <circle cx="12" cy="18" r="0.6" fill="#A85E2E"/>
    </g>
    <text x="76" y="29" font-size="10" font-weight="500" letter-spacing="2" fill="#A85E2E">GENAU IM EVENTFENSTER</text>
    <text x="76" y="48" font-size="14" fill="#5C5447">Kurzer Schauer (15–16 Uhr · 1,2 mm) — fällt mitten in deine Zeit, auch wenn der Tag insgesamt günstig wirkt.</text>
  </g>

  <!-- ================= WARNKARTEN-GRID 2x2 ================= -->
  <!-- Grid: 2 Spalten je 628 breit, Gap 24; Zeilen je 200 hoch, Gap 24; Start y=662 -->

  <!-- RAINRISK (oben links) -->
  <g transform="translate(80,662)">
    <rect x="0" y="0" width="628" height="200" rx="16" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    <g transform="translate(40,42)" stroke="#3A6FA8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 14 a8 8 0 0 1 1 -16 a9 9 0 0 1 16 4 a6 6 0 0 1 -1 12 z"/>
      <line x1="8" y1="22" x2="5" y2="29"/>
      <line x1="17" y1="22" x2="14" y2="29"/>
    </g>
    <text x="92" y="48" font-size="10" font-weight="500" letter-spacing="1.5" fill="#A89A7A">REGENRISIKO ZUR TRAUUNG · 13–15 UHR</text>
    <text x="92" y="84" font-size="22" font-weight="500" letter-spacing="-0.4" fill="#2C2A26">Geringes Regenrisiko</text>
    <text x="92" y="120" font-size="14" fill="#5C5447">max 0,4 mm/h · Sicherheit 88 %</text>
  </g>

  <!-- WIND (oben rechts) -->
  <g transform="translate(732,662)">
    <rect x="0" y="0" width="628" height="200" rx="16" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    <g transform="translate(40,44)" stroke="#6B7A8F" stroke-width="1.7" fill="none" stroke-linecap="round">
      <path d="M0 4 h16 a4 4 0 1 0 -4 -4"/>
      <path d="M0 12 h24 a4 4 0 1 1 -4 4"/>
      <path d="M0 20 h12 a3 3 0 1 1 -3 3"/>
    </g>
    <text x="92" y="44" font-size="10" font-weight="500" letter-spacing="1.5" fill="#A89A7A">WIND-WARNUNG · STÄRKSTE BÖEN IN DER ABENDFEIER (18–23 UHR)</text>
    <text x="92" y="80" font-size="22" font-weight="500" letter-spacing="-0.4" fill="#2C2A26">Mäßig böig — bis 14 m/s</text>
    <text x="92" y="116" font-size="14" fill="#5C5447">Gefährdet: Deko · Pavillon · Frisur.</text>
    <text x="92" y="138" font-size="14" fill="#5C5447">Leichte Deko sichern, Kerzen windgeschützt.</text>
  </g>

  <!-- HITZE (unten links) -->
  <g transform="translate(80,886)">
    <rect x="0" y="0" width="628" height="200" rx="16" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    <g transform="translate(40,42)" stroke="#C97B47" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="13" r="7"/>
      <g stroke-width="1.6">
        <line x1="13" y1="-2" x2="13" y2="1"/>
        <line x1="13" y1="25" x2="13" y2="28"/>
        <line x1="-2" y1="13" x2="1" y2="13"/>
        <line x1="25" y1="13" x2="28" y2="13"/>
        <line x1="2.6" y1="2.6" x2="4.7" y2="4.7"/>
        <line x1="21.3" y1="21.3" x2="23.4" y2="23.4"/>
        <line x1="23.4" y1="2.6" x2="21.3" y2="4.7"/>
        <line x1="4.7" y1="21.3" x2="2.6" y2="23.4"/>
      </g>
    </g>
    <text x="92" y="44" font-size="10" font-weight="500" letter-spacing="1.5" fill="#A89A7A">HITZE-WARNUNG · HEISSESTE PHASE: EMPFANG (15–18 UHR)</text>
    <text x="92" y="80" font-size="22" font-weight="500" letter-spacing="-0.4" fill="#2C2A26">Spürbar warm — gefühlt bis 27 °C</text>
    <text x="92" y="116" font-size="14" fill="#5C5447">Belastet: Gäste in Festkleidung · Catering.</text>
    <text x="92" y="138" font-size="14" fill="#5C5447">Schatten &amp; Getränke einplanen.</text>
  </g>

  <!-- KÄLTE (unten rechts) -->
  <g transform="translate(732,886)">
    <rect x="0" y="0" width="628" height="200" rx="16" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    <g transform="translate(40,42)" stroke="#3A6FA8" stroke-width="1.7" fill="none" stroke-linecap="round">
      <line x1="13" y1="0" x2="13" y2="26"/>
      <line x1="0" y1="13" x2="26" y2="13"/>
      <line x1="3.8" y1="3.8" x2="22.2" y2="22.2"/>
      <line x1="22.2" y1="3.8" x2="3.8" y2="22.2"/>
      <g stroke-width="1.4">
        <path d="M13 3 l-3 3 M13 3 l3 3"/>
        <path d="M13 23 l-3 -3 M13 23 l3 -3"/>
        <path d="M3 13 l3 -3 M3 13 l3 3"/>
        <path d="M23 13 l-3 -3 M23 13 l-3 3"/>
      </g>
    </g>
    <text x="92" y="44" font-size="10" font-weight="500" letter-spacing="1.5" fill="#A89A7A">KÄLTE AM ABEND · ABENDFEIER (18–23 UHR)</text>
    <text x="92" y="80" font-size="22" font-weight="500" letter-spacing="-0.4" fill="#2C2A26">Frisch — gefühlt bis 13 °C</text>
    <text x="92" y="116" font-size="14" fill="#5C5447">Nach Sonnenuntergang kühlt es ab —</text>
    <text x="92" y="138" font-size="14" fill="#5C5447">Decken oder Heizpilze bereithalten.</text>
  </g>

  <!-- ================= FOOTER ================= -->
  <g transform="translate(80,1560)">
    <line x1="0" y1="-20" x2="1280" y2="-20" stroke="#E0D6BE" stroke-width="1"/>
    <text x="0" y="6" font-size="10" font-weight="500" letter-spacing="2" fill="#A89A7A">EV-03 · ERGEBNIS — BESTER TAG, BEGRÜNDUNG &amp; WARNKARTEN</text>
    <text x="1280" y="6" font-size="10" font-weight="500" letter-spacing="2" fill="#A89A7A" text-anchor="end">SCORE-DONUT · KONFIDENZ · FAKTOREN · FENSTER-RISIKO · .ICS/TEILEN</text>
  </g>
</svg>
