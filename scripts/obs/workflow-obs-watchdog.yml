# obs-watchdog.yml — startet obs.yml, wenn kein Lauf aktiv oder wartend ist
# (Kopie aus buscosun-web/scripts/obs/workflow-obs-watchdog.yml; Muster radar-watchdog).
name: obs-watchdog

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.OBS_KILL != '1' }}
    steps:
      - name: Dispatch mirror if none is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(curl -s -H "authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/obs.yml/runs?per_page=10" \
            | jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued"
                   or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          echo "aktive/wartende obs-Läufe: $active"
          if [ "$active" = "0" ]; then
            echo "keiner aktiv — obs wird gestartet"
            curl -s -o /dev/null -w "dispatch: HTTP %{http_code}\n" -X POST \
              -H "authorization: Bearer $GH_TOKEN" -H "accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/obs.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
