# ============================================================================
# glacier-stations-archiv.yml — Ablage der Stationsmessungen am Gletscher (Phase GO, buscosun-web/audit/gletscher-stationen.md)
#
# VORLAGE. Diese Datei gehört nach `.github/workflows/glacier-stations-archiv.yml` im Archiv-Repo `jppetry/buscosun-archiv` (Jans Vollmacht im
# Auftrag der Phase GO, 21.11.2026). Der Code lebt in `buscosun-web` (`scripts/glacier/stations-archive.mjs`), die Daten kommen aus
# `buscosun-data` `glacier/v1/stn/`. Geschrieben wird nur unter `glacier/v1/<Tag>/` (`stn-<stunde>.json.gz`, `stn-stations-<stand>.json.gz`);
# die Leitgletscher-Zeilen (`melt-…`), Punktarchiv, Straßen- und Seewetter daneben bleiben unberührt.
#
# Alle 6 h: jede Stundendatei, die das Archiv noch nicht hält — sie bleiben im Daten-Repo nur 72 h (die Höhen-Validierung und Gate E brauchen
# die Reihe). Nur Hinzufügen, nie --force; eine Datei mit anderem Inhalt unter demselben Namen bricht ab.
#
# Leerlauf: fehlt das Skript auf dem Zweig oder die Linie im Daten-Repo, endet der Job grün mit dem Grund.
# ============================================================================

name: glacier-stations-archiv

on:
  schedule:
    - cron: '53 */6 * * *'   # alle 6 h, :53 — abseits von glacier-archiv (:47), road-archiv (:25), sea-archiv (:41) und Punktarchiv (23:10)
  workflow_dispatch: {}

concurrency:
  group: glacier-stations-archiv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLACIER_PRODUCER_REF: ${{ vars.GLACIER_PRODUCER_REF || 'main' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout archiver (buscosun-web, GLACIER_PRODUCER_REF)
        id: app
        run: |
          REF="${GLACIER_PRODUCER_REF:-main}"
          if ! git ls-remote --exit-code --heads https://github.com/jppetry/buscosun-web.git "$REF" >/dev/null 2>&1; then
            if [ "$REF" != "main" ] && git ls-remote --exit-code --heads https://github.com/jppetry/buscosun-web.git main >/dev/null 2>&1; then
              echo "Zweig $REF ist weg (gemergt?) — der Producer kommt von main."; REF=main
            else
              echo "producer not on $REF yet (Zweig fehlt in buscosun-web) — Ende ohne Fehler."
              echo "ready=0" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          git clone --depth=1 --quiet --filter=blob:none --no-checkout --branch "$REF" https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json
          git checkout --quiet
          for f in scripts/glacier/stations-archive.mjs scripts/glacier/glacier-publish.mjs src/glacier/glacierStationContract.ts; do
            if [ ! -f "$f" ]; then
              echo "producer not on $REF yet ($f fehlt) — Ende ohne Fehler."
              echo "ready=0" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.app.outputs.ready == '1'
        with:
          ref: main
          path: archiv
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: glacier
          sparse-checkout-cone-mode: true

      - name: Checkout station hours (buscosun-data main glacier/v1/stn)
        id: data
        if: steps.app.outputs.ready == '1'
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-data.git data
          cd data
          git sparse-checkout set --no-cone /glacier/v1/stn/
          git checkout --quiet
          if [ ! -d glacier/v1/stn/h ]; then
            echo "glacier/v1/stn/h fehlt im Daten-Repo — die Linie ist noch nicht eingespielt, Ende ohne Fehler."
            echo "ready=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Archive (every station hour the archive does not hold yet)
        id: arch
        if: steps.app.outputs.ready == '1' && steps.data.outputs.ready == '1'
        run: |
          set -o pipefail   # a crash of the archiver must turn the job red, not be hidden by `tee`
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/glacier/stations-archive.mjs \
            --stn=../data/glacier/v1/stn --archive=../archiv/glacier/v1 --out=../archive-out | tee ../archive.log
          echo "days=$(test -d ../archive-out && ls ../archive-out | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Commit and push (append-only, with retry)
        if: steps.arch.outputs.days != '' && steps.arch.outputs.days != '0'
        run: |
          cd archiv
          git config user.name  'buscosun-glacier-archiv[bot]'
          git config user.email 'glacier-archiv@users.noreply.github.com'
          cd ..
          for DAY in $(ls archive-out); do
            node app/scripts/glacier/glacier-publish.mjs --archive --repo=archiv --src="archive-out/$DAY" --day="$DAY" \
              --message="glacier(stations): archiv $DAY $(date -u +%H:%MZ)"
          done
