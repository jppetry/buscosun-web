# ============================================================================
# Monatsarchiv des Daten-Repos (Phase AR1, buscosun-web/audit/daten-archiv.md)
# ============================================================================
# ⚠️ Diese Datei wird in `buscosun-web/scripts/repack-repo/workflow-archive.yml`
# GEPFLEGT und muss EINMAL von Hand nach `buscosun-data` gepusht werden: der
# `GITHUB_TOKEN` einer Action darf ohne `workflows`-Scope keine Workflow-Datei
# anlegen oder ändern — ein Publish, der es versuchte, würde als GANZES
# abgewiesen (samt aller Bilder). `publish-repack.mjs` trägt sie danach bei
# jedem Force-Push unverändert weiter.
#
# ── Was dieser Job tut ─────────────────────────────────────────────────────
# Er legt jeden Lauf, der auf `main` liegt, zusätzlich auf `archive-YYYYMM` —
# denselben Pfad, dieselben Bytes, dieselben Blob-OIDs. `main` behält seine
# Retention von 4 Läufen (12 h) und seinen Force-Push; der Archivzweig wird nur
# angehängt und nie force-gepusht.
#
# ── Warum er nichts kostet ─────────────────────────────────────────────────
# Der Schreiber lädt KEINE Bilddatei: ein Lauf ist auf `main` ein Unterbaum mit
# eigener Objekt-ID, die sich in einen neuen Baum hängen lässt, ohne je eine
# Datei zu sehen (`--filter=blob:none` + `git mktree`). Gemessen: Arbeitskopie
# 0,03 MB statt 3,00 MB Inhalt, Push +0 KB (`npm run probe:archiv`, 15/15).
# Deshalb gibt es hier auch KEINEN `actions/checkout` des Daten-Repos — der
# würde die 57 MB laden, die der Job gerade vermeidet.
#
# ── Warum stündlich ────────────────────────────────────────────────────────
# ICON-D2 läuft alle 3 h, aber ein stündlicher Job ist idempotent (findet er
# nichts Neues, macht er keinen Commit) und kostet ~20 s. Der Puffer ist die
# Retention von `main`: ein Lauf liegt dort 12 h, also überstehen bis zu elf
# ausgefallene Stunden folgenlos. Ein 3-h-Takt hätte denselben Puffer, aber
# jeder Ausfall wäre ein Drittel davon.
# ============================================================================

name: archive

on:
  schedule:
    # :05 — nach dem Publish-Fenster des Batches (Lauf + 20 bis + 60), aber
    # unabhängig davon: der Job liest nur, was auf `main` LIEGT.
    - cron: '5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: archive-runs
  cancel-in-progress: false      # ein laufender Anhang wird nie abgeschnitten

permissions:
  contents: write                # pusht ausschließlich `archive-*`, nie `main`

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Nur der Schreiber wird geholt — blob-los und sparse, wie beim Producer.
      # Er hat keine Laufzeit-Abhängigkeit: reines Node + git.
      - name: Checkout writer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout \
            https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts
          git checkout --quiet

      - name: Archive runs
        working-directory: app
        env:
          ARCHIVE_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          ARCHIVE_WORK: ${{ github.workspace }}/archive-work
        run: node scripts/archive-runs.mjs --push
