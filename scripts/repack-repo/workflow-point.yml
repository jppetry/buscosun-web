# ============================================================================
# point.yml — Punkt-Cube für buscosun Fusion (Phase PD, audit/punktdaten-versorgung.md)
#
# VORLAGE. Diese Datei gehört nach `.github/workflows/point.yml` im Daten-Repo
# `jppetry/buscosun-data` und muss dort MANUELL committet werden: eine Action darf
# ohne `workflows`-Scope keine Workflow-Datei pushen (dieselbe Einschränkung wie bei
# `workflow-build.yml`). Weicht die Vorlage vom Stand im Daten-Repo ab, läuft dort
# der alte Stand weiter. Die Kopie ist Jans Gate (PD-F3b).
#
# ── Warum ein EIGENER Workflow und nicht `build.yml` ─────────────────────────
# Anderer Takt, andere Laufzeit (Minuten bis Viertelstunden statt Sekunden), andere
# Quellen. Ein gemeinsamer Job würde die Kartenlinie an die langsamste Punktquelle
# hängen — und die Kartenlinie ist die, die live sichtbar ist.
#
# ── PD-F3b: EIN Workflow, DREI Jobs, DREI Takte ──────────────────────────────
# Bis F3 baute ein Job alle drei Stufen viermal am Tag (`50 3,9,15,21`). Damit war
# Stufe 1 beim Bau 3,4–3,8 h alt, obwohl ICON-D2 achtmal täglich rechnet und nach
# 1,35 h fertig ist — die Wartezeit bis zum Slot war der größte Anteil der Verzögerung
# (§49.1). Jetzt hat jede Stufe ihren Job und ihren Takt; jeder Job baut GENAU EINE
# Stufe (`--tiers=tX`), veröffentlicht sie unter dem Quell-Lauf dieser Stufe (§26) und
# der Index nennt je Stufe den jüngsten Lauf, der sie trägt (`latestByTier`, PD-F3a).
#
# ── Bereitstellung — GEMESSEN, nicht gesetzt (§31, 2026-09-09, über vier Läufe) ──
#
#   Quelle                18z     00z     06z     12z
#   ICON-D2   +48 h      1,35 h  1,36 h  1,35 h  1,35 h
#   ICON-EU  +120 h      3,53 h  3,70 h  3,55 h  3,64 h
#   IFS      +144 h      6,45 h  7,57 h  6,45 h  (noch nicht)
#
# IFS 00z/12z sind die vollen `oper`-Läufe (360 h) und brauchen ~7,6 h; 06z/18z enden
# als `scda` bei 144 h.
#
# ── Die drei Takte ───────────────────────────────────────────────────────────
#   t1  40 1,4,7,10,13,16,19,22   ICON-D2 des Laufs −3 h (Lauf + 1,67 h ⇒ 18 min Rand);
#                                  8×/Tag, ≈ 4 GiB je Lauf.
#   t2  30 4,10,16,22             ICON-EU/ICON global des laufenden Zyklus (+3,6…3,7 h) sind
#                                  fertig UND MOSMIX-L (Lauf + 73…76 min) liegt — hier läuft auch
#                                  das Stationsprodukt (s. „Warum der t2-Slot auf :30" unten).
#   t3  55 9,21                   IFS `oper` 00z/12z (+7,6 h) — nur diese reichen bis 336 h.
#                                  In DERSELBEN Gruppe wie t2; seit dem 14.09. liegt t2 35 min
#                                  HINTER t3 (10:30), t1 (10:40) wartet dann ≤ 15 min auf t2.
#
# ── Warum der t2-Slot auf :30 der Stunden 4/10/16/22 liegt (2026-09-14 nachgemessen) ─
# Der alte Slot `50 3,9,15,21` lag bei ICON-EU-Lauf + 3,83 h — nur 8 min hinter der
# gemessenen Bereitstellung (+3,53…3,70 h, am 14.09. 12z: +3,60 h) — und bei MOSMIX-L-Lauf
# + 50 min, während MOSMIX-L bei Lauf + 73…76 min erscheint (Last-Modified all_stations,
# 13./14.09.: 21z 22:12:47 · 03z 04:16:01 · 09z 10:12:51 · 15z 16:16:16). Das Stationsprodukt
# trug deshalb IMMER den Vorlauf (`ageH 7,06`, V-PD-28). Mit :30 der Folgestunde:
#   ICON-EU   Lauf + 4,50 h ⇒ 48–58 min Rand (Regel E)
#   MOSMIX-L  Lauf + 90 min ⇒ 14–17 min Rand (Regel E′, neu im Verifier)
#   Kartenlinie: nächster Push 05:30/11:30/17:30/23:30 ⇒ 60 min Abstand; Regel A verlangt
#   JOB_MAX_MIN(t2) + 20 = 35 ≤ 60, Regel C 25 ≤ timeout 60 ≤ 60.
# Gemessen am Runner (Läufe 38 und 42, 14.09.): t2-Job 8,6 und 9,8 min, davon Bau 6,1/7,7 min,
# Stationsprodukt 38/58 s, Publish 55/24 s. Preis: t2-Daten sind beim Bau 40 min älter.
# ⚠ t1 (:40 der Stunden 4/10/16/22) startet 10 min nach t2 und wartet in der Gruppe — Regel B:
# 50 − (15 − 10) = 45 ≥ 20 + 20. Die Kopie dieser Vorlage ins Daten-Repo ist Jans Gate.
#
# ── Abstand zur Kartenlinie — ausgerechnet, nicht behauptet ──────────────────
# `build.yml` publiziert um :20 der Stunden 0/3/6/… und um :30 der Stunden 2/5/8/… und
# **force-pusht**: was zwischen seinem Klon und seinem Push hier ankommt, ist danach
# spurlos weg. Der Verifier (`verify:point-data`) liest die Cron-Zeilen BEIDER Vorlagen
# und rechnet je Job:
#   Regel A  Abstand zum nächsten Kartenlinien-Push ≥ JOB_MAX_MIN(Job) + 20
#   Regel B  wartet der Job in der Gruppe hinter einem anderen (t3 hinter t2), gilt
#            Abstand − JOB_MAX_MIN(vorderer) ≥ JOB_MAX_MIN(Job) + 20
#   Regel C  JOB_MAX_MIN(Job) + 10 ≤ timeout-minutes(Job) ≤ Abstand
#   Regel D  keine zwei Cron-Zeilen mit derselben Minute, nie drei Jobs im selben Fenster
#
# ── Warum der t1-Slot auf :40 liegt (2026-09-12 nachgemessen) ────────────────
# Die Kartenlinie lässt je Drei-Stunden-Zyklus GENAU EIN Fenster: von :20 der Stunden
# 0/3/6/… bis :30 der Stunden 2/5/8/…. Mit JOB_MAX_MIN(t1) = 20 muss der Slot also
# zwischen H:20 und (H+1):50 liegen. Nach unten begrenzt ihn die Bereitstellung:
# ICON-D2 15z Stunde 048 stand am 2026-09-12 um 16:21:43 UTC, also Lauf + 1,36 h.
#   :30 ⇒  8 min Rand, 60 min Abstand zur Kartenlinie
#   :40 ⇒ 18 min Rand, 50 min Abstand      ← gewählt
#   :50 ⇒ 28 min Rand, 40 min Abstand      (Regel A gerade noch, keine Reserve)
# Acht Minuten Rand sind zu wenig für eine Quelle, deren Bereitstellung über vier
# Läufe ±0,01 h schwankt, aber eben nicht garantiert ist; verspätet sie sich, fiele
# der Lauf still auf ICON-D2 −3 h zurück. Rückfall, falls der Runner t1 nicht in
# 20 min schafft: `40 0,3,6,…` mit 110 min Abstand, aber ≈ 2 h älterem ICON-D2.
#
# ⚠ Was der Slot NICHT einholt, und das gehört dazu: ICON-D2-EPS braucht länger als
# der deterministische Lauf (15z am 2026-09-11 erst um 17:09 UTC = Lauf + 2,17 h) und
# C-LAEF ≈ 4,9 h. Beide nimmt die Laufwahl deshalb aus dem vorigen Zyklus — kein
# Ausfall, es steht je Quelle als `runAt` im Manifest. Der Gewinn des 3-h-Takts liegt
# für sie trotzdem darin, dass ihr neuer Lauf nach höchstens 3 h statt 6 h abgeholt
# wird: die mittlere Wartezeit „Modelllauf fertig → im Repo" halbiert sich für JEDE
# Quelle, und für die tragende Quelle der Stufe 1 sinkt das Alter von 3,8 h auf 1,7 h.
#
# ⚠ JOB_MAX_MIN je Stufe (im Verifier) ist bis zum ersten Runner-Tag nach F2
# PROVISORISCH aus der lokalen Messung × 2 (Runner-Faktor, §49.5) abgeleitet — F3c zieht
# sie an `tiers[].timing.totalMs` der Cron-Manifeste nach (Maximum + 30 %).
#
# ── Warteschlange ────────────────────────────────────────────────────────────
# EINE Concurrency-Gruppe für alle drei Jobs: die Manifest-Zusammenführung in
# `point/<run>/run.json` ist nicht nebenläufigkeitsfest, und zwei Publisher gleichzeitig
# sind der Kern von V-BW-58. ⚠ GitHub bricht einen WARTENDEN Lauf ab, sobald ein zweiter
# wartet (nur einer darf anstehen) — deshalb nie drei Jobs im selben Fenster, und die
# Cron-Zeilen tragen nie dieselbe Minute (Regel D).
#
# ── Was hier NICHT passiert ──────────────────────────────────────────────────
# Gelände. Dieses Repo speichert Wetterdaten (Jans Entscheidung 2026-09-09): Höhe kommt
# aus den Terrarium-Kacheln, die die App ohnehin lädt, Landbedeckung aus dem Spiegel
# `jppetry/buscosun-worldcover`, und die Ableitungen rechnet der Client am Punkt.
# ============================================================================

name: point

on:
  schedule:
    # Drei Takte, drei Jobs — jeder Job prüft unten, ob SEIN Cron ihn geweckt hat.
    - cron: '40 1,4,7,10,13,16,19,22 * * *'   # t1
    - cron: '30 4,10,16,22 * * *'             # t2 (+ Stationsprodukt), seit 2026-09-14 (V-PD-28)
    - cron: '55 9,21 * * *'                   # t3
    # AX-8 (2026-09-30): MOSMIX-S stuendlich (Lauf + 39…41 min gemessen) — :50 in jeder Stunde AUSSER den
    # t2-Stunden 4/10/16/22 (dort waere es der dritte Job im Fenster, Regel D; der t2-Job baut S dort selbst).
    - cron: '50 0,1,2,3,5,6,7,8,9,11,12,13,14,15,17,18,19,20,21,23 * * *'   # stations-s
  workflow_dispatch:
    inputs:
      tiers:
        description: 'Stufen: all | t1 | t2 | t3 | stations-s (all = nacheinander t1 → t2 → t3 → stations-s)'
        required: false
        default: 'all'
      run:
        description: 'Fester Lauf YYYYMMDDHH als Obergrenze der Laufsuche (leer = Discovery)'
        required: false
      steps:
        description: 'Schrittbereich, z. B. 0-48 (leer = volle Stufe)'
        required: false

concurrency:
  # Der Radar-Spiegel pusht in DIESES Repo alle 1–2 Minuten. Zwei Publisher
  # gleichzeitig sind der Kern von V-BW-58 — deshalb nie zwei Punktläufe parallel,
  # auch nicht zwei Stufen-Jobs.
  group: point
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Stufe 1 (0–48 h, 0,05°) — achtmal täglich ─────────────────────────────
  t1:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '40 1,4,7,10,13,16,19,22 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tiers == 'all' || github.event.inputs.tiers == 't1'))
    runs-on: ubuntu-latest
    # Regel C: JOB_MAX_MIN(t1) + 10 ≤ 45 ≤ 50 (Abstand zum naechsten Push der Kartenlinie). NP-0b (E-NP0-5 b): JOB_MAX_MIN(t1)
    # 20 → 24 — Regel B bindet zweimal (t1 hinter t2 ⇒ ≤ 25, stations-s hinter t1 ⇒ ≤ 24), mehr geht nicht.
    timeout-minutes: 45
    steps:
      # NP-0b (audit/np0-datenprodukte.md §8): Jobstart fuer die Frist des Feldschritts (FIELD_END_MIN, Regel F′).
      - name: Job-Start merken (NP-0b)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      # SPARSE: der Radar-Spiegel macht den Baum gross (gemessen 279 MiB am 2026-09-09).
      # Der Cube-Job braucht davon nichts ausser `point/` — UND `.gitattributes`.
      #
      # ⚠ Die dritte Zeile hat sieben Cron-Laeufe gekostet (2026-09-09 … 2026-09-11):
      # der Publisher legt `.gitattributes` an (`*.bin -text`, §29) und staged sie; ein
      # sparse Checkout ohne dieses Muster laesst `git add` die Datei STILL verwerfen
      # (Exit 0). Die Liste hier und `PUBLISH_PATHS` in `scripts/point/sparseCover.mjs`
      # prueft der Verifier GEGENEINANDER, je Job.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            point
            index.json
            .gitattributes
          sparse-checkout-cone-mode: false
      - name: Sparse-Muster des Daten-Repos nachpruefen
        run: |
          git sparse-checkout list
          git sparse-checkout list | grep -qx '.gitattributes' || { echo "sparse-Muster ohne .gitattributes — der Publisher wuerde abbrechen"; exit 1; }
          test -f .gitattributes && echo ".gitattributes vorhanden" || echo ".gitattributes fehlt im Repo — der Publisher legt sie an"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Git identity
        run: |
          git config user.name  'buscosun-bot'
          git config user.email 'bot@buscosun.local'
      # Producer aus dem Anwendungs-Repo — sparse (der volle Klon maß 188 s, BW-9 §28.6):
      # `scripts/`, `src/`, `package.json` und `QUELLENMATRIX.md` (das Gate gleicht die
      # Matrix gegen die Registry ab; ohne die Datei fiel es am nachgebauten Cron durch, §30).
      - name: Checkout producer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json QUELLENMATRIX.md public/climaGrid.json
          git checkout --quiet
          test -f QUELLENMATRIX.md || { echo "QUELLENMATRIX.md fehlt trotz sparse-Muster"; exit 1; }
      - name: Install producer dependency
        run: cd app && npm install --no-save --no-audit --no-fund bz2@1
      # Netzfreies Gate VOR dem Ingest: eine kaputte Formdefinition soll auffallen,
      # bevor Gigabytes gezogen werden.
      - name: Gate — Form der Punktdaten
        run: cd app && node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/verify-point-data.mjs
      - name: Build point cube — t1
        env:
          # Direkt in den ausgecheckten Baum: der Producer fuehrt ein vorhandenes run.json
          # desselben Laufs fort (nie eine fremde Stufe aus dem Manifest werfen, §26).
          POINT_OUT: ${{ github.workspace }}/point
          POINT_CACHE: ${{ runner.temp }}/point-cache
          # Das `bzip2`-Binary statt des reinen JS-Wegs (BW-9/V-BW-27: Faktor ~2,6).
          REPACK_BZIP2: '1'
          # PD-C2 (V-PD-36): Plattencache nach der Stufe leeren, Konstanten bleiben.
          POINT_CACHE_CLEAR: 'tier'
          # AP17 (E-F-15, Jans Freigabe des Diffs): z0 der Modelle als point/static/z0mod/v1 — ohne die Zeile baut der Producer es nicht.
          POINT_Z0MOD: '1'
          # PD-F2d: Worker-Pool — Standard min(6, Kerne − 1) = 3 auf dem 4-vCPU-Runner.
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs \
            scripts/point/build-point-cube.mjs --tiers=t1 \
            ${{ github.event.inputs.run && format('--run={0}', github.event.inputs.run) || '' }} \
            ${{ github.event.inputs.steps && format('--steps={0}', github.event.inputs.steps) || '' }}
      # NP-0b (audit/np0-datenprodukte.md §3.3, §8; E-NP0-4 F1, E-NP0-5): Kartenfelder `point/field/v1/<lauf>/t1/` aus dem
      # eben gebauten Cube — buscosun Fusion mit dem Cube als einziger Quelle je Zelle („Modell · Cube“), Worker-Pool.
      # ⚠ `continue-on-error` + eigenes Timeout: ein Feld-Fehler nimmt NIE den Cube mit. Frist: fertig spaetestens
      # FIELD_END_MIN nach dem Jobstart (Regel F′: dahinter Publish + CDN + 1 min bis JOB_MAX_MIN); ist der Bau langsam,
      # entfaellt das Feld dieses Laufs. Rueckweg: POINT_FIELDS: '0' (der Publisher baut den Altbestand dann ab).
      - name: Build map fields — t1 (NP-0b)
        continue-on-error: true
        timeout-minutes: 8
        env:
          POINT_OUT: ${{ github.workspace }}/point
          POINT_FIELDS: '1'
          FIELD_JOB_T0: ${{ env.JOB_T0 }}
          FIELD_END_MIN: '18'
        run: |
          cd app
          test -f scripts/point/build-point-fields.mjs || { echo "Producer auf main ohne Kartenfelder (NP-0b nicht gepusht) — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/build-point-fields.mjs --tier=t1
      # Der Publisher committet, pusht (mit Wiederholung) und purgt DANACH den Index am
      # CDN — genau EINE Push-Stelle je Job (V-BW-58: fuenf Versuche mit `pull --rebase`).
      # AP12a (E-F-1, audit/fusion-implementierung.md §9.4): danach purgt er JEDE geaenderte Datei
      # (run.json zuerst — sie wird je Stufe gemergt und beschnitten, V-FI-1), prueft Index und
      # run.json auf Frische und waermt alles Neue mit Browser-`Accept-Encoding`; 403 und
      # Fristablauf zaehlen als Fehlschlag und werden wiederholt (V-FI-5). Nie fatal.
      # POINT_CDN_BUDGET_S = Wandzeit dieses Schritts, hergeleitet aus der Luft unter
      # JOB_MAX_MIN_BY_TIER ueber die gemessenen Job-Maxima minus 1 min:
      #   t1 24 − 16,5 (02./03.10., V-NP0-14) − 1 ≥ 4 min ⇒ 240 s · t2 15 − 10,7 − 1 = 3,3 ⇒ 180 s · t3 15 − 8,4 − 1 ⇒ 180 s
      # (Regel F im Verifier rechnet es nach). NP-0b Regel F′: der Feldschritt endet bis FIELD_END_MIN (t1 18) ⇒
      #   18 + Publish 1 + CDN 4 + 1 = 24 = JOB_MAX_MIN(t1). Rueckweg: POINT_CDN_SYNC: '0' (nur index.json purgen).
      - name: Publish (committet, pusht mit Wiederholung, purgt das CDN)
        env:
          # OHNE diese Variable schreibt der Publisher nur lokal und pusht NICHT.
          POINT_PUSH: '1'
          POINT_CDN_BUDGET_S: '240'
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/publish-point.mjs --repo=${{ github.workspace }}
      # V-RC-2 (audit/regenchance.md §10): Waechter der Kartenfelder — NACH dem Publish (der Cube ist dann veroeffentlicht).
      # Bleiben mehr als ein Lauf dieser Stufe hintereinander ohne Feld, endet der Schritt mit Exit 1 und der Job wird rot
      # (GitHub meldet es) — bewusst OHNE continue-on-error: am 08./09.10. fehlte t2 einen Tag lang still. Ein Lesen der
      # Ablage, ~1 s. Mit POINT_FIELDS: '0' still.
      - name: Waechter Kartenfelder — t1 (V-RC-2)
        run: |
          cd app
          test -f scripts/point/field-watch.mjs || { echo "Producer auf main ohne Feld-Waechter — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/field-watch.mjs --repo=${{ github.workspace }} --tier=t1

  # ── Stufe 2 (51–120 h, 0,10°) + Stationsprodukt — viermal täglich ────────
  t2:
    # `needs` + `always()`: bei `tiers=all` laeuft t2 NACH t1 (nie zwei Publisher gleichzeitig);
    # bei einem planmaessigen t2-Lauf ist t1 uebersprungen, und `always()` laesst t2 trotzdem laufen.
    needs: [t1]
    if: >-
      always() && (
      (github.event_name == 'schedule' && github.event.schedule == '30 4,10,16,22 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tiers == 'all' || github.event.inputs.tiers == 't2'))
      )
    runs-on: ubuntu-latest
    # Regel C: JOB_MAX_MIN(t2) + 10 ≤ 60 ≤ 60 (Abstand zum :30-Push der Folgestunde, seit 14.09.).
    timeout-minutes: 60
    steps:
      # NP-0b (audit/np0-datenprodukte.md §8): Jobstart fuer die Frist des Feldschritts (FIELD_END_MIN, Regel F′).
      - name: Job-Start merken (NP-0b)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            point
            index.json
            .gitattributes
          sparse-checkout-cone-mode: false
      - name: Sparse-Muster des Daten-Repos nachpruefen
        run: |
          git sparse-checkout list
          git sparse-checkout list | grep -qx '.gitattributes' || { echo "sparse-Muster ohne .gitattributes — der Publisher wuerde abbrechen"; exit 1; }
          test -f .gitattributes && echo ".gitattributes vorhanden" || echo ".gitattributes fehlt im Repo — der Publisher legt sie an"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Git identity
        run: |
          git config user.name  'buscosun-bot'
          git config user.email 'bot@buscosun.local'
      - name: Checkout producer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json QUELLENMATRIX.md public/climaGrid.json
          git checkout --quiet
          test -f QUELLENMATRIX.md || { echo "QUELLENMATRIX.md fehlt trotz sparse-Muster"; exit 1; }
      - name: Install producer dependency
        run: cd app && npm install --no-save --no-audit --no-fund bz2@1
      - name: Gate — Form der Punktdaten
        run: cd app && node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/verify-point-data.mjs
      - name: Build point cube — t2
        env:
          POINT_OUT: ${{ github.workspace }}/point
          POINT_CACHE: ${{ runner.temp }}/point-cache
          REPACK_BZIP2: '1'
          POINT_CACHE_CLEAR: 'tier'
          # AP17 (E-F-15, Jans Freigabe des Diffs): z0 der Modelle als point/static/z0mod/v1 — ohne die Zeile baut der Producer es nicht.
          POINT_Z0MOD: '1'
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs \
            scripts/point/build-point-cube.mjs --tiers=t2 \
            ${{ github.event.inputs.run && format('--run={0}', github.event.inputs.run) || '' }} \
            ${{ github.event.inputs.steps && format('--steps={0}', github.event.inputs.steps) || '' }}
      # Das Stationsprodukt (PD-B9) — eigenes Produkt, eigene Quelle (MOSMIX-L), eigene
      # Zeitachse; gemessen 55 s lokal, 38 und 58 s am Runner (Laeufe 38/42, 2026-09-14).
      # Bleibt im t2-Job (viermal taeglich); der Slot :30 erreicht jetzt den gleichzeitigen Lauf.
      # ⚠ `continue-on-error`: das Stationsprodukt darf den Cube nicht mitreissen (V-PD-28).
      - name: Build station product (MOSMIX-L)
        continue-on-error: true
        env:
          POINT_OUT: ${{ github.workspace }}/point
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/build-stations.mjs
      # AX-8: in den t2-Stunden (4/10/16/22) baut DIESER Job MOSMIX-S, weil ein eigener :50-Slot dort der dritte
      # Job im Fenster waere (Regel D). Bei ≈ :38–:40 trifft er meist den Vorlauf (S erscheint bei :39–:41);
      # `ageH` im Manifest sagt es. Uebersprungen, solange der Producer auf main `--source` nicht kennt.
      - name: Build station product (MOSMIX-S, AX-8)
        continue-on-error: true
        env:
          POINT_OUT: ${{ github.workspace }}/point
        run: |
          cd app
          grep -qF "POINT_STATIONS_SOURCE" scripts/point/build-stations.mjs || { echo "Producer auf main ohne MOSMIX-S (AX-8 nicht gepusht) — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/build-stations.mjs --source=mosmix_s
      # NP-0b (audit/np0-datenprodukte.md §3.3, §8; E-NP0-4 F1, E-NP0-5): Kartenfelder `point/field/v1/<lauf>/t2/` aus dem
      # eben gebauten Cube — buscosun Fusion mit dem Cube als einziger Quelle je Zelle („Modell · Cube“), Worker-Pool.
      # ⚠ `continue-on-error` + eigenes Timeout: ein Feld-Fehler nimmt NIE den Cube mit. Frist: fertig spaetestens
      # FIELD_END_MIN nach dem Jobstart (Regel F′: dahinter Publish + CDN + 1 min bis JOB_MAX_MIN); ist der Bau langsam,
      # entfaellt das Feld dieses Laufs. Rueckweg: POINT_FIELDS: '0' (der Publisher baut den Altbestand dann ab).
      - name: Build map fields — t2 (NP-0b)
        continue-on-error: true
        timeout-minutes: 5
        env:
          POINT_OUT: ${{ github.workspace }}/point
          POINT_FIELDS: '1'
          FIELD_JOB_T0: ${{ env.JOB_T0 }}
          FIELD_END_MIN: '10'
        run: |
          cd app
          test -f scripts/point/build-point-fields.mjs || { echo "Producer auf main ohne Kartenfelder (NP-0b nicht gepusht) — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/build-point-fields.mjs --tier=t2
      - name: Publish (committet, pusht mit Wiederholung, purgt das CDN)
        env:
          POINT_PUSH: '1'
          POINT_CDN_BUDGET_S: '180'   # AP12a, s. t1
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/publish-point.mjs --repo=${{ github.workspace }}
      # V-RC-2 (audit/regenchance.md §10): Waechter der Kartenfelder — NACH dem Publish (der Cube ist dann veroeffentlicht).
      # Bleiben mehr als ein Lauf dieser Stufe hintereinander ohne Feld, endet der Schritt mit Exit 1 und der Job wird rot
      # (GitHub meldet es) — bewusst OHNE continue-on-error: am 08./09.10. fehlte t2 einen Tag lang still. Ein Lesen der
      # Ablage, ~1 s. Mit POINT_FIELDS: '0' still.
      - name: Waechter Kartenfelder — t2 (V-RC-2)
        run: |
          cd app
          test -f scripts/point/field-watch.mjs || { echo "Producer auf main ohne Feld-Waechter — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/field-watch.mjs --repo=${{ github.workspace }} --tier=t2

  # ── Stufe 3 (126–336 h, 0,25°) — zweimal täglich, in der Gruppe VOR t2 (seit 14.09.) ─
  t3:
    needs: [t2]
    if: >-
      always() && (
      (github.event_name == 'schedule' && github.event.schedule == '55 9,21 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tiers == 'all' || github.event.inputs.tiers == 't3'))
      )
    runs-on: ubuntu-latest
    # Regel C: JOB_MAX_MIN(t3) + 10 ≤ 40 ≤ 95. Regel B gilt jetzt umgekehrt: t2 (10:30) startet
    # 35 min nach t3 (09:55) und wartet hoechstens dessen Restlaufzeit (JOB_MAX_MIN(t3) = 10 < 35).
    timeout-minutes: 40
    steps:
      # NP-0b (audit/np0-datenprodukte.md §8): Jobstart fuer die Frist des Feldschritts (FIELD_END_MIN, Regel F′).
      - name: Job-Start merken (NP-0b)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            point
            index.json
            .gitattributes
          sparse-checkout-cone-mode: false
      - name: Sparse-Muster des Daten-Repos nachpruefen
        run: |
          git sparse-checkout list
          git sparse-checkout list | grep -qx '.gitattributes' || { echo "sparse-Muster ohne .gitattributes — der Publisher wuerde abbrechen"; exit 1; }
          test -f .gitattributes && echo ".gitattributes vorhanden" || echo ".gitattributes fehlt im Repo — der Publisher legt sie an"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Git identity
        run: |
          git config user.name  'buscosun-bot'
          git config user.email 'bot@buscosun.local'
      - name: Checkout producer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json QUELLENMATRIX.md public/climaGrid.json
          git checkout --quiet
          test -f QUELLENMATRIX.md || { echo "QUELLENMATRIX.md fehlt trotz sparse-Muster"; exit 1; }
      - name: Install producer dependency
        run: cd app && npm install --no-save --no-audit --no-fund bz2@1
      - name: Gate — Form der Punktdaten
        run: cd app && node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/verify-point-data.mjs
      - name: Build point cube — t3
        env:
          POINT_OUT: ${{ github.workspace }}/point
          POINT_CACHE: ${{ runner.temp }}/point-cache
          REPACK_BZIP2: '1'
          POINT_CACHE_CLEAR: 'tier'
          # AP17 (E-F-15, Jans Freigabe des Diffs): z0 der Modelle als point/static/z0mod/v1 — ohne die Zeile baut der Producer es nicht.
          POINT_Z0MOD: '1'
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs \
            scripts/point/build-point-cube.mjs --tiers=t3 \
            ${{ github.event.inputs.run && format('--run={0}', github.event.inputs.run) || '' }} \
            ${{ github.event.inputs.steps && format('--steps={0}', github.event.inputs.steps) || '' }}
      # NP-0b (audit/np0-datenprodukte.md §3.3, §8; E-NP0-4 F1, E-NP0-5): Kartenfelder `point/field/v1/<lauf>/t3/` aus dem
      # eben gebauten Cube — buscosun Fusion mit dem Cube als einziger Quelle je Zelle („Modell · Cube“), Worker-Pool.
      # ⚠ `continue-on-error` + eigenes Timeout: ein Feld-Fehler nimmt NIE den Cube mit. Frist: fertig spaetestens
      # FIELD_END_MIN nach dem Jobstart (Regel F′: dahinter Publish + CDN + 1 min bis JOB_MAX_MIN); ist der Bau langsam,
      # entfaellt das Feld dieses Laufs. Rueckweg: POINT_FIELDS: '0' (der Publisher baut den Altbestand dann ab).
      - name: Build map fields — t3 (NP-0b)
        continue-on-error: true
        timeout-minutes: 5
        env:
          POINT_OUT: ${{ github.workspace }}/point
          POINT_FIELDS: '1'
          FIELD_JOB_T0: ${{ env.JOB_T0 }}
          FIELD_END_MIN: '10'
        run: |
          cd app
          test -f scripts/point/build-point-fields.mjs || { echo "Producer auf main ohne Kartenfelder (NP-0b nicht gepusht) — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/build-point-fields.mjs --tier=t3
      - name: Publish (committet, pusht mit Wiederholung, purgt das CDN)
        env:
          POINT_PUSH: '1'
          POINT_CDN_BUDGET_S: '180'   # AP12a, s. t1
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/publish-point.mjs --repo=${{ github.workspace }}
      # V-RC-2 (audit/regenchance.md §10): Waechter der Kartenfelder — NACH dem Publish (der Cube ist dann veroeffentlicht).
      # Bleiben mehr als ein Lauf dieser Stufe hintereinander ohne Feld, endet der Schritt mit Exit 1 und der Job wird rot
      # (GitHub meldet es) — bewusst OHNE continue-on-error: am 08./09.10. fehlte t2 einen Tag lang still. Ein Lesen der
      # Ablage, ~1 s. Mit POINT_FIELDS: '0' still.
      - name: Waechter Kartenfelder — t3 (V-RC-2)
        run: |
          cd app
          test -f scripts/point/field-watch.mjs || { echo "Producer auf main ohne Feld-Waechter — uebersprungen"; exit 0; }
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/field-watch.mjs --repo=${{ github.workspace }} --tier=t3

  # ── Stationsprodukt MOSMIX-S (AX-8, 2026-09-30) — stündlich, :50 ausser in den t2-Stunden ──
  # Kein Cube-Bau: ein Abruf (37 MB), ein Parsen (7,5 s lokal), zwölf Bündel, ein Publish. Regel A: :50 → :20
  # der Folgestunde = 30 min ≥ JOB_MAX_MIN(stations-s) 6 + 20. Regel B: hinter t1 (:40, 20 min) bleibt
  # 40 − (20 − 10) = 30 ≥ 26; t3 (:55) startet 5 min nach S und wartet hoechstens dessen Rest. Regel C:
  # 6 + 10 ≤ 20 ≤ 30. Regel D: in den t2-Stunden 4/10/16/22 gibt es den Slot NICHT (der t2-Job baut S).
  # Solange `buscosun-web/main` den Producer ohne `--source` traegt, ist der Job ein benannter Leerlauf.
  stations-s:
    needs: [t3]
    if: >-
      always() && (
      (github.event_name == 'schedule' && github.event.schedule == '50 0,1,2,3,5,6,7,8,9,11,12,13,14,15,17,18,19,20,21,23 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tiers == 'all' || github.event.inputs.tiers == 'stations-s'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            point
            index.json
            .gitattributes
          sparse-checkout-cone-mode: false
      - name: Sparse-Muster des Daten-Repos nachpruefen
        run: |
          git sparse-checkout list
          git sparse-checkout list | grep -qx '.gitattributes' || { echo "sparse-Muster ohne .gitattributes — der Publisher wuerde abbrechen"; exit 1; }
          test -f .gitattributes && echo ".gitattributes vorhanden" || echo ".gitattributes fehlt im Repo — der Publisher legt sie an"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Git identity
        run: |
          git config user.name  'buscosun-bot'
          git config user.email 'bot@buscosun.local'
      - name: Checkout producer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json QUELLENMATRIX.md
          git checkout --quiet
          test -f QUELLENMATRIX.md || { echo "QUELLENMATRIX.md fehlt trotz sparse-Muster"; exit 1; }
      - name: Install producer dependency
        run: cd app && npm install --no-save --no-audit --no-fund bz2@1
      - name: Gate — Form der Punktdaten
        run: cd app && node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/verify-point-data.mjs
      - name: Build station product (MOSMIX-S)
        id: build
        env:
          POINT_OUT: ${{ github.workspace }}/point
        run: |
          cd app
          if ! grep -qF "POINT_STATIONS_SOURCE" scripts/point/build-stations.mjs; then
            echo "Producer auf main ohne MOSMIX-S (AX-8 nicht gepusht) — Leerlauf, kein Publish"
            echo "built=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/build-stations.mjs --source=mosmix_s
          echo "built=1" >> "$GITHUB_OUTPUT"
      - name: Publish (committet, pusht mit Wiederholung, purgt das CDN)
        if: steps.build.outputs.built == '1'
        env:
          POINT_PUSH: '1'
          POINT_CDN_BUDGET_S: '60'   # AX-8: 3,2 (geschaetzt) + 1 + 1 ≤ 6 — Regel F, nach dem ersten Runner-Lauf nachrechnen
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/publish-point.mjs --repo=${{ github.workspace }}
