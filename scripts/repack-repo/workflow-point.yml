# ============================================================================
# point.yml — Punkt-Cube für buscosun Fusion (Phase PD, audit/punktdaten-versorgung.md)
#
# VORLAGE. Diese Datei gehört nach `.github/workflows/point.yml` im Daten-Repo
# `jppetry/buscosun-data` und muss dort MANUELL committet werden: eine Action darf
# ohne `workflows`-Scope keine Workflow-Datei pushen (dieselbe Einschränkung wie bei
# `workflow-build.yml`). Weicht die Vorlage vom Stand im Daten-Repo ab, läuft dort
# der alte Stand weiter.
#
# ── Warum ein EIGENER Workflow und nicht `build.yml` ─────────────────────────
# Anderer Takt (4 statt 8 Slots), andere Laufzeit (Stunden statt Minuten), andere
# Quellen. Ein gemeinsamer Job würde die Kartenlinie an die langsamste Punktquelle
# hängen — und die Kartenlinie ist die, die live sichtbar ist.
#
# ── Die vier Slots — GEMESSEN, nicht gesetzt ─────────────────────────────────
# Hier stand vorher „Lauf + 2 h" mit dem Vermerk, die Wartezeit sei in PD1 zu MESSEN.
# Nachgeholt am 2026-09-09 über `Last-Modified` der jeweils LETZTEN gebrauchten Datei,
# über vier Läufe (18z/00z/06z/12z) — die Bereitstellung ist erstaunlich stabil:
#
#   Quelle                18z     00z     06z     12z
#   ICON-D2   +48 h      1,35 h  1,36 h  1,35 h  1,35 h
#   ICON-EU  +120 h      3,53 h  3,70 h  3,55 h  3,64 h
#   IFS      +144 h      6,45 h  7,57 h  6,45 h  (noch nicht)
#
# IFS ist die langsamste tragende Quelle: 00z/12z sind die vollen `oper`-Läufe (360 h)
# und brauchen ~7,6 h, 06z/18z enden als `scda` bei 144 h und sind nach ~6,5 h da (⚠⁷).
#
# Daraus folgt der Takt — jede Quelle mit dem NEUESTEN Lauf, den sie vollständig hat:
#
#   03:50  ICON-D2 00z (01:21) · ICON-EU 00z (03:41) · global 00z (03:31) · IFS 18z (00:26)
#   09:50  ICON-D2 06z (07:21) · ICON-EU 06z (09:35) · global 06z (09:32) · IFS 00z (07:34) → volle 336 h
#   15:50  ICON-D2 12z (13:21) · ICON-EU 12z (15:38) · global 12z (15:32) · IFS 06z (12:26)
#   21:50  ICON-D2 18z (19:21) · ICON-EU 18z (21:38) · global 18z (21:32) · IFS 12z (19:34) → volle 336 h
#
# Der alte Takt (:10 der Stunden 02/08/14/20) lieferte zwar auch vollständige Felder,
# aber ICON-EU und ICON global jeweils aus dem VORIGEN Lauf — sie sind zu diesen Zeiten
# noch nicht fertig. Der neue holt sie sechs Stunden frischer.
#
# Jenseits 144 h bleibt in den Zwischenslots der letzte volle IFS-Lauf stehen. Das ist
# korrekt und steht im Manifest (`sources[].runAt`, `tiers[].ageH`), damit das Produkt
# das Alter je Bereich ehrlich ausweisen kann.
#
# ── Warum :50 und nicht :10 ──────────────────────────────────────────────────
# Die Kartenlinie (`build.yml`) publiziert um :20 der Stunden 0/3/6/9/12/15/18/21 und
# um :30 der Stunden 2/5/8/11/14/17/20/23 — und sie **force-pusht**: sie klont flach,
# wirft `.git` weg und ersetzt `main`. Was zwischen ihrem Klon und ihrem Push hier
# ankommt, ist danach spurlos weg (kein Konflikt, keine Meldung).
# Ein Punkt-Lauf braucht gemessen 20–40 min. Bei :10 der Stunden 02/08/14/20 landete
# sein Push also GENAU auf dem :30-Slot derselben Stunde — eine Kollision durch
# Konstruktion. Bei :50 der Stunden 03/09/15/21 sind es **100 Minuten** bis zum
# nächsten Repack-Push. `publish-point.mjs` sieht zusätzlich nach dem Push nach und
# purgt das CDN nur, wenn die Dateien wirklich auf `origin/main` stehen.
#
# ── Was hier NICHT passiert ──────────────────────────────────────────────────
# Gelände. Dieses Repo speichert Wetterdaten (Jans Entscheidung 2026-09-09): Höhe kommt
# aus den Terrarium-Kacheln, die die App ohnehin lädt, Landbedeckung aus dem Spiegel
# `jppetry/buscosun-worldcover`, und die Ableitungen rechnet der Client am Punkt.
# ============================================================================

name: point

on:
  schedule:
    # Gemessen, s. Kopf: jede Quelle mit dem neuesten Lauf, den sie VOLLSTÄNDIG hat,
    # und 100 min Abstand zum Force-Push der Kartenlinie.
    - cron: '50 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      run:
        description: 'Fester ICON-D2-Lauf YYYYMMDDHH (leer = Discovery)'
        required: false
      steps:
        description: 'Schrittbereich, z. B. 0-48 (leer = volle Stufe)'
        required: false

concurrency:
  # Der Radar-Spiegel pusht in DIESES Repo alle 1–2 Minuten. Zwei Publisher
  # gleichzeitig sind der Kern von V-BW-58 — deshalb nie zwei Punktläufe parallel.
  group: point
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 75 = Jans Laufzeitbudget (60 min) + Publish-Reserve. Die alten 330 min haetten
    # einen haengenden Lauf still bis in den naechsten Slot laufen lassen; der Verifier
    # verlangt JOB_MAX_MIN + 10 <= timeout <= engster Slot-Abstand (PD-C1).
    timeout-minutes: 75
    steps:
      # SPARSE: der Radar-Spiegel macht den Baum gross (gemessen 279 MiB am 2026-09-09).
      # Der Cube-Job braucht davon nichts ausser `point/` — UND `.gitattributes`.
      #
      # ⚠ Die dritte Zeile hat sieben Cron-Laeufe gekostet (2026-09-09 … 2026-09-11):
      # der Publisher legt `.gitattributes` an (`*.bin -text`, §29) und staged sie; ein
      # sparse Checkout ohne dieses Muster laesst `git add` die Datei STILL verwerfen
      # (Exit 0). Der Publisher erkennt das und bricht ab — richtig, aber erst im Job,
      # nach 23 Minuten Bau. Lokal unsichtbar, weil hier immer der volle Baum liegt.
      # Die Liste hier und `PUBLISH_PATHS` in `scripts/point/sparseCover.mjs` prueft der
      # Verifier jetzt GEGENEINANDER, nicht per Schluesselwort.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            point
            index.json
            .gitattributes
          sparse-checkout-cone-mode: false

      # Nachpruefen, was der Checkout wirklich gesetzt hat — ein sparse-Muster, das
      # nichts trifft, meldet nichts (dieselbe Stille wie bei QUELLENMATRIX.md, §30).
      - name: Sparse-Muster des Daten-Repos nachpruefen
        run: |
          git sparse-checkout list
          git sparse-checkout list | grep -qx '.gitattributes' || { echo "sparse-Muster ohne .gitattributes — der Publisher wuerde abbrechen"; exit 1; }
          test -f .gitattributes && echo ".gitattributes vorhanden" || echo ".gitattributes fehlt im Repo — der Publisher legt sie an"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Git identity
        run: |
          git config user.name  'buscosun-bot'
          git config user.email 'bot@buscosun.local'

      # Producer aus dem Anwendungs-Repo — sparse, wie in build.yml (der volle Klon
      # maß 188 s, BW-9 §28.6). Nur `scripts/`, `src/`, `package.json` — und
      # `QUELLENMATRIX.md`.
      #
      # ⚠ Die Matrix gehört ins Set, obwohl sie „nur Doku" ist: das Gate unten gleicht
      # ihre Tabelle §1 gegen die Registry ab (der Abgleich, der am 2026-09-09 fünf
      # fehlende Einträge fand). Ohne die Datei fiel dieser Block durch — gemessen am
      # NACHGEBAUTEN Cron, nicht vermutet: frisch von GitHub geklont, sparse ausgecheckt,
      # Gate gelaufen ⇒ 230/231, und der Job wäre abgebrochen, bevor er ein Byte zieht.
      # Lokal ist das unsichtbar, weil dort immer der volle Baum liegt.
      - name: Checkout producer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json QUELLENMATRIX.md
          git checkout --quiet
          test -f QUELLENMATRIX.md || { echo "QUELLENMATRIX.md fehlt trotz sparse-Muster"; exit 1; }

      # Der Cube-Producer hängt an genau EINER Laufzeit-Abhängigkeit: `bz2`.
      # `gribDecode.ts` ist importfrei (handgeschriebener Decoder inkl. CCSDS-AEC).
      - name: Install producer dependency
        run: cd app && npm install --no-save --no-audit --no-fund bz2@1

      # Netzfreies Gate VOR dem Ingest: eine kaputte Formdefinition soll auffallen,
      # bevor 600 MiB gezogen werden.
      - name: Gate — Form der Punktdaten
        run: cd app && node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/verify-point-data.mjs

      - name: Build point cube
        env:
          POINT_OUT: ${{ github.workspace }}/point
          POINT_CACHE: ${{ runner.temp }}/point-cache
          # Das `bzip2`-Binary statt des reinen JS-Wegs (BW-9/V-BW-27: Faktor ~2,6,
          # und parallele Aufrufe laufen als Prozesse auf mehreren Kernen). Das faellt
          # bei ICON global ins Gewicht: 3,2 MiB je Feld, ~4 s rein in JS — bei
          # 36 Schritten x 11 Groessen waeren das ueber 25 Minuten nur Entpacken.
          # Fehlt das Binary, faellt die DATEI auf JS zurueck, nie der Lauf.
          REPACK_BZIP2: '1'
          # PD-C2 (V-PD-36): Plattencache nach jeder Stufe leeren, Konstanten bleiben.
          # Kalt gemessen waren es 9,1 GiB gegen 14 GB Runner-Platte; die Spitze ist
          # jetzt die groesste Stufe, nicht die Summe. Lokal ist das AUS (Messungen
          # „am selben Cache" brauchen ihn).
          POINT_CACHE_CLEAR: 'tier'
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs \
            scripts/point/build-point-cube.mjs \
            ${{ github.event.inputs.run && format('--run={0}', github.event.inputs.run) || '' }} \
            ${{ github.event.inputs.steps && format('--steps={0}', github.event.inputs.steps) || '' }}

      # Das Stationsprodukt (PD-B9). Eigener Schritt, weil es ein eigenes Produkt ist:
      # eigene Quelle (MOSMIX-L), eigene Zeitachse (stuendlich bis 247 h), eigenes
      # Manifest. Gemessen 55 s — 76 MiB Abruf, 30 s Stromparsen.
      #
      # ⚠ `continue-on-error`: das Stationsprodukt darf den Cube nicht mitreissen.
      # MOSMIX-L erscheint bei Lauf + 72…79 min, dieser Job laeuft bei Lauf + 50 min;
      # faellt die Datei einmal aus, ist der Cube trotzdem vollstaendig. Ein fehlendes
      # `point/stations/<lauf>/` ist sichtbar (index.json listet die Laeufe), ein
      # abgebrochener Lauf waere teurer.
      - name: Build station product (MOSMIX-L)
        continue-on-error: true
        env:
          POINT_OUT: ${{ github.workspace }}/point
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs             scripts/point/build-stations.mjs

      # Der Publisher committet, pusht (mit Wiederholung) und purgt DANACH den Index
      # am CDN. Ein zweiter Push auf Job-Ebene waere nicht nur doppelt — er wuerde die
      # Reihenfolge zerreissen: der Purge steht im Publisher HINTER dem Push, und ohne
      # eigenen Push kaeme er nie dort an.
      #
      # V-BW-58 (Publish scheiterte am 2026-09-04 dreimal, 15z fiel ganz aus) ist damit
      # an EINER Stelle geheilt: `publish-point.mjs` versucht fuenfmal mit
      # `pull --rebase` dazwischen.
      - name: Publish (committet, pusht mit Wiederholung, purgt das CDN)
        env:
          # OHNE diese Variable schreibt der Publisher nur lokal und pusht NICHT.
          # Der erste Push in Produktion ist Jans Gate (CLAUDE.md, STOPP & FRAGEN) —
          # die Zeile ist bewusst die einzige Stelle, an der das umschaltet.
          POINT_PUSH: '1'
        run: |
          cd app
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs scripts/point/publish-point.mjs --repo=${{ github.workspace }}
