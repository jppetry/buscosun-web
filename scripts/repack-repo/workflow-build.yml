# ============================================================================
# Producer-Batch des Daten-Repos (Phase BW-2, buscosun-web/audit/bandbreite.md)
# ============================================================================
# ⚠️ Diese Datei wird in `buscosun-web/scripts/repack-repo/workflow-build.yml`
# GEPFLEGT und von `scripts/publish-repack.mjs` hierher ausgelegt. Änderungen
# gehören dorthin, sonst überschreibt der nächste Publish sie.
#
# ── Warum der Batch HIER läuft und nicht in buscosun-web ────────────────────
# Der `GITHUB_TOKEN` einer Action schreibt nur in ihr EIGENES Repo. Ein Batch in
# `buscosun-web`, der hierher pusht, bräuchte einen PAT als Secret — und der Plan
# schließt Secrets aus. Hier läuft er mit dem Standard-Token, ohne Geheimnis.
# `buscosun-web` bekommt dadurch KEINE neue Workflow-Datei; seine Warm-Crons
# lesen nur `index.json` und hängen den Manifest-Abschnitt an.
#
# Der Producer selbst wird aus `buscosun-web` geklont (öffentlich, kein Token) —
# er MUSS dieselben Module benutzen wie der Client, sonst zeichnet die Karte
# andere Werte als die Punktabfrage nennt. Eine Kopie hier wäre genau der
# Drift, den BW-1 strukturell ausgeschlossen hat.
# ============================================================================

name: build

on:
  schedule:
    # BW-9 (§28.5 B1): am DWD-Takt statt stündlich. ICON-D2 läuft alle 3 h; der
    # DWD legt Schritt 000 bei Lauf + 44 min ab und die 48 Schritte bei + 81 min,
    # alles bis Schritt 27 (der Repack-Horizont) bei ≈ + 66 min — gemessen an
    # 8 Läufen auf die Minute gleich (audit/bandbreite.md §28.1; §28.10: das
    # icosahedral-Gitter liegt ~7 min früher, zählt aber nicht — der Producer
    # liest regular-lat-lon). Der Slot liegt bei Lauf + 20 —
    # also sicher VOR den Daten: GitHub startet 7–31 min später (+27…+51), der
    # Producer wartet dann selbst auf den Lauf und seine Schritte
    # (REPACK_WAIT_SEC, Budget 40 min reicht bis +67…+91). So liegt der Jitter
    # in der Wartezeit statt auf dem kritischen Pfad: Versatz DWD → CDN ≈
    # Poll-Pause + Rechnen + Push + CDN. Ein Slot bei + 40 (erste Fassung) hätte
    # bei spätem Start (+71) die Daten (+59) schon 12 min liegen lassen.
    - cron: '20 0,3,6,9,12,15,18,21 * * *'
    # Sicherheitsnetz bei Lauf + 150 min (DWD spät, Slot ausgefallen): steigt bei
    # vollständigem Lauf in ~0,5 min aus — sofern diese Datei den `steps=`-Stand
    # trägt (§28.3: der alte Stand rechnete stündlich neu).
    - cron: '30 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch: {}

concurrency:
  group: repack-build
  cancel-in-progress: false

permissions:
  contents: write             # force-pusht die frische Historie

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60         # Warteschleife (≤ 40 min) + Rechnen (2–10 min) + Publish
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BW-9: gemessen am 2026-08-25 (#42): der volle Klon von buscosun-web dauerte
      # 188 s — mehr als Publish + Purge zusammen. Der Producer braucht nur
      # `scripts/` und `src/` (plus package.json für `npm install`); alles andere
      # (public/, Fire-Artefakte, Doku) bleibt draußen: blob-loser Klon + Sparse-
      # Checkout. Bleibt es beim vollen Klon, ist es kein Fehler, nur langsam.
      - name: Checkout producer (public, no token, sparse)
        run: |
          git clone --depth=1 --quiet --filter=blob:none --no-checkout https://github.com/jppetry/buscosun-web.git app
          cd app
          git sparse-checkout set --no-cone scripts src package.json
          git checkout --quiet

      # Der Producer hängt an genau EINER Laufzeit-Abhängigkeit: `bz2`.
      # `gribDecode.ts` ist importfrei (handgeschriebener Decoder inkl. CCSDS-AEC),
      # `windFrameBuild.ts`/`tempFrameBuild.ts` importieren nur Typen. Ein volles
      # `npm ci` wäre hier reine Wartezeit.
      - name: Install producer dependency
        working-directory: app
        run: npm install --no-save --no-audit --no-fund bz2

      # Nicht nur WELCHER Lauf abliegt, sondern mit WIE VIELEN Schritten: fängt
      # der Producer einen Lauf, den das DWD noch hochschiebt, fehlen einzelne
      # Schritte (am 2026-08-23 real: Wind 4 und 5). Ein Ausstieg allein auf die
      # Lauf-Kennung schriebe diese Lücke für drei Stunden fest.
      # BW-6b: die Schrittzahl JEDER Familie als EIN JSON — die Familienliste
      # lebt in `scripts/lib/repackManifest.mjs`, nicht hier.
      - name: Which run do we already have — and how complete?
        id: have
        run: |
          node -e "
            let r = {};
            try { r = require('./index.json').runs?.[0] ?? {}; } catch {}
            const steps = {};
            for (const [k, v] of Object.entries(r)) if (v && Array.isArray(v.steps)) steps[k] = v.steps.length;
            console.log('run=' + (r.run ?? ''));
            console.log('steps=' + JSON.stringify(steps));
            // Die zwei Alt-Ausgaben bleiben, damit ein Producer-Stand VOR BW-6b
            // (der nur REPACK_HAVE_WIND/TEMP liest) mit dieser Datei weiter
            // aussteigen kann — sonst rechnete er stündlich neu und löste
            // stündlich Manifest-Commits + Netlify-Builds aus (V-BW-4-Muster).
            console.log('wind=' + (r.wind?.steps?.length ?? -1));
            console.log('temp=' + (r.temp?.steps?.length ?? -1));
          " | tee -a "$GITHUB_OUTPUT"

      - name: Repack
        working-directory: app
        env:
          REPACK_SKIP_IF_RUN: ${{ steps.have.outputs.run }}
          REPACK_HAVE_STEPS: ${{ steps.have.outputs.steps }}
          REPACK_HAVE_WIND: ${{ steps.have.outputs.wind }}
          REPACK_HAVE_TEMP: ${{ steps.have.outputs.temp }}
          REPACK_OUT: ${{ github.workspace }}/app/data/repack
          # BW-9: auf den vollständigen Horizont JEDER Familie warten (Listing
          # alle 30 s, höchstens 40 min) — dann ist „Bemerken" die Poll-Pause,
          # nicht der nächste Cron-Slot. Budget erschöpft ⇒ wie bisher mit dem
          # rechnen, was liegt (skipDecision holt den Rest im nächsten Slot).
          REPACK_WAIT_SEC: '2400'
          REPACK_POLL_SEC: '30'
          # BW-9 (V-BW-27): `bzip2` des Runners statt pure-JS — gemessen 2,6×
          # schneller je Datei, byte-gleich (verify:repack). JS bleibt Fallback.
          REPACK_BZIP2: '1'
        run: |
          node --experimental-strip-types --import ./scripts/lib/register-ts.mjs \
               scripts/repack-icon-d2.mjs

      - name: Publish
        working-directory: app
        env:
          REPACK_OUT: ${{ github.workspace }}/app/data/repack
          REPACK_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          REPACK_WORK: ${{ github.workspace }}/publish
        run: |
          if [ "$(node -e "console.log(require('$REPACK_OUT/state.json').skipped)")" = "true" ]; then
            echo "Nichts Neues beim DWD — kein Publish."
            exit 0
          fi
          node scripts/publish-repack.mjs --push
