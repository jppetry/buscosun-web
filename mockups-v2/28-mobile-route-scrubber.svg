        <text x="0">08:00</text>
        <text x="167" text-anchor="middle">10:00</text>
        <text x="335" text-anchor="middle">12:00</text>
        <text x="502" text-anchor="middle">14:00</text>
        <text x="670" text-anchor="end">15:00</text>
      </g>
      
      <!-- Handle at 10:42 -->
      <g transform="translate(224, 5)">
        <circle r="18" fill="#FFFFFF"/>
        <circle r="8" fill="#A85E2E"/>
      </g>
    </g>
    
    <!-- Bottom hint -->
    <g transform="translate(40, 548)">
      <text font-size="11" fill="#A89A7A">↑ Wische über die Karte um zu scrubben</text>
    </g>
