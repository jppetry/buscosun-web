      <text x="14" y="20" font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">BEARING-WIND</text>
      <g transform="translate(14, 32)">
        <line x1="0" y1="6" x2="14" y2="6" stroke="#7A9466" stroke-width="2.5"/>
        <polygon points="14,6 10,2 10,10" fill="#7A9466"/>
        <text x="22" y="10" font-size="10" fill="#2C2A26">Rücken</text>
      </g>
      <g transform="translate(14, 52)">
