<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1624" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bg28" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D3"/>
    </linearGradient>
    <linearGradient id="mapMob28" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8DFC4"/>
      <stop offset="100%" stop-color="#D4C8A3"/>
    </linearGradient>
    <linearGradient id="rainCloudMob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7A8F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6B7A8F" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="elevationMob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B7355" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="scrubberTrackMob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A9466"/>
      <stop offset="35%" stop-color="#7A9466"/>
      <stop offset="48%" stop-color="#D4A373"/>
      <stop offset="62%" stop-color="#A85E2E"/>
      <stop offset="78%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#7A9466"/>
    </linearGradient>
    <pattern id="topo28" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 0 60 Q 30 30 60 60 T 120 60" stroke="#C4B896" stroke-width="0.8" fill="none" opacity="0.4"/>
    </pattern>
    <radialGradient id="riskPulse28">
      <stop offset="0%" stop-color="#A85E2E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A85E2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="750" height="1624" fill="url(#bg28)"/>
  
  <!-- ============ STATUS BAR ============ -->
  <g transform="translate(0, 0)">
    <rect width="750" height="60" fill="#F5F1E8"/>
    <text x="60" y="38" font-size="16" fill="#2C2A26" font-weight="600">10:42</text>
    
    <g transform="translate(600, 22)">
      <g fill="#2C2A26">
        <rect x="0" y="14" width="4" height="6" rx="1"/>
        <rect x="7" y="10" width="4" height="10" rx="1"/>
        <rect x="14" y="6" width="4" height="14" rx="1"/>
        <rect x="21" y="2" width="4" height="18" rx="1"/>
      </g>
      <text x="40" y="16" font-size="13" fill="#2C2A26" font-weight="500">5G</text>
      <g transform="translate(74, 4)">
        <rect width="32" height="14" rx="3" fill="none" stroke="#2C2A26" stroke-width="1.5"/>
        <rect x="2" y="2" width="24" height="10" rx="1" fill="#2C2A26"/>
        <rect x="34" y="4" width="2" height="6" rx="1" fill="#2C2A26"/>
      </g>
    </g>
  </g>
  
  <!-- ============ TOP BAR WITH TOUR NAME ============ -->
  <g transform="translate(0, 60)">
    <rect width="750" height="100" fill="#FFFFFF"/>
    
    <g transform="translate(40, 28)">
      <!-- Back -->
      <g>
        <g transform="translate(0, 12)" stroke="#2C2A26" stroke-width="2.5" fill="none" stroke-linecap="round">
          <line x1="0" y1="8" x2="20" y2="8"/>
          <polyline points="7,3 0,8 7,13"/>
        </g>
      </g>
      
      <!-- Tour name -->
      <g transform="translate(48, 0)">
        <text font-size="11" fill="#A89A7A" letter-spacing="2" font-weight="500">TOUR · STRAVA-IMPORT</text>
        <text y="24" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">Karwendel-Runde</text>
      </g>
      
      <!-- More button -->
      <g transform="translate(580, 12)">
        <circle cx="3" cy="6" r="2.5" fill="#5C5447"/>
        <circle cx="14" cy="6" r="2.5" fill="#5C5447"/>
        <circle cx="25" cy="6" r="2.5" fill="#5C5447"/>
      </g>
    </g>
  </g>
  
  <!-- ============ TOUR STATS STRIP ============ -->
  <g transform="translate(0, 160)">
    <rect width="750" height="60" fill="#2C2A26"/>
    
    <g transform="translate(40, 14)" font-size="11" fill="#A89A7A" letter-spacing="1.5" font-weight="500">
      <g>
        <text>52</text>
        <tspan x="0" y="0"></tspan>
        <text font-size="14" fill="#FFFFFF" font-weight="500" y="18">52 km</text>
      </g>
      <g transform="translate(140, 0)">
        <text>+ 1 240 m</text>
        <text font-size="14" fill="#FFFFFF" font-weight="500" y="18">1 240 m</text>
      </g>
      <g transform="translate(290, 0)">
        <text>MTB · 18 km/h</text>
        <text font-size="14" fill="#FFFFFF" font-weight="500" y="18">MTB · 18</text>
      </g>
      <g transform="translate(478, 0)">
        <text>Sa, 08:00</text>
        <text font-size="14" fill="#FFFFFF" font-weight="500" y="18">Sa, 08:00</text>
      </g>
    </g>
    
    <!-- Risk pill -->
    <g transform="translate(580, 14)">
      <rect width="120" height="34" rx="17" fill="#D4A373"/>
      <text x="60" y="22" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="0.4">RISIKO 56 %</text>
    </g>
  </g>
  
  <!-- ============ MAP (top half) ============ -->
  <g transform="translate(0, 220)">
    <defs>
      <clipPath id="mapClipMob28">
        <rect width="750" height="440"/>
      </clipPath>
    </defs>
    
    <g clip-path="url(#mapClipMob28)">
      <rect width="750" height="440" fill="url(#mapMob28)"/>
      <rect width="750" height="440" fill="url(#topo28)"/>
      
      <!-- Terrain -->
