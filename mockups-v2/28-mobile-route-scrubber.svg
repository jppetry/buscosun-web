        <rect x="288" y="0" width="8" height="124" fill="#6B7A8F" opacity="0.7"/>
        <rect x="306" y="0" width="8" height="124" fill="#6B7A8F"/>
        <rect x="324" y="0" width="8" height="124" fill="#6B7A8F" opacity="0.5"/>
        <rect x="342" y="0" width="8" height="124" fill="#6B7A8F" opacity="0.3"/>
      </g>
      
