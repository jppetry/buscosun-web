      <path d="M 0 92 L 60 80 L 120 60 L 180 70 L 240 40 L 300 16 L 360 8 L 420 28 L 480 60 L 540 92 L 580 100" 
            stroke="#8B7355" stroke-width="2.5" fill="none"/>
      
      <!-- Rain overlay -->
