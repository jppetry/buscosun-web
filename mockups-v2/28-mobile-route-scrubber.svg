        <text x="34" y="22" font-size="13" fill="#A89A7A" text-anchor="middle">1x</text>
        <rect x="58" y="3" width="50" height="30" rx="15" fill="#A85E2E"/>
        <text x="83" y="22" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="500">5x</text>
        <text x="138" y="22" font-size="13" fill="#A89A7A" text-anchor="middle">10x</text>
        <text x="198" y="22" font-size="13" fill="#A89A7A" text-anchor="middle">25x</text>
      </g>
    </g>
    
    <!-- Scrubber track -->
