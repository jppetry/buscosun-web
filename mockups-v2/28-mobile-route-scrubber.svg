          <rect x="-32" width="64" height="18" rx="9" fill="#A85E2E"/>
          <text y="13" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">10:42</text>
        </g>
      </g>
      
      <!-- X-axis -->
