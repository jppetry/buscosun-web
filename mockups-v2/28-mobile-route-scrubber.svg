          <line x1="420" y1="206" x2="418" y2="222"/>
          <line x1="460" y1="202" x2="458" y2="218"/>
          <line x1="500" y1="208" x2="498" y2="224"/>
        </g>
      </g>
      
      <!-- THE ROUTE -->
