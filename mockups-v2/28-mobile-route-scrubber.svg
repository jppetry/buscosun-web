        <path d="M 0 220 Q 150 160 300 180 T 600 180 T 750 200 L 750 280 L 0 280 Z" fill="#B8A480"/>
        <path d="M 0 280 Q 200 240 400 260 T 750 260 L 750 340 L 0 340 Z" fill="#A89472" opacity="0.6"/>
      </g>
      
      <!-- City labels -->
