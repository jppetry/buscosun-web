        <text x="116" text-anchor="middle">10</text>
        <text x="232" text-anchor="middle">20</text>
        <text x="348" text-anchor="middle">30</text>
        <text x="464" text-anchor="middle">40</text>
        <text x="580" text-anchor="end">52 km</text>
      </g>
    </g>
    
    <!-- Legend bottom -->
