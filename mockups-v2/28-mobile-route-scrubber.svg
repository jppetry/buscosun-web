        <!-- Current scrubber position highlight -->
        <path d="M 380 220 Q 460 180 540 200" 
              stroke="#A85E2E" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
      </g>
      
      <!-- Bearing arrows on route -->
