  <!-- LABEL -->
  <g transform="translate(40, 1600)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">28 · MOBILE ROUTENPLANER · SCRUBBER · 375 px</text>
  </g>
