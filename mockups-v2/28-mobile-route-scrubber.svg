        <text x="24" y="4">Regen</text>
      </g>
      <g transform="translate(220, 0)">
        <text fill="#A85E2E">Markierter Bereich = Risiko-Zone</text>
      </g>
    </g>
  </g>
  
  <!-- ============ STICKY BOTTOM SCRUBBER ============ -->
