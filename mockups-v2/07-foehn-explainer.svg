        <path d="M 470 120 Q 540 150 600 200 T 750 250" stroke="url(#foehnAir)" stroke-width="3" fill="none"/>
        <path d="M 470 140 Q 540 170 600 220 T 750 260" stroke="url(#foehnAir)" stroke-width="2.5" fill="none"/>
        
