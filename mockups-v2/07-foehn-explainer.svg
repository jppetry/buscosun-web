      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">ANGEWENDETE KORREKTUR</text>
      
      <g transform="translate(0, 18)">
        <rect width="320" height="68" rx="12" fill="#2C2A26"/>
        
        <g transform="translate(20, 18)">
