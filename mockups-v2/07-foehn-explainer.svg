          <text y="40" font-size="11" fill="#5C5447">Innsbruck-Region</text>
          <text y="56" font-size="10" fill="#A85E2E" font-weight="500">+5.4°C · klassischer Föhn</text>
        </g>
      </g>
      
      <g transform="translate(424, 0)">
        <rect width="200" height="80" rx="14" fill="#F5F1E8"/>
        <g transform="translate(16, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">VORARLBERG</text>
          <text y="20" font-size="14" fill="#2C2A26" font-weight="500">Rheintal</text>
          <text y="40" font-size="11" fill="#5C5447">Bregenz bis Feldkirch</text>
          <text y="56" font-size="10" fill="#C97B47" font-weight="500">+3.8°C · trocken</text>
        </g>
