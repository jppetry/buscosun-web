          <line x1="130" y1="115" x2="128" y2="125"/>
          <line x1="160" y1="112" x2="158" y2="122"/>
          <line x1="190" y1="116" x2="188" y2="126"/>
          <line x1="220" y1="114" x2="218" y2="124"/>
          <line x1="250" y1="118" x2="248" y2="128"/>
