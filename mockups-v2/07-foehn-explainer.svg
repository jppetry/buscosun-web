<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bg07" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D3"/>
    </linearGradient>
    <linearGradient id="skyDiagram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9E0DB"/>
      <stop offset="100%" stop-color="#F0E8D0"/>
    </linearGradient>
    <linearGradient id="mountainLuv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9F8868"/>
      <stop offset="100%" stop-color="#7D6A4D"/>
    </linearGradient>
    <linearGradient id="mountainLee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A89472"/>
      <stop offset="100%" stop-color="#8B7355"/>
    </linearGradient>
    <linearGradient id="foehnAir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97B47" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C97B47" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A85E2E" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="moistAir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B7A8F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6B7A8F" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="cloudRain">
      <stop offset="0%" stop-color="#6B7A8F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6B7A8F" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  
  <rect width="1440" height="900" fill="url(#bg07)"/>
  
  <!-- TOP NAV -->
  <g>
    <g transform="translate(32, 24)">
      <circle cx="14" cy="14" r="6" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.5" stroke-linecap="round">
        <line x1="14" y1="0" x2="14" y2="3"/>
        <line x1="14" y1="25" x2="14" y2="28"/>
        <line x1="0" y1="14" x2="3" y2="14"/>
        <line x1="25" y1="14" x2="28" y2="14"/>
      </g>
      <text x="42" y="20" font-size="18" font-weight="500" fill="#2C2A26" letter-spacing="-0.5">buscosun</text>
    </g>
    
    <g transform="translate(180, 30)">
      <g stroke="#5C5447" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="10" x2="14" y2="10"/>
        <line x1="0" y1="10" x2="6" y2="4"/>
        <line x1="0" y1="10" x2="6" y2="16"/>
      </g>
      <text x="24" y="15" font-size="13" fill="#5C5447">Zurück zur Karte</text>
    </g>
  </g>
  
  <!-- ============ HEADER ============ -->
  <g transform="translate(80, 90)">
    <!-- Föhn badge prominent -->
    <g>
      <rect width="146" height="32" rx="16" fill="#C97B47"/>
      <g transform="translate(13, 10)">
        <path d="M 0 7 L 5 0 L 10 7 Z" fill="#FFFFFF"/>
        <path d="M 0 14 L 5 7 L 10 14 Z" fill="#FFFFFF" opacity="0.6"/>
      </g>
      <text x="34" y="21" font-size="11" fill="#FFFFFF" font-weight="600" letter-spacing="0.5">FÖHN-LAGE AKTIV</text>
    </g>
    
    <text y="84" font-size="48" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">Süd-Föhn am Alpenrand</text>
    <text y="120" font-size="14" fill="#5C5447">Heute, 14. Mai 2026 · 11:42 · Detected via DWD ICON-D2 + DEM-Slope + Druckgradient</text>
  </g>
  
  <!-- ============ LEFT: CROSS-SECTION DIAGRAM (the killer visual) ============ -->
  <g transform="translate(80, 240)">
