        <text x="14" y="18" font-size="9" fill="#A89A7A" letter-spacing="1.5" font-weight="500">FEUCHTE</text>
        <text x="14" y="48" font-size="24" font-weight="200" fill="#2C2A26">34</text>
        <text x="42" y="48" font-size="11" fill="#5C5447">%</text>
        <text x="14" y="68" font-size="10" fill="#A85E2E" font-weight="500">extrem niedrig</text>
      </g>
      
      <g transform="translate(164, 92)">
        <rect width="156" height="80" rx="12" fill="#F5F1E8"/>
        <text x="14" y="18" font-size="9" fill="#A89A7A" letter-spacing="1.5" font-weight="500">SICHTWEITE</text>
        <text x="14" y="48" font-size="24" font-weight="200" fill="#2C2A26">50+</text>
        <text x="62" y="48" font-size="11" fill="#5C5447">km</text>
        <text x="14" y="68" font-size="10" fill="#7A9466" font-weight="500">glasklar</text>
