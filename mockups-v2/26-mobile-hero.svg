<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 2400" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bg26" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="30%" stop-color="#EDE6D3"/>
      <stop offset="100%" stop-color="#E0D6BE"/>
    </linearGradient>
    <linearGradient id="windFlowMobile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B7355" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B7355" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foehnMobile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97B47" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C97B47" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C97B47" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="liveDotPulseMobile">
      <stop offset="0%" stop-color="#7A9466" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7A9466" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Mobile frame (375px viewport scaled 2x = 750px) -->
  <rect width="750" height="2400" fill="url(#bg26)"/>
  
  <!-- Background wind streamlines -->
  <g opacity="0.4">
    <path d="M -50 380 Q 200 370 400 390 T 800 410" stroke="url(#windFlowMobile)" stroke-width="3" fill="none"/>
    <path d="M -50 450 Q 200 440 400 460 T 800 480" stroke="url(#windFlowMobile)" stroke-width="2" fill="none"/>
    <path d="M -50 520 Q 200 510 400 530 T 800 550" stroke="url(#windFlowMobile)" stroke-width="2.5" fill="none"/>
    
    <!-- Föhn diagonal -->
    <path d="M 200 700 Q 350 500 500 380 T 750 280" stroke="url(#foehnMobile)" stroke-width="4" fill="none"/>
    <path d="M 250 720 Q 400 520 550 400 T 780 300" stroke="url(#foehnMobile)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- STATUS BAR (mobile) -->
  <g transform="translate(0, 0)">
    <rect width="750" height="60" fill="#F5F1E8"/>
    <text x="60" y="38" font-size="16" fill="#2C2A26" font-weight="600">10:42</text>
    
    <!-- Signal icons -->
    <g transform="translate(600, 22)">
      <g fill="#2C2A26">
        <rect x="0" y="14" width="4" height="6" rx="1"/>
        <rect x="7" y="10" width="4" height="10" rx="1"/>
        <rect x="14" y="6" width="4" height="14" rx="1"/>
        <rect x="21" y="2" width="4" height="18" rx="1"/>
      </g>
      <text x="40" y="16" font-size="13" fill="#2C2A26" font-weight="500">5G</text>
      <g transform="translate(74, 4)">
        <rect width="32" height="14" rx="3" fill="none" stroke="#2C2A26" stroke-width="1.5"/>
        <rect x="2" y="2" width="24" height="10" rx="1" fill="#2C2A26"/>
        <rect x="34" y="4" width="2" height="6" rx="1" fill="#2C2A26"/>
      </g>
    </g>
  </g>
  
  <!-- ============ TOP NAV WITH HAMBURGER ============ -->
  <g transform="translate(40, 80)">
    <!-- Hamburger menu -->
    <g>
      <g stroke="#2C2A26" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="0" x2="32" y2="0"/>
        <line x1="0" y1="10" x2="32" y2="10"/>
        <line x1="0" y1="20" x2="24" y2="20"/>
      </g>
    </g>
    
    <!-- Logo center -->
    <g transform="translate(290, -6)">
      <circle cx="14" cy="14" r="6" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.5" stroke-linecap="round">
        <line x1="14" y1="0" x2="14" y2="3"/>
        <line x1="14" y1="25" x2="14" y2="28"/>
        <line x1="0" y1="14" x2="3" y2="14"/>
        <line x1="25" y1="14" x2="28" y2="14"/>
      </g>
      <text x="42" y="20" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.5">buscosun</text>
    </g>
    
    <!-- Right action -->
    <g transform="translate(620, -10)">
      <rect width="40" height="40" rx="20" fill="#FFFFFF" stroke="#D9D0B8"/>
      <g transform="translate(13, 12)" stroke="#5C5447" stroke-width="2" fill="none">
        <circle cx="7" cy="7" r="6"/>
        <line x1="11" y1="11" x2="16" y2="16" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  
  <!-- ============ HERO SECTION ============ -->
  <g transform="translate(40, 200)">
    <!-- Eyebrow -->
    <g>
      <line x1="0" y1="8" x2="32" y2="8" stroke="#8B7355" stroke-width="1"/>
      <text x="44" y="13" font-size="13" fill="#8B7355" letter-spacing="3" font-weight="500">DACH-REGION</text>
    </g>
    
    <!-- Main headline -->
    <g transform="translate(0, 56)">
      <text font-size="68" font-weight="200" fill="#2C2A26" letter-spacing="-2">Wetter, das</text>
      <text y="80" font-size="68" font-weight="200" fill="#2C2A26" letter-spacing="-2">seine Arbeit</text>
      <text y="160" font-size="68" font-weight="200" fill="#2C2A26" letter-spacing="-2">zeigt.</text>
      <circle cx="200" cy="156" r="5" fill="#C97B47"/>
    </g>
    
    <!-- Subheadline -->
    <text x="0" y="380" font-size="18" fill="#5C5447" letter-spacing="-0.2">Modell-Transparenz und</text>
    <text x="0" y="406" font-size="18" fill="#5C5447" letter-spacing="-0.2">DACH-Physik für DE / AT / CH.</text>
    
    <!-- Live trust signal -->
    <g transform="translate(0, 446)">
      <circle cx="6" cy="6" r="5" fill="#7A9466"/>
      <circle cx="6" cy="6" r="10" fill="url(#liveDotPulseMobile)"/>
      <text x="22" y="11" font-size="13" fill="#5C5447">Live · DWD MOSMIX · ICON-D2</text>
    </g>
  </g>
  
  <!-- ============ PRIMARY CTAs (stacked) ============ -->
  <g transform="translate(40, 720)">
    <g>
      <rect width="670" height="72" rx="36" fill="#2C2A26"/>
      <text x="335" y="44" font-size="18" fill="#F5F1E8" text-anchor="middle" font-weight="500">Standort eingeben</text>
      <g transform="translate(580, 30)" stroke="#F5F1E8" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="0" y1="8" x2="14" y2="8"/>
        <polyline points="9,3 14,8 9,13"/>
      </g>
    </g>
    
    <g transform="translate(0, 84)">
      <rect width="670" height="72" rx="36" fill="transparent" stroke="#2C2A26" stroke-width="2"/>
      <text x="335" y="44" font-size="18" fill="#2C2A26" text-anchor="middle">GPX-Route hochladen</text>
    </g>
  </g>
  
  <!-- ============ LIVE FORECAST CARD ============ -->
  <g transform="translate(40, 960)">
    <text font-size="13" fill="#A89A7A" letter-spacing="3" font-weight="500">LIVE-DEMO · MARIENPLATZ</text>
    <circle cx="270" cy="-4" r="4" fill="#7A9466"/>
    
    <g transform="translate(0, 28)">
      <rect width="670" height="660" rx="28" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <!-- Card header -->
      <g transform="translate(36, 36)">
        <text font-size="13" fill="#A89A7A" letter-spacing="2" font-weight="500">STANDORT</text>
        <text y="32" font-size="26" font-weight="500" fill="#2C2A26" letter-spacing="-0.5">München, Marienplatz</text>
        <text y="58" font-size="14" fill="#8B7355">48.137°N · 11.575°E · 519 m</text>
      </g>
      
      <!-- Föhn badge -->
      <g transform="translate(36, 130)">
        <rect width="180" height="36" rx="18" fill="#C97B47"/>
        <g transform="translate(14, 11)">
          <path d="M 0 8 L 6 0 L 12 8 Z" fill="#FFFFFF"/>
          <path d="M 0 16 L 6 8 L 12 16 Z" fill="#FFFFFF" opacity="0.6"/>
        </g>
        <text x="38" y="24" font-size="13" fill="#FFFFFF" font-weight="600" letter-spacing="0.5">FÖHN-LAGE AKTIV</text>
      </g>
      
      <!-- Big temperature -->
      <g transform="translate(36, 198)">
        <text font-size="140" font-weight="200" fill="#2C2A26" letter-spacing="-5">22°</text>
        
        <g transform="translate(240, 80)">
          <text font-size="24" fill="#5C5447" font-weight="300">± 1.2°</text>
          
          <g transform="translate(0, 18)">
            <line x1="0" y1="0" x2="0" y2="10" stroke="#A89A7A" stroke-width="1.5"/>
            <line x1="0" y1="5" x2="100" y2="5" stroke="#D9D0B8" stroke-width="1"/>
            <line x1="100" y1="0" x2="100" y2="10" stroke="#A89A7A" stroke-width="1.5"/>
            <circle cx="50" cy="5" r="4" fill="#2C2A26"/>
          </g>
          <g transform="translate(0, 38)" font-size="11" fill="#A89A7A">
            <text>21.4°</text>
            <text x="100" text-anchor="end">22.6°</text>
          </g>
        </g>
        
        <text y="160" font-size="15" fill="#5C5447">Gefühlt 24° · Föhn-bedingt +3°</text>
      </g>
      
      <!-- Confidence box -->
      <g transform="translate(36, 412)">
        <rect width="598" height="80" rx="16" fill="#F5F1E8"/>
        
        <g transform="translate(24, 22)">
          <text font-size="11" fill="#A89A7A" letter-spacing="2" font-weight="500">KONFIDENZ</text>
          <text y="26" font-size="20" fill="#2C2A26" font-weight="500">Hoch</text>
        </g>
        
        <g transform="translate(220, 38)">
          <circle r="7" fill="#7A9466"/>
          <circle cx="20" r="7" fill="#7A9466"/>
          <circle cx="40" r="7" fill="#7A9466"/>
          <circle cx="60" r="7" fill="#7A9466"/>
          <text x="84" y="6" font-size="13" fill="#5C5447">4/4 Modelle</text>
        </g>
        
        <g transform="translate(420, 24)">
          <text font-size="11" fill="#A89A7A" letter-spacing="1.5" font-weight="500">SPREAD 48H</text>
          <g transform="translate(0, 16)">
            <path d="M 0 12 L 30 10 L 60 14 L 90 12 L 120 14 L 150 18 L 154 20" 
                  stroke="#7A9466" stroke-width="1.5" fill="none" opacity="0.7"/>
            <path d="M 0 4 L 30 3 L 60 4 L 90 6 L 120 2 L 150 0 L 154 −2" 
                  stroke="#7A9466" stroke-width="1.5" fill="none" opacity="0.7"/>
          </g>
        </g>
      </g>
      
      <!-- Model chips -->
      <g transform="translate(36, 510)">
        <text font-size="11" fill="#A89A7A" letter-spacing="2" font-weight="500">AKTIVE MODELLE</text>
        
        <g transform="translate(0, 18)">
          <g>
            <rect width="142" height="56" rx="14" fill="#2C2A26"/>
            <text x="18" y="22" font-size="11" fill="#A89A7A" letter-spacing="1.2">ICON-D2</text>
            <text x="18" y="44" font-size="18" fill="#FFFFFF" font-weight="500">22.1°</text>
          </g>
          <g transform="translate(150, 0)">
            <rect width="142" height="56" rx="14" fill="#2C2A26"/>
            <text x="18" y="22" font-size="11" fill="#A89A7A" letter-spacing="1.2">MOSMIX</text>
            <text x="18" y="44" font-size="18" fill="#FFFFFF" font-weight="500">22.4°</text>
          </g>
          <g transform="translate(300, 0)">
            <rect width="142" height="56" rx="14" fill="#F5F1E8" stroke="#D9D0B8"/>
            <text x="18" y="22" font-size="11" fill="#A89A7A" letter-spacing="1.2">EPS</text>
            <text x="18" y="44" font-size="18" fill="#2C2A26" font-weight="500">21.8°</text>
          </g>
          <g transform="translate(450, 0)">
            <rect width="148" height="56" rx="14" fill="#F5F1E8" stroke="#D9D0B8"/>
            <text x="18" y="22" font-size="11" fill="#A89A7A" letter-spacing="1.2">+Bias</text>
            <text x="18" y="44" font-size="18" fill="#2C2A26" font-weight="500">−0.4°</text>
          </g>
        </g>
      </g>
      
      <!-- Source -->
      <g transform="translate(36, 614)">
        <line x1="0" y1="0" x2="598" y2="0" stroke="#E0D6BE"/>
        <text y="24" font-size="12" fill="#A89A7A">Quelle: DWD via Open-Meteo · Lauf 06:00 UTC</text>
      </g>
    </g>
  </g>
  
  <!-- ============ THREE PILLARS (stacked vertical) ============ -->
  <g transform="translate(40, 1680)">
    <text font-size="13" fill="#A89A7A" letter-spacing="3" font-weight="500">DREI PRINZIPIEN</text>
    
    <text y="56" font-size="44" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">Was uns von Windy</text>
    <text y="100" font-size="44" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">unterscheidet.</text>
    
    <g transform="translate(0, 160)">
      <!-- Pillar 1 -->
      <g>
        <rect width="670" height="160" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(28, 28)">
          <text font-size="56" font-weight="200" fill="#C4B896" letter-spacing="-2">01</text>
        </g>
        
        <g transform="translate(160, 36)">
          <text font-size="13" fill="#A89A7A" letter-spacing="3" font-weight="500">SPREAD · KONFIDENZ</text>
          <text y="32" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Vier Modelle, parallel.</text>
          <text y="58" font-size="14" fill="#5C5447">Wir zeigen Spread direkt am Wert.</text>
          <text y="80" font-size="14" fill="#5C5447">Unsicherheit wird nie geglättet.</text>
        </g>
      </g>
      
      <!-- Pillar 2 -->
      <g transform="translate(0, 176)">
        <rect width="670" height="160" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(28, 28)">
          <text font-size="56" font-weight="200" fill="#C4B896" letter-spacing="-2">02</text>
        </g>
        
        <g transform="translate(160, 36)">
          <text font-size="13" fill="#A89A7A" letter-spacing="3" font-weight="500">DACH-PHYSIK</text>
          <text y="32" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Föhn ist mehr als Temperatur.</text>
          <text y="58" font-size="14" fill="#5C5447">Föhn, Inversion, Cold-Pool —</text>
          <text y="80" font-size="14" fill="#5C5447">benannt und sichtbar als Badge.</text>
        </g>
      </g>
      
      <!-- Pillar 3 -->
      <g transform="translate(0, 352)">
        <rect width="670" height="160" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(28, 28)">
          <text font-size="56" font-weight="200" fill="#C4B896" letter-spacing="-2">03</text>
        </g>
        
        <g transform="translate(160, 36)">
          <text font-size="13" fill="#A89A7A" letter-spacing="3" font-weight="500">ROUTE · ZEIT</text>
          <text y="32" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Wetter wo Sie sein werden.</text>
          <text y="58" font-size="14" fill="#5C5447">GPX rein, 2D-Scrubber animiert</text>
          <text y="80" font-size="14" fill="#5C5447">Wetter entlang Ihrer Route.</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- ============ FOOTER ============ -->
  <g transform="translate(40, 2280)">
    <line x1="0" y1="0" x2="670" y2="0" stroke="#D9CEB0" stroke-width="0.5"/>
    
    <g transform="translate(0, 28)" font-size="12" fill="#A89A7A">
      <text>© 2026 buscosun · v0.9 Beta · Stuttgart, DE</text>
      <text y="22">Anonyme Session · keine Tracker · keine Werbung</text>
    </g>
  </g>
  
  <!-- LABEL -->
  <g transform="translate(40, 2370)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">26 · MOBILE HERO · 375 px · SESSION 3/3</text>
  </g>
</svg>
