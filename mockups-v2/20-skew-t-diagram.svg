  <!-- ============ LABEL ============ -->
  <g transform="translate(80, 1060)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">20 · SKEW-T DIAGRAMM · DESKTOP · SESSION 3/3 · v1.1 FEATURE</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">Isothermen · Adiabaten · Wind-Barbs · 6 Kennzahlen · Meteorologe-Block</text>
  </g>
</svg>
