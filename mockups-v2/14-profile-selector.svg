<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D3"/>
    </linearGradient>
  </defs>
  
  <rect width="1440" height="1100" fill="url(#bg14)"/>
  
  <!-- TOP NAV -->
  <g>
    <g transform="translate(32, 24)">
      <circle cx="14" cy="14" r="6" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.5" stroke-linecap="round">
        <line x1="14" y1="0" x2="14" y2="3"/>
        <line x1="14" y1="25" x2="14" y2="28"/>
        <line x1="0" y1="14" x2="3" y2="14"/>
        <line x1="25" y1="14" x2="28" y2="14"/>
      </g>
      <text x="42" y="20" font-size="18" font-weight="500" fill="#2C2A26" letter-spacing="-0.5">buscosun</text>
    </g>
    
    <g transform="translate(200, 30)">
      <g stroke="#5C5447" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="10" x2="14" y2="10"/>
        <line x1="0" y1="10" x2="6" y2="4"/>
        <line x1="0" y1="10" x2="6" y2="16"/>
      </g>
      <text x="24" y="15" font-size="13" fill="#5C5447">Karwendel-Runde</text>
    </g>
  </g>
  
  <!-- ============ HEADER ============ -->
  <g transform="translate(80, 100)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">PROFIL &amp; TIMING · BESTIMMT WETTER-FENSTER</text>
    <text y="56" font-size="56" font-weight="200" fill="#2C2A26" letter-spacing="-1.5">Wie schnell, wann?</text>
    <text y="100" font-size="16" fill="#5C5447">Profil &amp; Start-Zeit bestimmen wo du wann bist — und damit das Wetter entlang deiner Route.</text>
  </g>
  
  <!-- ============ PROFILE GRID (5 profiles) ============ -->
  <g transform="translate(80, 280)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">AKTIVITÄTS-PROFIL · 5 OPTIONEN</text>
    
    <g transform="translate(0, 24)">
      
      <!-- Wandern -->
      <g>
        <rect width="248" height="240" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(108, 36)">
          <g stroke="#5C5447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 16 0 L 12 14 L 20 16 L 22 32"/>
            <path d="M 12 14 L 6 22 L 0 18"/>
            <circle cx="14" cy="-4" r="4"/>
            <line x1="20" y1="16" x2="28" y2="22"/>
          </g>
        </g>
        
        <g transform="translate(24, 110)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">PROFIL 01</text>
          <text y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Wandern</text>
          <text y="46" font-size="12" fill="#5C5447">4 km/h · Pausen 15%</text>
        </g>
        
        <g transform="translate(24, 188)">
          <rect width="200" height="36" rx="18" fill="#F5F1E8" stroke="#D9D0B8" stroke-width="0.5"/>
          <text x="100" y="22" font-size="12" fill="#5C5447" text-anchor="middle">Wählen</text>
        </g>
      </g>
      
      <!-- Rennrad -->
      <g transform="translate(256, 0)">
        <rect width="248" height="240" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(98, 50)">
          <g stroke="#5C5447" stroke-width="2" fill="none" stroke-linecap="round">
            <circle cx="8" cy="20" r="10"/>
            <circle cx="38" cy="20" r="10"/>
            <line x1="8" y1="20" x2="22" y2="6"/>
            <line x1="22" y1="6" x2="38" y2="20"/>
            <line x1="22" y1="6" x2="28" y2="12"/>
            <circle cx="22" cy="6" r="2.5" fill="#5C5447"/>
          </g>
        </g>
        
        <g transform="translate(24, 110)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">PROFIL 02</text>
          <text y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Rennrad</text>
          <text y="46" font-size="12" fill="#5C5447">25 km/h · Pausen 8%</text>
        </g>
        
        <g transform="translate(24, 188)">
          <rect width="200" height="36" rx="18" fill="#F5F1E8" stroke="#D9D0B8" stroke-width="0.5"/>
          <text x="100" y="22" font-size="12" fill="#5C5447" text-anchor="middle">Wählen</text>
        </g>
      </g>
      
      <!-- MTB - ACTIVE -->
      <g transform="translate(512, 0)">
        <rect width="248" height="240" rx="20" fill="#2C2A26"/>
        
        <g transform="translate(98, 50)">
          <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round">
            <circle cx="8" cy="22" r="10"/>
            <circle cx="38" cy="22" r="10"/>
            <line x1="8" y1="22" x2="20" y2="6"/>
            <line x1="20" y1="6" x2="38" y2="22"/>
            <line x1="14" y1="22" x2="32" y2="22"/>
            <line x1="20" y1="6" x2="26" y2="12"/>
            <circle cx="20" cy="6" r="2.5" fill="#FFFFFF"/>
          </g>
        </g>
        
        <g transform="translate(24, 110)">
          <text font-size="10" fill="#A85E2E" letter-spacing="2" font-weight="600">AKTIV</text>
          <text y="22" font-size="20" font-weight="500" fill="#FFFFFF" letter-spacing="-0.3">Mountainbike</text>
          <text y="46" font-size="12" fill="#A89A7A">18 km/h · Pausen 12%</text>
        </g>
        
        <g transform="translate(24, 188)">
          <rect width="200" height="36" rx="18" fill="#A85E2E"/>
          <text x="100" y="22" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">Ausgewählt</text>
        </g>
      </g>
      
      <!-- Gravel -->
      <g transform="translate(768, 0)">
        <rect width="248" height="240" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(98, 50)">
          <g stroke="#5C5447" stroke-width="2" fill="none" stroke-linecap="round">
            <circle cx="8" cy="20" r="10"/>
            <circle cx="38" cy="20" r="10"/>
            <line x1="8" y1="20" x2="22" y2="6"/>
            <line x1="22" y1="6" x2="38" y2="20"/>
            <path d="M 4 12 Q 12 16 16 14" stroke-dasharray="2 2"/>
          </g>
        </g>
        
        <g transform="translate(24, 110)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">PROFIL 04</text>
          <text y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Gravel</text>
          <text y="46" font-size="12" fill="#5C5447">22 km/h · Pausen 10%</text>
        </g>
        
        <g transform="translate(24, 188)">
          <rect width="200" height="36" rx="18" fill="#F5F1E8" stroke="#D9D0B8" stroke-width="0.5"/>
          <text x="100" y="22" font-size="12" fill="#5C5447" text-anchor="middle">Wählen</text>
        </g>
      </g>
      
      <!-- Auto -->
      <g transform="translate(1024, 0)">
        <rect width="256" height="240" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(106, 50)">
          <g stroke="#5C5447" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="0" y="8" width="40" height="14" rx="3"/>
            <path d="M 4 8 L 8 0 L 32 0 L 36 8"/>
            <circle cx="10" cy="24" r="4"/>
            <circle cx="30" cy="24" r="4"/>
          </g>
        </g>
        
        <g transform="translate(24, 110)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">PROFIL 05</text>
          <text y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Auto-Tour</text>
          <text y="46" font-size="12" fill="#5C5447">50 km/h · Pausen 5%</text>
        </g>
        
        <g transform="translate(24, 188)">
          <rect width="208" height="36" rx="18" fill="#F5F1E8" stroke="#D9D0B8" stroke-width="0.5"/>
          <text x="104" y="22" font-size="12" fill="#5C5447" text-anchor="middle">Wählen</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- ============ CUSTOM SPEED + TIMING ROW ============ -->
  <g transform="translate(80, 600)">
    
    <!-- Custom speed override -->
    <g>
      <rect width="624" height="280" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <g transform="translate(28, 28)">
        <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">CUSTOM-SPEED · OVERRIDE</text>
        <text y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Deine durchschnittliche Geschwindigkeit</text>
        <text y="44" font-size="12" fill="#5C5447">Standard für MTB ist 18 km/h. Passe an wenn du schneller oder langsamer bist.</text>
      </g>
      
      <!-- Speed slider -->
      <g transform="translate(28, 124)">
        <text font-size="11" fill="#A89A7A" letter-spacing="1.5" font-weight="500">GESCHWINDIGKEIT</text>
        
        <g transform="translate(0, 18)">
          <rect width="568" height="6" rx="3" fill="#F5F1E8"/>
          <rect width="312" height="6" rx="3" fill="#2C2A26"/>
          <circle cx="312" cy="3" r="12" fill="#FFFFFF" stroke="#2C2A26" stroke-width="2"/>
        </g>
        
        <g transform="translate(0, 40)" font-size="10" fill="#A89A7A">
          <text x="0">5 km/h</text>
          <text x="142" text-anchor="middle">10</text>
          <text x="284" text-anchor="middle">15</text>
          <text x="426" text-anchor="middle">20</text>
          <text x="568" text-anchor="end">25 km/h</text>
        </g>
        
        <!-- Current value badge -->
        <g transform="translate(308, -28)">
          <rect x="-26" width="52" height="22" rx="11" fill="#2C2A26"/>
          <text y="15" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">18 km/h</text>
        </g>
      </g>
      
      <!-- Resulting ETA -->
      <g transform="translate(28, 220)">
        <rect width="568" height="40" rx="12" fill="#F5F1E8"/>
        <text x="20" y="25" font-size="12" fill="#5C5447">Resultierende ETA bei 52 km Tour:</text>
        <text x="380" y="25" font-size="14" fill="#2C2A26" font-weight="500">6h 50 Min</text>
        <text x="490" y="25" font-size="11" fill="#A89A7A">inkl. Pausen</text>
      </g>
    </g>
    
    <!-- Start time picker -->
    <g transform="translate(656, 0)">
      <rect width="624" height="280" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <g transform="translate(28, 28)">
        <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">START-ZEIT &amp; DATUM</text>
        <text y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.3">Wann geht's los?</text>
        <text y="44" font-size="12" fill="#5C5447">Bestimmt das Wetter-Fenster für deine Tour.</text>
      </g>
      
      <!-- Date + Time pickers -->
      <g transform="translate(28, 116)">
        <!-- Date -->
        <g>
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">DATUM</text>
          <g transform="translate(0, 14)">
            <rect width="280" height="48" rx="14" fill="#F5F1E8" stroke="#D9D0B8" stroke-width="0.5"/>
            <g transform="translate(16, 16)" stroke="#5C5447" stroke-width="1.5" fill="none">
              <rect x="0" y="2" width="16" height="14" rx="2"/>
              <line x1="0" y1="6" x2="16" y2="6"/>
              <line x1="4" y1="0" x2="4" y2="4"/>
              <line x1="12" y1="0" x2="12" y2="4"/>
            </g>
            <text x="50" y="30" font-size="14" fill="#2C2A26" font-weight="500">Sa, 18. Mai 2026</text>
          </g>
        </g>
        
        <!-- Time -->
        <g transform="translate(288, 0)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">START-ZEIT</text>
          <g transform="translate(0, 14)">
            <rect width="280" height="48" rx="14" fill="#F5F1E8" stroke="#D9D0B8" stroke-width="0.5"/>
            <g transform="translate(16, 16)" stroke="#5C5447" stroke-width="1.5" fill="none">
              <circle cx="8" cy="8" r="7"/>
              <polyline points="8,3 8,8 11,10" stroke-linecap="round"/>
            </g>
            <text x="50" y="30" font-size="14" fill="#2C2A26" font-weight="500">08:00</text>
            <text x="100" y="30" font-size="10" fill="#A89A7A">geänd. Empfehlung 06:00</text>
          </g>
        </g>
      </g>
      
      <!-- Sunrise / sunset reference -->
      <g transform="translate(28, 220)">
        <rect width="568" height="40" rx="12" fill="#F5F1E8"/>
        <g transform="translate(20, 14)">
          <circle cx="6" cy="6" r="5" fill="#D4A373"/>
        </g>
        <text x="36" y="25" font-size="11" fill="#5C5447">Sonnenaufgang: 05:42 · Sonnenuntergang: 20:34 · Tageslicht 14h 52</text>
      </g>
    </g>
  </g>
  
  <!-- ============ SAMPLING SETTINGS ============ -->
  <g transform="translate(80, 900)">
    <rect width="1280" height="100" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    
    <g transform="translate(28, 24)">
      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">SAMPLING-DICHTE · WETTER-PUNKTE ENTLANG ROUTE</text>
      <text y="22" font-size="14" fill="#5C5447">Wie viele Wetter-Stichproben pro Route? Mehr = präziser, langsamer.</text>
    </g>
    
    <g transform="translate(820, 32)">
      <rect width="420" height="40" rx="20" fill="#F5F1E8"/>
      <text x="70" y="25" font-size="12" fill="#5C5447" text-anchor="middle">Alle 500 m</text>
      <rect x="140" y="4" width="140" height="32" rx="16" fill="#2C2A26"/>
      <text x="210" y="25" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">Alle 1 km · Standard</text>
      <text x="350" y="25" font-size="12" fill="#5C5447" text-anchor="middle">Alle 2 km</text>
    </g>
  </g>
  
  <!-- ============ LABEL ============ -->
  <g transform="translate(80, 1060)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">14 · PROFIL-SELECTOR &amp; ROUTEN-SETTINGS · DESKTOP · SESSION 2/3</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">5 Profile · Custom-Speed · Sonnenstand · Sampling</text>
  </g>
</svg>
