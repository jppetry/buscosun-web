          <rect x="628" y="56" width="6" height="64" fill="#C97B47"/>
          <rect x="636" y="36" width="6" height="84" fill="#A85E2E"/>
          <rect x="644" y="52" width="6" height="68" fill="#C97B47"/>
          <rect x="652" y="40" width="6" height="80" fill="#A85E2E"/>
