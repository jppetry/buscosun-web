          <rect x="408" y="116" width="6" height="4" fill="#A8B89A"/>
          <rect x="416" y="120" width="6" height="2" fill="#A8B89A"/>
          <rect x="424" y="108" width="6" height="12" fill="#A8B89A"/>
          <rect x="432" y="100" width="6" height="20" fill="#D4A373"/>
          <rect x="440" y="96" width="6" height="24" fill="#D4A373"/>
          <rect x="448" y="120" width="6" height="6" fill="#A8B89A"/>
          <rect x="456" y="92" width="6" height="28" fill="#D4A373"/>
          <rect x="464" y="88" width="6" height="32" fill="#D4A373"/>
