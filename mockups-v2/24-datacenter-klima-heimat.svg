<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1500" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bg24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D3"/>
    </linearGradient>
  </defs>
  
  <rect width="1440" height="1500" fill="url(#bg24)"/>
  
  <!-- TOP NAV -->
  <g>
    <g transform="translate(32, 24)">
      <circle cx="14" cy="14" r="6" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.5" stroke-linecap="round">
        <line x1="14" y1="0" x2="14" y2="3"/>
        <line x1="14" y1="25" x2="14" y2="28"/>
        <line x1="0" y1="14" x2="3" y2="14"/>
        <line x1="25" y1="14" x2="28" y2="14"/>
      </g>
      <text x="42" y="20" font-size="18" font-weight="500" fill="#2C2A26" letter-spacing="-0.5">buscosun</text>
    </g>
    
    <g transform="translate(700, 18)">
      <rect width="200" height="40" rx="20" fill="#2C2A26"/>
      <text x="100" y="25" font-size="12" fill="#F5F1E8" text-anchor="middle" font-weight="500">Datacenter · v1.3</text>
    </g>
  </g>
  
  <!-- ============ TAB BAR ============ -->
  <g transform="translate(80, 100)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">DATACENTER · HISTORISCHE WETTER-WERKZEUGE</text>
    
    <g transform="translate(0, 24)">
      <g>
        <rect width="316" height="56" rx="14" fill="#FFFFFF" stroke="#E0D6BE"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">01</text>
          <text y="22" font-size="15" fill="#5C5447" font-weight="500">Mein Tag in der Geschichte</text>
        </g>
      </g>
      
      <g transform="translate(324, 0)">
        <rect width="316" height="56" rx="14" fill="#FFFFFF" stroke="#E0D6BE"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">02</text>
          <text y="22" font-size="15" fill="#5C5447" font-weight="500">Wetter-Archäologie</text>
        </g>
      </g>
      
      <g transform="translate(648, 0)">
        <rect width="316" height="56" rx="14" fill="#2C2A26"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">03 · AKTIV</text>
          <text y="22" font-size="15" fill="#FFFFFF" font-weight="500">Klima-Heimat</text>
        </g>
      </g>
      
      <g transform="translate(972, 0)">
        <rect width="308" height="56" rx="14" fill="#FFFFFF" stroke="#E0D6BE"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">04</text>
          <text y="22" font-size="15" fill="#5C5447" font-weight="500">Modell-Verifikation</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- ============ HEADER ============ -->
  <g transform="translate(80, 220)">
    <text y="48" font-size="56" font-weight="200" fill="#2C2A26" letter-spacing="-1.5">Wie hat sich</text>
    <text y="100" font-size="56" font-weight="200" fill="#2C2A26" letter-spacing="-1.5">dein Klima verändert?</text>
    <text y="144" font-size="16" fill="#5C5447">30-Jahres-Vergleich für deine Stadt. Klimanormalperioden nach WMO-Standard.</text>
  </g>
  
  <!-- ============ CITY SELECTOR ============ -->
  <g transform="translate(80, 420)">
    <rect width="1280" height="80" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    
    <g transform="translate(28, 22)">
      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">DEINE STADT</text>
      <g transform="translate(0, 14)">
        <rect width="400" height="44" rx="14" fill="#F5F1E8"/>
        <g transform="translate(16, 14)" stroke="#5C5447" stroke-width="1.5" fill="none">
          <path d="M 8 0 C 3 0 0 3 0 8 C 0 14 8 20 8 20 C 8 20 16 14 16 8 C 16 3 13 0 8 0 Z"/>
          <circle cx="8" cy="8" r="3" fill="#5C5447"/>
        </g>
        <text x="44" y="28" font-size="15" fill="#2C2A26" font-weight="500">Stuttgart, Baden-Württemberg</text>
      </g>
    </g>
    
    <!-- Climate periods -->
    <g transform="translate(560, 22)">
      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">KLIMANORMALPERIODEN · WMO</text>
      <g transform="translate(0, 14)" font-size="11" fill="#5C5447">
        <g>
          <rect width="120" height="44" rx="12" fill="#F5F1E8"/>
          <text x="60" y="20" font-size="12" fill="#2C2A26" text-anchor="middle" font-weight="500">1961–1990</text>
          <text x="60" y="36" font-size="9" fill="#A89A7A" text-anchor="middle">Referenz</text>
        </g>
        <g transform="translate(128, 0)">
          <rect width="120" height="44" rx="12" fill="#F5F1E8"/>
          <text x="60" y="20" font-size="12" fill="#2C2A26" text-anchor="middle" font-weight="500">1991–2020</text>
          <text x="60" y="36" font-size="9" fill="#A89A7A" text-anchor="middle">aktuell WMO</text>
        </g>
        <g transform="translate(256, 0)">
          <rect width="120" height="44" rx="12" fill="#2C2A26"/>
          <text x="60" y="20" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="500">2020–heute</text>
          <text x="60" y="36" font-size="9" fill="#A89A7A" text-anchor="middle">rolling 5y</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- ============ MAIN STATS — 4 BIG NUMBERS ============ -->
  <g transform="translate(80, 540)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">KERN-KENNZAHLEN · VERGLEICH 1961-90 vs HEUTE</text>
    
    <g transform="translate(0, 24)">
      <!-- Annual mean temperature -->
      <g>
        <rect width="304" height="180" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(24, 24)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">JAHRES-MITTEL</text>
        </g>
        
        <g transform="translate(24, 56)">
          <text font-size="11" fill="#A89A7A">1961–90</text>
          <text x="80" y="0" font-size="22" font-weight="300" fill="#5C5447">9.0°</text>
          
          <g transform="translate(0, 26)">
            <text font-size="11" fill="#A89A7A">heute</text>
            <text x="80" y="0" font-size="40" font-weight="200" fill="#A85E2E" letter-spacing="-1">11.4°</text>
          </g>
        </g>
        
        <g transform="translate(24, 142)">
          <rect width="256" height="22" rx="11" fill="#FAEEDA"/>
          <text x="128" y="15" font-size="11" fill="#A85E2E" text-anchor="middle" font-weight="600" letter-spacing="0.5">+ 2.4°C WÄRMER</text>
        </g>
      </g>
      
      <!-- Frost days -->
      <g transform="translate(320, 0)">
        <rect width="304" height="180" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(24, 24)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">FROST-TAGE / JAHR</text>
        </g>
        
        <g transform="translate(24, 56)">
          <text font-size="11" fill="#A89A7A">1961–90</text>
          <text x="80" y="0" font-size="22" font-weight="300" fill="#5C5447">96</text>
          
          <g transform="translate(0, 26)">
            <text font-size="11" fill="#A89A7A">heute</text>
            <text x="80" y="0" font-size="40" font-weight="200" fill="#3A6FA8" letter-spacing="-1">62</text>
          </g>
        </g>
        
        <g transform="translate(24, 142)">
          <rect width="256" height="22" rx="11" fill="#E8F0FA"/>
          <text x="128" y="15" font-size="11" fill="#3A6FA8" text-anchor="middle" font-weight="600" letter-spacing="0.5">− 34 TAGE WENIGER FROST</text>
        </g>
      </g>
      
      <!-- Heat days -->
      <g transform="translate(640, 0)">
        <rect width="304" height="180" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(24, 24)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">HITZE-TAGE &gt; 30° / JAHR</text>
        </g>
        
        <g transform="translate(24, 56)">
          <text font-size="11" fill="#A89A7A">1961–90</text>
          <text x="80" y="0" font-size="22" font-weight="300" fill="#5C5447">4.2</text>
          
          <g transform="translate(0, 26)">
            <text font-size="11" fill="#A89A7A">heute</text>
            <text x="80" y="0" font-size="40" font-weight="200" fill="#A85E2E" letter-spacing="-1">14.8</text>
          </g>
        </g>
        
        <g transform="translate(24, 142)">
          <rect width="256" height="22" rx="11" fill="#FAEEDA"/>
          <text x="128" y="15" font-size="11" fill="#A85E2E" text-anchor="middle" font-weight="600" letter-spacing="0.5">+ 250 % MEHR HITZE-TAGE</text>
        </g>
      </g>
      
      <!-- Annual rainfall -->
      <g transform="translate(960, 0)">
        <rect width="320" height="180" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(24, 24)">
          <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">JAHRES-NIEDERSCHLAG</text>
        </g>
        
        <g transform="translate(24, 56)">
          <text font-size="11" fill="#A89A7A">1961–90</text>
          <text x="80" y="0" font-size="22" font-weight="300" fill="#5C5447">684 mm</text>
          
          <g transform="translate(0, 26)">
            <text font-size="11" fill="#A89A7A">heute</text>
            <text x="80" y="0" font-size="40" font-weight="200" fill="#3A6FA8" letter-spacing="-1">692</text>
            <text x="200" y="0" font-size="14" fill="#5C5447">mm</text>
          </g>
        </g>
        
        <g transform="translate(24, 142)">
