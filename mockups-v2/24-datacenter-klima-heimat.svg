  <!-- ============ FINAL INSIGHT ============ -->
  <g transform="translate(80, 1180)">
    <rect width="1280" height="180" rx="22" fill="#2C2A26"/>
    
    <g transform="translate(36, 36)">
      <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">KLIMA-EINORDNUNG</text>
      <text y="40" font-size="28" fill="#FFFFFF" font-weight="500" letter-spacing="-0.5">Stuttgart ist heute klimatisch wie Lyon vor 50 Jahren.</text>
      <text y="74" font-size="13" fill="#D9D0B8">Das Jahresmittel von 11.4° entspricht ungefähr dem, was Lyon (Frankreich) zwischen 1961 und 1990 hatte.</text>
      <text y="94" font-size="13" fill="#D9D0B8">Trend: +0.4°C pro Dekade seit 1980. Bei Fortsetzung erreicht Stuttgart bis 2050 das Klima Süd-Frankreichs.</text>
      <text y="124" font-size="11" fill="#A89A7A" font-style="italic">Quelle: DWD Climate Data Center · Stations-Daten Stuttgart-Schnarrenberg seit 1881</text>
    </g>
  </g>
  
  <!-- LABEL -->
  <g transform="translate(80, 1460)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">24 · DATACENTER 03 · KLIMA-HEIMAT · DESKTOP · v1.3</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">4 Klima-Kennzahlen · 145 Jahre Anomalie-Bars · Klima-Vergleichs-Block</text>
  </g>
