          <rect x="112" y="120" width="6" height="26" fill="#3A6FA8"/>
          <rect x="120" y="120" width="6" height="8" fill="#3A6FA8"/>
          <rect x="128" y="112" width="6" height="8" fill="#3A6FA8"/>
          <rect x="136" y="120" width="6" height="16" fill="#3A6FA8"/>
          <rect x="144" y="120" width="6" height="24" fill="#3A6FA8"/>
          
          <!-- Mid 1900s mixed -->
          <rect x="200" y="118" width="6" height="2" fill="#3A6FA8"/>
          <rect x="208" y="108" width="6" height="12" fill="#3A6FA8"/>
          <rect x="216" y="120" width="6" height="14" fill="#3A6FA8"/>
          <rect x="224" y="106" width="6" height="14" fill="#3A6FA8"/>
          <rect x="232" y="120" width="6" height="20" fill="#3A6FA8"/>
          <rect x="240" y="100" width="6" height="20" fill="#3A6FA8"/>
          <rect x="248" y="120" width="6" height="12" fill="#3A6FA8"/>
          
          <!-- 1980s onwards: warmer -->
