          <rect x="556" y="60" width="6" height="60" fill="#C97B47"/>
          <rect x="564" y="84" width="6" height="36" fill="#D4A373"/>
          <rect x="572" y="80" width="6" height="40" fill="#D4A373"/>
          <rect x="580" y="68" width="6" height="52" fill="#C97B47"/>
          <rect x="588" y="72" width="6" height="48" fill="#C97B47"/>
          <rect x="596" y="60" width="6" height="60" fill="#C97B47"/>
          <rect x="604" y="48" width="6" height="72" fill="#C97B47"/>
          <rect x="612" y="56" width="6" height="64" fill="#C97B47"/>
          
          <!-- 2010s -->
