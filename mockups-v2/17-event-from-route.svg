        <circle cx="50" cy="160" r="2.5" fill="#FFFFFF"/>
        <circle cx="560" cy="140" r="6" fill="#2C2A26"/>
        
        <!-- Worst hour callout -->
        <g transform="translate(180, 70)">
          <rect width="200" height="22" rx="11" fill="#A85E2E"/>
          <text x="100" y="15" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="0.5">REGEN AB KM 24 · 14:00</text>
        </g>
      </g>
    </g>
    
    <!-- Auto-imported stats -->
    <g transform="translate(28, 328)">
      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">AUTOMATISCH ÜBERNOMMEN</text>
      
      <g transform="translate(0, 22)">
        <rect width="600" height="60" rx="14" fill="#F5F1E8"/>
        
        <g transform="translate(20, 14)" font-size="11" fill="#5C5447">
          <g>
            <text font-size="9" fill="#A89A7A" letter-spacing="1.5">DISTANZ</text>
            <text y="20" font-size="14" fill="#2C2A26" font-weight="500">52 km</text>
          </g>
          <g transform="translate(110, 0)">
            <text font-size="9" fill="#A89A7A" letter-spacing="1.5">AUFSTIEG</text>
            <text y="20" font-size="14" fill="#2C2A26" font-weight="500">1 240 m</text>
          </g>
          <g transform="translate(220, 0)">
            <text font-size="9" fill="#A89A7A" letter-spacing="1.5">PROFIL</text>
            <text y="20" font-size="14" fill="#2C2A26" font-weight="500">MTB · 18 km/h</text>
          </g>
          <g transform="translate(390, 0)">
            <text font-size="9" fill="#A89A7A" letter-spacing="1.5">START</text>
            <text y="20" font-size="14" fill="#2C2A26" font-weight="500">Sa, 18.5. · 08:00</text>
          </g>
        </g>
      </g>
    </g>
    
    <!-- Critical km markers (the killer feature) -->
    <g transform="translate(28, 432)">
      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">KRITISCHE PUNKTE ENTLANG ROUTE</text>
      
      <g transform="translate(0, 22)">
        <!-- KM 24 -->
        <g>
          <rect width="600" height="60" rx="14" fill="#FAEEDA" stroke="#D4A373" stroke-width="1"/>
          <g transform="translate(20, 16)">
            <text font-size="9" fill="#A85E2E" letter-spacing="2" font-weight="600">KM 24 · 14:00 · ACHENSEE-PASS</text>
            <text y="22" font-size="13" fill="#2C2A26" font-weight="500">Regen 2.4 mm/h · Sicht 8 km · Wind 32 km/h</text>
          </g>
          <g transform="translate(520, 28)">
            <text font-size="18" font-weight="500" fill="#A85E2E">!</text>
          </g>
        </g>
        
        <!-- KM 38 -->
        <g transform="translate(0, 68)">
          <rect width="600" height="60" rx="14" fill="#F0F4EA" stroke="#7A9466" stroke-width="0.5"/>
          <g transform="translate(20, 16)">
            <text font-size="9" fill="#7A9466" letter-spacing="2" font-weight="600">KM 38 · 15:30 · ALPHÜTTE PRINOTH</text>
            <text y="22" font-size="13" fill="#2C2A26" font-weight="500">Wetter klart auf · gute Einkehr-Gelegenheit</text>
          </g>
          <g transform="translate(528, 28)">
            <text font-size="18" font-weight="500" fill="#7A9466">✓</text>
          </g>
        </g>
      </g>
    </g>
    
    <!-- CTA -->
    <g transform="translate(28, 624)">
      <g>
        <rect width="600" height="60" rx="20" fill="#2C2A26"/>
        <text x="300" y="38" font-size="14" fill="#F5F1E8" text-anchor="middle" font-weight="500">Mit dieser Route weiter zur Risk-Analyse →</text>
      </g>
    </g>
  </g>
  
  <!-- ============ LABEL ============ -->
  <g transform="translate(80, 1060)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">17 · EVENT-FROM-ROUTE-FLOW · DESKTOP · SESSION 2/3</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">14 Routen · Filter-Pills · Mini-Map · Auto-Import · Km-Marker</text>
  </g>
</svg>
