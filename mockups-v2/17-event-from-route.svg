      <defs>
        <clipPath id="miniMap17">
          <rect width="600" height="220" rx="14"/>
        </clipPath>
      </defs>
      
      <g clip-path="url(#miniMap17)">
        <rect width="600" height="220" fill="#E8DFC4"/>
        
        <g opacity="0.5">
          <path d="M 0 140 Q 100 90 200 110 T 400 100 T 600 130 L 600 180 L 0 180 Z" fill="#B8A480"/>
        </g>
        
        <!-- Route -->
        <path d="M 50 160 Q 130 130 200 140 T 320 110 Q 400 90 480 100 Q 540 110 560 140" 
              stroke="#2C2A26" stroke-width="3" fill="none" stroke-linecap="round"/>
        
        <!-- Risk markers (km 24 problem) -->
        <g transform="translate(280, 124)">
          <circle r="9" fill="#A85E2E"/>
          <text y="3" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">!</text>
        </g>
        
        <!-- Start / end -->
