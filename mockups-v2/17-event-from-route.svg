        <rect width="560" height="80" rx="14" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(20, 18)">
          <rect width="22" height="22" rx="4" fill="#F5F1E8" stroke="#D9D0B8"/>
          <g transform="translate(6, 7)" stroke="#5C5447" stroke-width="1.5" fill="none" stroke-linecap="round">
            <path d="M 0 4 L 4 0 L 8 4"/>
            <line x1="4" y1="0" x2="4" y2="8"/>
          </g>
        </g>
        
        <g transform="translate(56, 18)">
          <text font-size="14" fill="#2C2A26" font-weight="500">Test-Strecke Wochenende</text>
          <text y="20" font-size="11" fill="#5C5447">12 km · 80 m · Walking · Selbst gezeichnet, 28.4.</text>
          <text y="38" font-size="10" fill="#A89A7A">Stuttgart-Süd → Schlossplatz → Killesberg</text>
        </g>
        
        <g transform="translate(440, 22)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">RISIKO HEUTE</text>
          <text y="22" font-size="22" fill="#7A9466" font-weight="300">8%</text>
        </g>
      </g>
      
      <!-- Show more -->
