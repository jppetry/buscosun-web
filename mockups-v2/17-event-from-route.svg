      <text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">VORSCHAU · KARWENDEL-RUNDE</text>
      <text y="22" font-size="20" fill="#2C2A26" font-weight="500" letter-spacing="-0.3">Wetter entlang der ganzen Strecke</text>
    </g>
    
    <!-- Mini map preview -->
