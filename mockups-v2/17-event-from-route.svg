  <!-- RIGHT: Selected route preview -->
  <g transform="translate(704, 260)">
    <rect width="656" height="720" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    
    <!-- Header -->
