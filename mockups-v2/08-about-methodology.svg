<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2200" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bg08" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D3"/>
    </linearGradient>
  </defs>
  
  <rect width="1440" height="2200" fill="url(#bg08)"/>
  
  <!-- TOP NAV -->
  <g transform="translate(80, 40)">
    <g>
      <circle cx="16" cy="16" r="7" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.5" stroke-linecap="round">
        <line x1="16" y1="0" x2="16" y2="4"/>
        <line x1="16" y1="28" x2="16" y2="32"/>
        <line x1="0" y1="16" x2="4" y2="16"/>
        <line x1="28" y1="16" x2="32" y2="16"/>
      </g>
      <text x="48" y="22" font-size="20" font-weight="500" fill="#2C2A26" letter-spacing="-0.5">buscosun</text>
    </g>
    
    <g transform="translate(560, 12)" font-size="13" fill="#5C5447">
      <text>Karte</text>
      <text x="84">Route</text>
      <text x="168">Event</text>
      <text x="252">Tagesablauf</text>
      <text x="368">Datacenter</text>
    </g>
    
    <g transform="translate(1140, 0)">
      <text x="0" y="22" font-size="13" fill="#5C5447">DE</text>
      <g transform="translate(80, -8)">
        <rect width="140" height="40" rx="20" fill="#2C2A26"/>
        <text x="70" y="25" font-size="13" fill="#F5F1E8" text-anchor="middle" font-weight="500">App öffnen</text>
      </g>
    </g>
  </g>
  
  <!-- ============ HERO ============ -->
  <g transform="translate(80, 140)">
    <text font-size="11" fill="#8B7355" letter-spacing="3" font-weight="500">METHODIK · WIE WIR FORECASTEN</text>
    
    <text y="80" font-size="80" font-weight="200" fill="#2C2A26" letter-spacing="-2.5">Vollständige</text>
    <text y="174" font-size="80" font-weight="200" fill="#2C2A26" letter-spacing="-2.5">Transparenz.</text>
    
    <text y="252" font-size="18" fill="#5C5447" letter-spacing="-0.2">Jede Zahl auf buscosun.de ist auditierbar. Hier erklären wir wie unsere Vorhersagen</text>
    <text y="278" font-size="18" fill="#5C5447" letter-spacing="-0.2">entstehen, welche Modelle wir nutzen und warum wir den Spread sichtbar machen.</text>
    
    <!-- TOC -->
    <g transform="translate(0, 340)" font-size="13" fill="#8B7355">
      <text>01 · Pipeline-Architektur</text>
      <line x1="0" y1="6" x2="184" y2="6" stroke="#8B7355" stroke-width="0.5"/>
      
      <text x="220">02 · Modelle und Quellen</text>
      <line x1="220" y1="6" x2="396" y2="6" stroke="#8B7355" stroke-width="0.5"/>
      
      <text x="430">03 · DACH-Physik</text>
      <line x1="430" y1="6" x2="552" y2="6" stroke="#8B7355" stroke-width="0.5"/>
      
      <text x="588">04 · Bias-Korrektur</text>
      <line x1="588" y1="6" x2="722" y2="6" stroke="#8B7355" stroke-width="0.5"/>
      
      <text x="758">05 · Verifikation</text>
      <line x1="758" y1="6" x2="876" y2="6" stroke="#8B7355" stroke-width="0.5"/>
    </g>
  </g>
  
  <line x1="80" y1="540" x2="1360" y2="540" stroke="#D9CEB0" stroke-width="0.5"/>
  
  <!-- ============ SECTION 01: PIPELINE ============ -->
  <g transform="translate(80, 600)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">01 · PIPELINE-ARCHITEKTUR</text>
    
    <text y="56" font-size="48" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">Von DWD-Rohdaten zum Wert</text>
    <text y="80" font-size="48" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">in Ihrer App.</text>
    
    <text y="138" font-size="14" fill="#5C5447" letter-spacing="-0.1">Wir nutzen einen On-Demand-Architektur-Ansatz. Wenn Sie eine Vorhersage anfordern, fragen wir</text>
    <text y="160" font-size="14" fill="#5C5447" letter-spacing="-0.1">parallel mehrere DWD-Datenquellen ab, blenden, korrigieren und liefern in unter 3 Sekunden.</text>
  </g>
  
  <!-- Pipeline diagram -->
  <g transform="translate(80, 800)">
    <rect width="1280" height="260" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    
    <!-- 5 steps in horizontal flow -->
    <g transform="translate(40, 40)">
      <!-- Step 1: Sources -->
      <g>
        <rect width="220" height="180" rx="14" fill="#F5F1E8"/>
        <g transform="translate(20, 18)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">SCHRITT 1</text>
          <text y="20" font-size="14" fill="#2C2A26" font-weight="500">Daten-Quellen</text>
        </g>
        <g transform="translate(20, 80)" font-size="11" fill="#5C5447">
          <text>· MOSMIX-Stationen</text>
          <text y="18">· ICON-D2 (Open-Meteo)</text>
          <text y="36">· ICON-D2-EPS</text>
          <text y="54">· RADOLAN-RY</text>
          <text y="72">· WarnWetter Observ.</text>
        </g>
      </g>
      
      <!-- Arrow -->
      <g transform="translate(228, 86)" stroke="#A89A7A" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="20" y2="4"/>
        <polyline points="16,0 20,4 16,8"/>
      </g>
      
      <!-- Step 2: Blending -->
      <g transform="translate(256, 0)">
        <rect width="220" height="180" rx="14" fill="#F5F1E8"/>
        <g transform="translate(20, 18)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">SCHRITT 2</text>
          <text y="20" font-size="14" fill="#2C2A26" font-weight="500">Multi-Station-IDW</text>
        </g>
        <g transform="translate(20, 80)" font-size="11" fill="#5C5447">
          <text>K-Nearest-Stationen,</text>
          <text y="18">gewichtet nach Distanz.</text>
          <text y="36">Bias-Anchor mit MOSMIX</text>
          <text y="54">als Anker für ICON-D2.</text>
        </g>
      </g>
      
      <g transform="translate(484, 86)" stroke="#A89A7A" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="20" y2="4"/>
        <polyline points="16,0 20,4 16,8"/>
      </g>
      
      <!-- Step 3: DACH Physics -->
      <g transform="translate(512, 0)">
        <rect width="220" height="180" rx="14" fill="#FAEEDA" stroke="#C97B47" stroke-width="1"/>
        <g transform="translate(20, 18)">
          <text font-size="9" fill="#A85E2E" letter-spacing="2" font-weight="600">SCHRITT 3</text>
          <text y="20" font-size="14" fill="#2C2A26" font-weight="500">DACH-Physik</text>
        </g>
        <g transform="translate(20, 80)" font-size="11" fill="#5C5447">
          <text>· Föhn-Detection</text>
          <text y="18">· Cold-Pool-Detection</text>
          <text y="36">· Aspect-Korrektur (DEM)</text>
          <text y="54">· Lapse-Rate 3 Regime</text>
        </g>
      </g>
      
      <g transform="translate(740, 86)" stroke="#A89A7A" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="20" y2="4"/>
        <polyline points="16,0 20,4 16,8"/>
      </g>
      
      <!-- Step 4: Bias -->
      <g transform="translate(768, 0)">
        <rect width="220" height="180" rx="14" fill="#F5F1E8"/>
        <g transform="translate(20, 18)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">SCHRITT 4</text>
          <text y="20" font-size="14" fill="#2C2A26" font-weight="500">Live-Bias-Correction</text>
        </g>
        <g transform="translate(20, 80)" font-size="11" fill="#5C5447">
          <text>Kalman-Filter pro</text>
          <text y="18">Variable + Station.</text>
          <text y="36">Update alle 10 Min</text>
          <text y="54">via WarnWetter-API.</text>
        </g>
      </g>
      
      <g transform="translate(996, 86)" stroke="#A89A7A" stroke-width="1.5" fill="none" stroke-linecap="round">
        <line x1="0" y1="4" x2="20" y2="4"/>
        <polyline points="16,0 20,4 16,8"/>
      </g>
      
      <!-- Step 5: Output -->
      <g transform="translate(1024, 0)">
        <rect width="160" height="180" rx="14" fill="#2C2A26"/>
        <g transform="translate(20, 18)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">OUTPUT</text>
          <text y="20" font-size="14" fill="#FFFFFF" font-weight="500">18 Variablen</text>
        </g>
        <g transform="translate(20, 80)" font-size="11" fill="#D9D0B8">
          <text>+ Spread pro Variable</text>
          <text y="18">+ Konfidenz-Tier</text>
          <text y="36">+ Reason-Codes</text>
          <text y="54">+ Phänomen-Flags</text>
        </g>
      </g>
    </g>
  </g>
  
  <line x1="80" y1="1120" x2="1360" y2="1120" stroke="#D9CEB0" stroke-width="0.5"/>
  
  <!-- ============ SECTION 02: MODELS ============ -->
  <g transform="translate(80, 1180)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">02 · MODELLE UND QUELLEN</text>
    
    <text y="56" font-size="48" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">Vier Modelle, alle vom DWD.</text>
    
    <text y="116" font-size="14" fill="#5C5447" letter-spacing="-0.1">Wir nutzen keine kommerziellen Wetter-APIs. Alle Daten kommen direkt oder über Open-Meteo</text>
    <text y="138" font-size="14" fill="#5C5447" letter-spacing="-0.1">(als bewährter DWD-Aggregator) aus offiziellen Deutscher-Wetterdienst-Quellen.</text>
  </g>
  
  <!-- Model cards -->
  <g transform="translate(80, 1360)">
    
    <!-- ICON-D2 -->
    <g>
      <rect width="304" height="220" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <g transform="translate(24, 24)">
        <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">MODELL 01</text>
        <text y="28" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">ICON-D2</text>
        <text y="50" font-size="11" fill="#8B7355">Deutscher Wetterdienst</text>
      </g>
      
      <line x1="24" y1="88" x2="280" y2="88" stroke="#E0D6BE"/>
      
      <g transform="translate(24, 108)" font-size="11" fill="#5C5447">
        <text font-size="9" fill="#A89A7A" letter-spacing="1.5">AUFLÖSUNG</text>
        <text y="18" font-size="14" fill="#2C2A26" font-weight="500">2.2 km</text>
        
        <text x="124" font-size="9" fill="#A89A7A" letter-spacing="1.5">UPDATE</text>
        <text x="124" y="18" font-size="14" fill="#2C2A26" font-weight="500">alle 3 h</text>
        
        <text y="58" font-size="9" fill="#A89A7A" letter-spacing="1.5">LIZENZ</text>
        <text y="76" font-size="12" fill="#7A9466" font-weight="500">CC-BY 4.0 · kommerz. erlaubt</text>
        
        <text y="100" font-size="10" fill="#5C5447">via Open-Meteo aggregiert</text>
      </g>
    </g>
    
    <!-- MOSMIX -->
    <g transform="translate(320, 0)">
      <rect width="304" height="220" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <g transform="translate(24, 24)">
        <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">MODELL 02</text>
        <text y="28" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">MOSMIX</text>
        <text y="50" font-size="11" fill="#8B7355">Stations-Postprocessing</text>
      </g>
      
      <line x1="24" y1="88" x2="280" y2="88" stroke="#E0D6BE"/>
      
      <g transform="translate(24, 108)" font-size="11" fill="#5C5447">
        <text font-size="9" fill="#A89A7A" letter-spacing="1.5">STATIONEN</text>
        <text y="18" font-size="14" fill="#2C2A26" font-weight="500">5 400</text>
        
        <text x="124" font-size="9" fill="#A89A7A" letter-spacing="1.5">UPDATE</text>
        <text x="124" y="18" font-size="14" fill="#2C2A26" font-weight="500">stündlich</text>
        
        <text y="58" font-size="9" fill="#A89A7A" letter-spacing="1.5">LIZENZ</text>
        <text y="76" font-size="12" fill="#7A9466" font-weight="500">DWD GeoNutzV</text>
        
        <text y="100" font-size="10" fill="#5C5447">direkt von opendata.dwd.de</text>
      </g>
    </g>
    
    <!-- ICON-EPS -->
    <g transform="translate(640, 0)">
      <rect width="304" height="220" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <g transform="translate(24, 24)">
        <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">MODELL 03</text>
        <text y="28" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">ICON-D2-EPS</text>
        <text y="50" font-size="11" fill="#8B7355">Ensemble · 20 Member</text>
      </g>
      
      <line x1="24" y1="88" x2="280" y2="88" stroke="#E0D6BE"/>
      
      <g transform="translate(24, 108)" font-size="11" fill="#5C5447">
        <text font-size="9" fill="#A89A7A" letter-spacing="1.5">MEMBER</text>
        <text y="18" font-size="14" fill="#2C2A26" font-weight="500">20</text>
        
        <text x="124" font-size="9" fill="#A89A7A" letter-spacing="1.5">UPDATE</text>
        <text x="124" y="18" font-size="14" fill="#2C2A26" font-weight="500">alle 3 h</text>
        
        <text y="58" font-size="9" fill="#A89A7A" letter-spacing="1.5">ZWECK</text>
        <text y="76" font-size="12" fill="#C97B47" font-weight="500">Spread-Schätzung</text>
        
        <text y="100" font-size="10" fill="#5C5447">Unsicherheits-Quantifizierung</text>
      </g>
    </g>
    
    <!-- RADOLAN -->
    <g transform="translate(960, 0)">
      <rect width="304" height="220" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
      
      <g transform="translate(24, 24)">
        <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">MODELL 04</text>
        <text y="28" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">RADOLAN-RY</text>
        <text y="50" font-size="11" fill="#8B7355">Radar-Nowcast Niederschlag</text>
      </g>
      
      <line x1="24" y1="88" x2="280" y2="88" stroke="#E0D6BE"/>
      
      <g transform="translate(24, 108)" font-size="11" fill="#5C5447">
        <text font-size="9" fill="#A89A7A" letter-spacing="1.5">AUFLÖSUNG</text>
        <text y="18" font-size="14" fill="#2C2A26" font-weight="500">1 km</text>
        
        <text x="124" font-size="9" fill="#A89A7A" letter-spacing="1.5">UPDATE</text>
        <text x="124" y="18" font-size="14" fill="#2C2A26" font-weight="500">5 Min</text>
        
        <text y="58" font-size="9" fill="#A89A7A" letter-spacing="1.5">REICHWEITE</text>
        <text y="76" font-size="12" fill="#3A6FA8" font-weight="500">0–90 min Nowcast</text>
        
        <text y="100" font-size="10" fill="#5C5447">+ Motion-Estimation</text>
      </g>
    </g>
  </g>
  
  <line x1="80" y1="1640" x2="1360" y2="1640" stroke="#D9CEB0" stroke-width="0.5"/>
  
  <!-- ============ SECTION 03: WHY WE'RE DIFFERENT ============ -->
  <g transform="translate(80, 1700)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">WARUM DAS ALLES TRANSPARENT IST</text>
    
    <text y="56" font-size="48" font-weight="300" fill="#2C2A26" letter-spacing="-1.2">Drei Versprechen.</text>
    
    <g transform="translate(0, 120)">
      <!-- Promise 1 -->
      <g>
        <rect width="416" height="280" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(32, 32)">
          <text font-size="60" font-weight="200" fill="#7A9466" letter-spacing="-2">01</text>
          
          <text y="60" font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">KEIN MARKETING-WERT</text>
          <text y="92" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">Echte Zahlen, kein "RealFeel".</text>
          
          <text y="138" font-size="14" fill="#5C5447">Wir zeigen den Modell-Wert. Wenn wir korrigieren,</text>
          <text y="158" font-size="14" fill="#5C5447">sehen Sie warum (Föhn, Aspect, Bias). Keine</text>
          <text y="178" font-size="14" fill="#5C5447">proprietären "Apparent Temperature"-Tricks.</text>
          
          <text y="220" font-size="11" fill="#A89A7A" font-style="italic">Vergleich: AccuWeather "RealFeel" ist proprietär</text>
          <text y="238" font-size="11" fill="#A89A7A" font-style="italic">und undokumentiert.</text>
        </g>
      </g>
      
      <!-- Promise 2 -->
      <g transform="translate(432, 0)">
        <rect width="416" height="280" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(32, 32)">
          <text font-size="60" font-weight="200" fill="#C97B47" letter-spacing="-2">02</text>
          
          <text y="60" font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">SPREAD SICHTBAR</text>
          <text y="92" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">Unsicherheit ist Information.</text>
          
          <text y="138" font-size="14" fill="#5C5447">Wenn 4 Modelle übereinstimmen, sehen Sie das.</text>
          <text y="158" font-size="14" fill="#5C5447">Wenn sie auseinander gehen, auch. Spread ist nie</text>
          <text y="178" font-size="14" fill="#5C5447">versteckt sondern direkt am Wert: "22° ± 1.2°".</text>
          
          <text y="220" font-size="11" fill="#A89A7A" font-style="italic">Andere Apps glätten Unsicherheit weg —</text>
          <text y="238" font-size="11" fill="#A89A7A" font-style="italic">wir machen sie zur Hauptinformation.</text>
        </g>
      </g>
      
      <!-- Promise 3 -->
      <g transform="translate(864, 0)">
        <rect width="416" height="280" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
        
        <g transform="translate(32, 32)">
          <text font-size="60" font-weight="200" fill="#3A6FA8" letter-spacing="-2">03</text>
          
          <text y="60" font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">VERIFIKATION ÖFFENTLICH</text>
          <text y="92" font-size="22" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">Wir messen uns selbst.</text>
          
          <text y="138" font-size="14" fill="#5C5447">Ab v1.3 (verfügbar August 2026) zeigt unser</text>
          <text y="158" font-size="14" fill="#5C5447">Datacenter wie oft wir richtig lagen — pro Station,</text>
          <text y="178" font-size="14" fill="#5C5447">pro Modell, pro Variable, pro Lead-Time.</text>
          
          <text y="220" font-size="11" fill="#A89A7A" font-style="italic">Wir sind die erste DACH-Consumer-App mit</text>
          <text y="238" font-size="11" fill="#A89A7A" font-style="italic">öffentlicher Modell-Verifikation.</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- LABEL -->
  <g transform="translate(80, 2160)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">08 · ABOUT · METHODIK · DESKTOP</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">Pipeline-Diagramm · Modell-Karten · Drei Versprechen</text>
  </g>
</svg>
