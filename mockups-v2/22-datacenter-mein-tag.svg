      <text y="26" font-size="18" fill="#FFFFFF" font-weight="500">Heute ist der 14. Mai 8° wärmer als im Durchschnitt der 1980er Jahre.</text>
      <text y="50" font-size="12" fill="#D9D0B8">Damit liegt 2026 auf Platz 3 der wärmsten 14.-Mai-Tage seit 1881. Trend: + 0.3°C pro Dekade in München.</text>
    </g>
