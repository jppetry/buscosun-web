        <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">14. MAI 1995</text>
        <text y="20" font-size="11" fill="#5C5447">vor 31 Jahren · Sonntag</text>
      </g>
      
      <g transform="translate(28, 88)">
