        <g transform="translate(16, 16)" stroke="#5C5447" stroke-width="1.5" fill="none">
          <path d="M 8 0 C 3 0 0 3 0 8 C 0 14 8 20 8 20 C 8 20 16 14 16 8 C 16 3 13 0 8 0 Z"/>
          <circle cx="8" cy="8" r="3" fill="#5C5447"/>
        </g>
        <text x="44" y="32" font-size="16" fill="#2C2A26" font-weight="500">München · Bayern</text>
      </g>
    </g>
    
    <!-- Years to compare -->
