          <text x="-12" y="44" text-anchor="end">22°</text>
          <text x="-12" y="84" text-anchor="end">18°</text>
          <text x="-12" y="124" text-anchor="end">14°</text>
          <text x="-12" y="164" text-anchor="end">10°</text>
          <text x="-12" y="204" text-anchor="end">6°</text>
        </g>
        
        <!-- Grid -->
