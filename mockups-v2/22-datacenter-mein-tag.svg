          <text x="142" text-anchor="middle">1900</text>
          <text x="284" text-anchor="middle">1920</text>
          <text x="426" text-anchor="middle">1940</text>
          <text x="568" text-anchor="middle">1960</text>
          <text x="710" text-anchor="middle">1980</text>
          <text x="852" text-anchor="middle">2000</text>
          <text x="994" text-anchor="middle">2020</text>
          <text x="1120" text-anchor="end">2026</text>
