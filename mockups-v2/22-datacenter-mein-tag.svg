      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE6D3"/>
    </linearGradient>
    <linearGradient id="historyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C97B47" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C97B47" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <rect width="1440" height="1400" fill="url(#bg22)"/>
  
  <!-- TOP NAV -->
  <g>
    <g transform="translate(32, 24)">
      <circle cx="14" cy="14" r="6" fill="#2C2A26"/>
      <g stroke="#2C2A26" stroke-width="1.5" stroke-linecap="round">
