            <rect x="-22" width="44" height="14" rx="7" fill="#2C2A26"/>
            <text y="10" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600">1995 · 11°</text>
          </g>
          <!-- 2005 -->
