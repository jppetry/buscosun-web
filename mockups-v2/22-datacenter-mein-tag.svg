          <circle cx="220" cy="155" r="2" fill="#A89A7A"/>
          <circle cx="340" cy="142" r="2" fill="#A89A7A"/>
          <circle cx="380" cy="130" r="2" fill="#A89A7A"/>
          <circle cx="460" cy="148" r="2" fill="#A89A7A"/>
          <circle cx="520" cy="118" r="2" fill="#A89A7A"/>
          <circle cx="580" cy="130" r="2" fill="#A89A7A"/>
          <circle cx="620" cy="108" r="2" fill="#A89A7A"/>
          <circle cx="680" cy="130" r="2" fill="#A89A7A"/>
          <circle cx="700" cy="110" r="2" fill="#A89A7A"/>
          <circle cx="770" cy="118" r="2" fill="#A89A7A"/>
          <circle cx="840" cy="100" r="2" fill="#A89A7A"/>
          <circle cx="900" cy="118" r="2" fill="#A89A7A"/>
          <circle cx="940" cy="95" r="2" fill="#A89A7A"/>
          <circle cx="980" cy="105" r="2" fill="#A89A7A"/>
          <circle cx="1020" cy="80" r="2" fill="#A89A7A"/>
          
          <!-- 2026 - hot peak -->
