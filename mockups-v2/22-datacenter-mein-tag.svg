  </g>
  
  <!-- ============ DATACENTER TAB BAR ============ -->
  <g transform="translate(80, 100)">
    <text font-size="11" fill="#A89A7A" letter-spacing="3" font-weight="500">DATACENTER · HISTORISCHE WETTER-WERKZEUGE</text>
    
    <g transform="translate(0, 24)">
      <!-- Tab 1 ACTIVE -->
      <g>
        <rect width="316" height="56" rx="14" fill="#2C2A26"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="600">01 · AKTIV</text>
          <text y="22" font-size="15" fill="#FFFFFF" font-weight="500">Mein Tag in der Geschichte</text>
        </g>
      </g>
      
      <!-- Tab 2 -->
      <g transform="translate(324, 0)">
        <rect width="316" height="56" rx="14" fill="#FFFFFF" stroke="#E0D6BE"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">02</text>
          <text y="22" font-size="15" fill="#5C5447" font-weight="500">Wetter-Archäologie</text>
        </g>
      </g>
      
      <!-- Tab 3 -->
      <g transform="translate(648, 0)">
        <rect width="316" height="56" rx="14" fill="#FFFFFF" stroke="#E0D6BE"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">03</text>
          <text y="22" font-size="15" fill="#5C5447" font-weight="500">Klima-Heimat</text>
        </g>
      </g>
      
      <!-- Tab 4 -->
      <g transform="translate(972, 0)">
        <rect width="308" height="56" rx="14" fill="#FFFFFF" stroke="#E0D6BE"/>
        <g transform="translate(20, 14)">
          <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">04</text>
          <text y="22" font-size="15" fill="#5C5447" font-weight="500">Modell-Verifikation</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- ============ HEADER ============ -->
  <g transform="translate(80, 220)">
    <text y="48" font-size="56" font-weight="200" fill="#2C2A26" letter-spacing="-1.5">Wie war das Wetter,</text>
    <text y="100" font-size="56" font-weight="200" fill="#2C2A26" letter-spacing="-1.5">als du geboren wurdest?</text>
    <text y="144" font-size="16" fill="#5C5447">Vergleich des gleichen Tags über mehrere Jahrzehnte. Daten: DWD Climate Data Center 1881–heute.</text>
  </g>
  
  <!-- ============ DATE PICKER + LOCATION ============ -->
  <g transform="translate(80, 420)">
    <rect width="1280" height="120" rx="22" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    
    <!-- Date input -->
