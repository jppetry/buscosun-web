        <g transform="translate(1124, 116)">
          <text font-size="9" fill="#7A9466" font-weight="600" letter-spacing="1">14° LANGZEIT-MITTEL</text>
        </g>
        
        <!-- Trend line (climate warming) -->
        <path d="M 0 144 L 1120 80" stroke="#C97B47" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
        
        <!-- Data points: temperature each year -->
        <g>
          <!-- 1881 -->
          <circle cx="0" cy="180" r="3" fill="#5C5447"/>
          <!-- 1900 -->
          <circle cx="135" cy="160" r="3" fill="#5C5447"/>
          <!-- 1920 -->
          <circle cx="278" cy="150" r="3" fill="#5C5447"/>
          <!-- 1940 -->
          <circle cx="420" cy="140" r="3" fill="#5C5447"/>
          <!-- 1960 -->
