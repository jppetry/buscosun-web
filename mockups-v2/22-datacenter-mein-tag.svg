    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">22 · DATACENTER 01 · MEIN TAG IN DER GESCHICHTE · DESKTOP · v1.3</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">Year-Picker · 4 Vergleichs-Karten · 145 Jahre Zeitleiste · Trend-Linie</text>
