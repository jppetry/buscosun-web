          <line x1="0" y1="0" x2="1120" y2="0"/>
          <line x1="0" y1="40" x2="1120" y2="40"/>
          <line x1="0" y1="80" x2="1120" y2="80"/>
          <line x1="0" y1="120" x2="1120" y2="120"/>
          <line x1="0" y1="160" x2="1120" y2="160"/>
          <line x1="0" y1="200" x2="1120" y2="200"/>
        </g>
        
        <!-- Long-term mean line -->
