          <line x1="0" y1="6" x2="16" y2="6"/>
          <line x1="4" y1="0" x2="4" y2="4"/>
          <line x1="12" y1="0" x2="12" y2="4"/>
        </g>
        <text x="44" y="32" font-size="16" fill="#2C2A26" font-weight="500">14. Mai</text>
      </g>
    </g>
    
    <!-- Location input -->
