          <g transform="translate(882, 72)">
            <rect x="-22" width="44" height="14" rx="7" fill="#2C2A26"/>
            <text y="10" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600">2005 · 17°</text>
          </g>
          <!-- Other years scattered -->
