<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgSand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF6EA"/><stop offset="1" stop-color="#F5F1E8"/></linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dx="0" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="strongShadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="6"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="transparent"/><circle cx="20" cy="40" r="0.7" fill="#C4B896" opacity="0.18"/><circle cx="80" cy="20" r="0.5" fill="#C4B896" opacity="0.14"/><circle cx="55" cy="95" r="0.6" fill="#C4B896" opacity="0.16"/></pattern>
  </defs>
  <rect width="1440" height="980" fill="url(#bgSand)"/>
  <rect width="1440" height="980" fill="url(#grain)"/>

  <!-- NAV -->
  <g>
    <rect x="0" y="0" width="1440" height="72" fill="#FAF6EA" opacity="0.85"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#E0D6BE"/>
    <g transform="translate(64,24)"><circle cx="14" cy="14" r="12" fill="none" stroke="#C97B47" stroke-width="2"/><circle cx="14" cy="14" r="5" fill="#C97B47"/><text x="36" y="19" font-size="18" font-weight="600" fill="#2C2A26">buscosun</text><text x="118" y="19" font-size="11" fill="#8B7355">· Pro</text></g>
    <g font-size="14" fill="#5C5447"><text x="240" y="44">Start</text><text x="298" y="44">Tourenplanung</text><text x="418" y="44">Nowcast</text><text x="500" y="44" font-weight="600" fill="#2C2A26">3D-Wetter</text><rect x="497" y="56" width="82" height="2" rx="1" fill="#3A6FA8"/></g>
    <g transform="translate(1230,24)"><circle cx="14" cy="14" r="4" fill="#7A9466"/><text x="28" y="19" font-size="12" fill="#5C5447">ICON-D2 08:00 UTC</text><circle cx="180" cy="14" r="14" fill="#E0D6BE"/><text x="180" y="19" font-size="12" font-weight="600" fill="#5C5447" text-anchor="middle">JK</text></g>
  </g>

  <!-- HEADER -->
  <g transform="translate(64,104)">
    <text font-size="11" letter-spacing="0.22em" font-weight="600" fill="#3A6FA8">BETRIEBS-CHECK · DROHNE</text>
    <text y="22" font-size="20" font-weight="700" fill="#2C2A26">Vermessungsflug · Feldberg-Süd</text>
  </g>
  <!-- Export (US-E5) -->
  <g transform="translate(1148,108)">
    <rect width="100" height="36" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/>
    <path d="M 22 12 L 22 24 M 18 20 L 22 24 L 26 20 M 16 28 L 28 28" fill="none" stroke="#3A6FA8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="62" y="23" font-size="12" font-weight="600" fill="#3A6FA8" text-anchor="middle">PDF</text>
  </g>
  <g transform="translate(1256,108)">
    <rect width="120" height="36" rx="18" fill="#3A6FA8"/>
    <path d="M 20 18 a 4 4 0 0 1 6 -3 l 4 -2 a 4 4 0 1 1 1 2 l -4 2 a 4 4 0 0 1 0 2 l 4 2 a 4 4 0 1 1 -1 2 l -4 -2 a 4 4 0 0 1 -6 -3 Z" fill="#FAF6EA" opacity="0.9"/>
    <text x="74" y="23" font-size="12" font-weight="600" fill="#FAF6EA" text-anchor="middle">Link teilen</text>
  </g>

  <!-- ===== LEFT COLUMN ===== -->
  <!-- BIG GO/NO-GO STATUS (US-E3) -->
  <g transform="translate(64,168)" filter="url(#strongShadow)">
    <rect width="430" height="244" rx="20" fill="#FBE9E4" stroke="#C97B47" stroke-width="2"/>
    <!-- icon: octagon stop with cross -->
    <g transform="translate(40,52)">
      <path d="M 12 0 L 36 0 L 48 12 L 48 36 L 36 48 L 12 48 L 0 36 L 0 12 Z" fill="#D7263D"/>
      <line x1="16" y1="16" x2="32" y2="32" stroke="#FAF6EA" stroke-width="4" stroke-linecap="round"/>
      <line x1="32" y1="16" x2="16" y2="32" stroke="#FAF6EA" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="104" y="58" font-size="44" font-weight="700" fill="#D7263D">NO-GO</text>
    <text x="106" y="84" font-size="14" font-weight="600" fill="#2C2A26">jetzt 11:15 · Böen über Limit</text>
    <line x1="32" y1="112" x2="398" y2="112" stroke="#E8C9BD"/>
    <g transform="translate(32,130)" font-size="13">
      <text y="14" fill="#5C5447">Böen auf 120 m AGL</text>
      <text x="366" y="14" font-weight="700" fill="#D7263D" text-anchor="end">52 km/h</text>
      <text y="38" fill="#5C5447">dein Limit</text>
      <text x="366" y="38" font-weight="700" fill="#2C2A26" text-anchor="end">40 km/h</text>
    </g>
    <!-- next GO window -->
    <g transform="translate(32,192)">
      <rect width="366" height="36" rx="10" fill="#ECF1E6"/>
      <circle cx="22" cy="18" r="11" fill="#7A9466"/>
      <path d="M 17 18 L 21 22 L 28 13" fill="none" stroke="#FAF6EA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="23" font-size="13" fill="#2C2A26"><tspan font-weight="700">Nächstes GO-Fenster:</tspan> ab 16:30</text>
    </g>
  </g>

  <!-- HEIGHT INPUT (US-E1) -->
  <g transform="translate(64,432)" filter="url(#cardShadow)">
    <rect width="430" height="120" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="22" y="30" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">FLUGHÖHE (AGL)</text>
    <g transform="translate(22,44)">
      <rect width="240" height="48" rx="12" fill="#F5F1E8" stroke="#C4B896"/>
      <text x="20" y="32" font-size="28" font-weight="700" fill="#2C2A26">120</text>
      <text x="92" y="32" font-size="16" fill="#5C5447">m über Grund</text>
      <!-- stepper -->
      <g transform="translate(196,8)"><rect width="32" height="14" rx="4" fill="#EDE6D3"/><path d="M 16 4 L 20 10 L 12 10 Z" fill="#5C5447"/></g>
      <g transform="translate(196,26)"><rect width="32" height="14" rx="4" fill="#EDE6D3"/><path d="M 16 10 L 20 4 L 12 4 Z" fill="#5C5447"/></g>
    </g>
    <g transform="translate(280,44)">
      <text font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">SCHNELLWAHL</text>
      <g transform="translate(0,10)"><rect width="48" height="26" rx="13" fill="#FAF6EA" stroke="#E0D6BE"/><text x="24" y="17" font-size="11" fill="#5C5447" text-anchor="middle">50 m</text></g>
      <g transform="translate(56,10)"><rect width="48" height="26" rx="13" fill="#3A6FA8"/><text x="24" y="17" font-size="11" font-weight="600" fill="#FAF6EA" text-anchor="middle">120 m</text></g>
      <g transform="translate(0,42)"><rect width="48" height="26" rx="13" fill="#FAF6EA" stroke="#E0D6BE"/><text x="24" y="17" font-size="11" fill="#5C5447" text-anchor="middle">300 m</text></g>
    </g>
  </g>

  <!-- THRESHOLDS (US-E2) -->
  <g transform="translate(64,572)" filter="url(#cardShadow)">
    <rect width="430" height="164" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="22" y="30" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">EIGENE GRENZWERTE · GESPEICHERT</text>
    <!-- gust limit slider -->
    <g transform="translate(22,44)">
      <text y="14" font-size="13" fill="#5C5447">Böen-Limit</text>
      <text x="386" y="14" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="end">40 km/h</text>
      <g transform="translate(0,24)"><rect width="386" height="6" rx="3" fill="#E0D6BE"/><rect width="180" height="6" rx="3" fill="#3A6FA8"/><g transform="translate(180,3)" filter="url(#cardShadow)"><circle r="11" fill="#FAF6EA" stroke="#3A6FA8" stroke-width="2.5"/><circle r="4" fill="#3A6FA8"/></g></g>
    </g>
    <!-- mean wind limit -->
    <g transform="translate(22,98)">
      <text y="14" font-size="13" fill="#5C5447">Mittelwind-Limit</text>
      <text x="386" y="14" font-size="13" font-weight="700" fill="#2C2A26" text-anchor="end">28 km/h</text>
      <g transform="translate(0,24)"><rect width="386" height="6" rx="3" fill="#E0D6BE"/><rect width="120" height="6" rx="3" fill="#3A6FA8"/><g transform="translate(120,3)" filter="url(#cardShadow)"><circle r="11" fill="#FAF6EA" stroke="#3A6FA8" stroke-width="2.5"/><circle r="4" fill="#3A6FA8"/></g></g>
    </g>
  </g>

  <!-- ===== RIGHT COLUMN ===== -->
  <!-- GUST TIMELINE vs THRESHOLD (US-E3, N5) -->
  <g transform="translate(526,168)" filter="url(#cardShadow)">
    <rect width="850" height="370" rx="20" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="24" y="32" font-size="10" letter-spacing="0.22em" font-weight="600" fill="#3A6FA8">BÖEN AUF 120 M AGL · HEUTE</text>
    <text x="826" y="32" font-size="11" fill="#8B7355" text-anchor="end">Limit 40 km/h</text>

    <!-- plot: x 60..810 (06:00..22:00), y 60..280 (0..70 km/h) -->
    <!-- y guides -->
    <g stroke="#E0D6BE" stroke-width="1" stroke-dasharray="2 4">
      <line x1="60" y1="80" x2="810" y2="80"/>
      <line x1="60" y1="130" x2="810" y2="130"/>
      <line x1="60" y1="180" x2="810" y2="180"/>
      <line x1="60" y1="230" x2="810" y2="230"/>
      <line x1="60" y1="280" x2="810" y2="280"/>
    </g>
    <g font-size="9" fill="#8B7355" text-anchor="end">
      <text x="52" y="83">70</text><text x="52" y="133">50</text><text x="52" y="183">35</text><text x="52" y="233">18</text><text x="52" y="283">0</text>
    </g>
    <text x="30" y="170" font-size="10" font-weight="600" fill="#5C5447" text-anchor="middle" transform="rotate(-90 30 170)">km/h</text>

    <!-- NO-GO band fill above threshold (y<150 means >40km/h). threshold y=150 -->
    <!-- threshold line -->
    <line x1="60" y1="150" x2="810" y2="150" stroke="#D7263D" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="816" y="148" font-size="10" font-weight="700" fill="#D7263D" text-anchor="start" transform="translate(-60,-6)"></text>

    <!-- gust curve (mean lighter + gust darker). gust crosses threshold morning, dips midday-evening -->
    <!-- gust area -->
    <path d="M 60 120 L 110 110 L 160 116 L 210 128 L 260 150 L 310 170 L 360 196 L 410 214 L 460 222 L 510 210 L 560 196 L 610 184 L 660 168 L 710 150 L 760 132 L 810 118
             L 810 280 L 60 280 Z" fill="#3A6FA8" opacity="0.10"/>
    <!-- gust line -->
    <path d="M 60 120 L 110 110 L 160 116 L 210 128 L 260 150 L 310 170 L 360 196 L 410 214 L 460 222 L 510 210 L 560 196 L 610 184 L 660 168 L 710 150 L 760 132 L 810 118"
          fill="none" stroke="#D7263D" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- mean line -->
    <path d="M 60 150 L 110 142 L 160 148 L 210 160 L 260 178 L 310 196 L 360 218 L 410 234 L 460 240 L 510 230 L 560 218 L 610 208 L 660 194 L 710 178 L 760 162 L 810 150"
          fill="none" stroke="#2C2A26" stroke-width="2" opacity="0.55" stroke-linejoin="round"/>

    <!-- NO-GO zones (gust above threshold): morning 06-10 and evening 20-22 -->
    <rect x="60" y="60" width="200" height="220" fill="#D7263D" opacity="0.06"/>
    <rect x="730" y="60" width="80" height="220" fill="#D7263D" opacity="0.06"/>
    <!-- GO zone -->
    <rect x="380" y="60" width="270" height="220" fill="#7A9466" opacity="0.08"/>

    <!-- now line 11:15 -->
    <line x1="260" y1="50" x2="260" y2="280" stroke="#C97B47" stroke-width="2"/>
    <g transform="translate(260,46)"><rect x="-22" y="-10" width="44" height="14" rx="7" fill="#C97B47"/><text y="0" font-size="9" font-weight="700" fill="#FAF6EA" text-anchor="middle">JETZT</text></g>

    <!-- status chips along bottom -->
    <g transform="translate(0,296)" font-size="10" font-weight="700">
      <g transform="translate(150,0)"><rect x="-44" width="88" height="20" rx="10" fill="#FBE9E4"/><text y="14" fill="#D7263D" text-anchor="middle">✕ NO-GO</text></g>
      <g transform="translate(500,0)"><rect x="-40" width="80" height="20" rx="10" fill="#ECF1E6"/><text y="14" fill="#5C7A4A" text-anchor="middle">✓ GO</text></g>
      <g transform="translate(770,0)"><rect x="-44" width="88" height="20" rx="10" fill="#FBE9E4"/><text y="14" fill="#D7263D" text-anchor="middle">✕ NO-GO</text></g>
    </g>

    <!-- x labels -->
    <g transform="translate(0,336)" font-size="9" fill="#8B7355">
      <text x="60" text-anchor="middle">06:00</text>
      <text x="260" text-anchor="middle">11:15</text>
      <text x="410" text-anchor="middle">14:00</text>
      <text x="580" text-anchor="middle">16:30</text>
      <text x="810" text-anchor="middle">22:00</text>
    </g>

    <!-- legend -->
    <g transform="translate(560,16)" font-size="9" fill="#5C5447">
      <line x1="0" y1="0" x2="18" y2="0" stroke="#D7263D" stroke-width="2.4"/><text x="22" y="3">Böen</text>
      <line x1="74" y1="0" x2="92" y2="0" stroke="#2C2A26" stroke-width="2" opacity="0.55"/><text x="96" y="3">Mittel</text>
      <line x1="150" y1="0" x2="168" y2="0" stroke="#D7263D" stroke-width="2" stroke-dasharray="4 3"/><text x="172" y="3">Limit</text>
    </g>
  </g>

  <!-- HEIGHT-FACTOR PROFILE (US-E4) -->
  <g transform="translate(526,556)" filter="url(#cardShadow)">
    <rect width="416" height="180" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="22" y="30" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">HÖHENFAKTOR · BODEN → FLUGHÖHE</text>
    <!-- vertical profile: x=wind, y=height -->
    <g transform="translate(60,46)">
      <!-- axis -->
      <line x1="0" y1="0" x2="0" y2="108" stroke="#8B7355"/>
      <line x1="0" y1="108" x2="300" y2="108" stroke="#8B7355"/>
      <!-- profile curve (log-ish increase) -->
      <path d="M 20 108 L 60 70 L 110 44 L 170 26 L 240 16" fill="none" stroke="#3A6FA8" stroke-width="2.4"/>
      <!-- points -->
      <circle cx="20" cy="108" r="4" fill="#3A6FA8"/><circle cx="240" cy="16" r="5" fill="#C97B47"/>
      <!-- annotations -->
      <text x="26" y="104" font-size="10" fill="#5C5447">Boden 18 km/h</text>
      <text x="234" y="12" font-size="10" font-weight="700" fill="#C97B47" text-anchor="end">120 m: 52 km/h</text>
      <g font-size="9" fill="#8B7355"><text x="-6" y="4" text-anchor="end">120m</text><text x="-6" y="112" text-anchor="end">0m</text></g>
    </g>
    <!-- factor readout -->
    <g transform="translate(300,52)">
      <text font-size="10" font-weight="600" letter-spacing="0.1em" fill="#8B7355">FAKTOR</text>
      <text y="40" font-size="40" font-weight="700" fill="#2C2A26">2,9×</text>
      <text y="62" font-size="11" fill="#5C5447">Wind nimmt zur</text>
      <text y="78" font-size="11" fill="#5C5447">Flughöhe stark zu</text>
    </g>
  </g>

  <!-- BARRIER-FREE NOTE (US-N5) -->
  <g transform="translate(958,556)" filter="url(#cardShadow)">
    <rect width="418" height="180" rx="18" fill="#F8F2E2" stroke="#E0D6BE"/>
    <text x="22" y="30" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">AUSWERTUNG</text>
    <g transform="translate(22,42)" font-size="12">
      <g><text y="14" fill="#5C5447">Ort</text><text x="374" y="14" font-weight="600" fill="#2C2A26" text-anchor="end">Feldberg-Süd · 47.86, 8.00</text></g>
      <g transform="translate(0,24)"><text y="14" fill="#5C5447">Zeitfenster GO</text><text x="374" y="14" font-weight="600" fill="#5C7A4A" text-anchor="end">16:30 – 19:45</text></g>
      <g transform="translate(0,48)"><text y="14" fill="#5C5447">Höhe</text><text x="374" y="14" font-weight="600" fill="#2C2A26" text-anchor="end">120 m AGL</text></g>
      <g transform="translate(0,72)"><text y="14" fill="#5C5447">Modelllauf</text><text x="374" y="14" font-weight="600" fill="#2C2A26" text-anchor="end">ICON-D2 · 08:00 UTC</text></g>
    </g>
    <g transform="translate(22,150)">
      <circle cx="8" cy="-4" r="6" fill="#8B7355"/><text x="8" y="0" font-size="9" font-weight="700" fill="#FAF6EA" text-anchor="middle">i</text>
      <text x="22" y="0" font-size="10" fill="#8B7355">Status mit Text &amp; Symbol — nicht nur Farbe.</text>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(720,792)" text-anchor="middle">
    <text font-size="11" fill="#8B7355">Go/No-Go vergleicht prognostizierte Böen gegen deinen Grenzwert auf realer Flughöhe · keine Gewähr · Pilot entscheidet</text>
  </g>
</svg>
