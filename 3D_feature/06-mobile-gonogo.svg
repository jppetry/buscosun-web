<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgSand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF6EA"/><stop offset="1" stop-color="#F5F1E8"/></linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="2"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="strongShadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dx="0" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="120" height="120" fill="transparent"/><circle cx="20" cy="40" r="0.7" fill="#C4B896" opacity="0.18"/><circle cx="80" cy="20" r="0.5" fill="#C4B896" opacity="0.14"/></pattern>
  </defs>
  <rect width="390" height="1460" fill="url(#bgSand)"/>
  <rect width="390" height="1460" fill="url(#grain)"/>

  <!-- status + nav -->
  <g><rect width="390" height="44" fill="#FAF6EA"/><text x="22" y="28" font-size="14" font-weight="700" fill="#2C2A26">9:41</text>
    <g transform="translate(330,14)" fill="#2C2A26"><rect x="0" y="2" width="3" height="8" rx="1"/><rect x="5" y="0" width="3" height="10" rx="1"/><rect x="10" y="-2" width="3" height="12" rx="1"/><rect x="22" y="0" width="20" height="10" rx="2" fill="none" stroke="#2C2A26"/><rect x="24" y="2" width="14" height="6" rx="1" fill="#7A9466"/></g></g>
  <g transform="translate(0,44)"><rect width="390" height="56" fill="#FAF6EA"/><line x1="0" y1="56" x2="390" y2="56" stroke="#E0D6BE"/>
    <g transform="translate(16,18)"><path d="M 8 0 L 0 10 L 8 20" fill="none" stroke="#2C2A26" stroke-width="2" stroke-linecap="round"/></g>
    <text x="195" y="32" font-size="14" font-weight="600" fill="#2C2A26" text-anchor="middle">Betriebs-Check</text>
    <text x="195" y="46" font-size="10" fill="#8B7355" text-anchor="middle">Drohne · Feldberg-Süd</text>
    <!-- share -->
    <g transform="translate(352,20)"><circle cx="0" cy="4" r="3" fill="none" stroke="#3A6FA8" stroke-width="1.6"/><circle cx="12" cy="-2" r="3" fill="none" stroke="#3A6FA8" stroke-width="1.6"/><circle cx="12" cy="10" r="3" fill="none" stroke="#3A6FA8" stroke-width="1.6"/><line x1="3" y1="3" x2="9" y2="-1" stroke="#3A6FA8" stroke-width="1.4"/><line x1="3" y1="5" x2="9" y2="9" stroke="#3A6FA8" stroke-width="1.4"/></g></g>

  <!-- BIG NO-GO STATUS -->
  <g transform="translate(16,116)" filter="url(#strongShadow)">
    <rect width="358" height="180" rx="20" fill="#FBE9E4" stroke="#C97B47" stroke-width="2"/>
    <g transform="translate(28,40)">
      <path d="M 11 0 L 33 0 L 44 11 L 44 33 L 33 44 L 11 44 L 0 33 L 0 11 Z" fill="#D7263D"/>
      <line x1="15" y1="15" x2="29" y2="29" stroke="#FAF6EA" stroke-width="4" stroke-linecap="round"/>
      <line x1="29" y1="15" x2="15" y2="29" stroke="#FAF6EA" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="88" y="56" font-size="40" font-weight="700" fill="#D7263D">NO-GO</text>
    <text x="90" y="80" font-size="13" font-weight="600" fill="#2C2A26">jetzt 11:15 · Böen über Limit</text>
    <line x1="28" y1="100" x2="330" y2="100" stroke="#E8C9BD"/>
    <g transform="translate(28,116)" font-size="13">
      <text y="14" fill="#5C5447">Böen auf 120 m AGL</text><text x="302" y="14" font-weight="700" fill="#D7263D" text-anchor="end">52 km/h</text>
      <text y="38" fill="#5C5447">dein Limit</text><text x="302" y="38" font-weight="700" fill="#2C2A26" text-anchor="end">40 km/h</text>
    </g>
  </g>

  <!-- NEXT GO -->
  <g transform="translate(16,312)" filter="url(#cardShadow)">
    <rect width="358" height="56" rx="14" fill="#ECF1E6" stroke="#7A9466"/>
    <g transform="translate(26,28)"><circle r="13" fill="#7A9466"/><path d="M -6 0 L -1 5 L 8 -6" fill="none" stroke="#FAF6EA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="52" y="26" font-size="13" font-weight="700" fill="#2C2A26">Nächstes GO-Fenster</text>
    <text x="52" y="44" font-size="11" fill="#5C7A4A">16:30 – 19:45 · ~3 h 15</text>
    <text x="340" y="34" font-size="16" font-weight="700" fill="#5C7A4A" text-anchor="end">16:30</text>
  </g>

  <!-- HEIGHT INPUT -->
  <g transform="translate(16,384)" filter="url(#cardShadow)">
    <rect width="358" height="92" rx="16" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="20" y="28" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">FLUGHÖHE (AGL)</text>
    <text x="20" y="64" font-size="30" font-weight="700" fill="#2C2A26">120</text>
    <text x="78" y="64" font-size="14" fill="#5C5447">m über Grund</text>
    <g transform="translate(250,40)"><rect width="44" height="36" rx="10" fill="#EDE6D3"/><path d="M 22 12 L 28 22 L 16 22 Z" fill="#5C5447"/></g>
    <g transform="translate(302,40)"><rect width="44" height="36" rx="10" fill="#EDE6D3"/><path d="M 22 22 L 28 12 L 16 12 Z" fill="#5C5447"/></g>
  </g>

  <!-- GUST TIMELINE -->
  <g transform="translate(16,492)" filter="url(#cardShadow)">
    <rect width="358" height="234" rx="16" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="20" y="28" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#3A6FA8">BÖEN AUF 120 M · HEUTE</text>
    <text x="338" y="28" font-size="10" fill="#8B7355" text-anchor="end">Limit 40 km/h</text>

    <!-- plot x 44..338 y 50..170 -->
    <g stroke="#E0D6BE" stroke-width="1" stroke-dasharray="2 4"><line x1="44" y1="70" x2="338" y2="70"/><line x1="44" y1="110" x2="338" y2="110"/><line x1="44" y1="150" x2="338" y2="150"/></g>
    <g font-size="8" fill="#8B7355" text-anchor="end"><text x="38" y="73">70</text><text x="38" y="113">40</text><text x="38" y="153">10</text></g>

    <!-- NO-GO / GO bands -->
    <rect x="44" y="50" width="86" height="120" fill="#D7263D" opacity="0.06"/>
    <rect x="150" y="50" width="120" height="120" fill="#7A9466" opacity="0.08"/>
    <rect x="300" y="50" width="38" height="120" fill="#D7263D" opacity="0.06"/>

    <!-- threshold line y=110 (=40) -->
    <line x1="44" y1="110" x2="338" y2="110" stroke="#D7263D" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- gust curve -->
    <path d="M 44 86 L 80 80 L 116 92 L 150 108 L 186 128 L 222 140 L 258 132 L 294 116 L 320 96 L 338 84" fill="none" stroke="#D7263D" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- mean -->
    <path d="M 44 112 L 80 106 L 116 116 L 150 130 L 186 146 L 222 156 L 258 150 L 294 138 L 320 120 L 338 110" fill="none" stroke="#2C2A26" stroke-width="1.8" opacity="0.5" stroke-linejoin="round"/>

    <!-- now line 11:15 -->
    <line x1="86" y1="44" x2="86" y2="170" stroke="#C97B47" stroke-width="2"/>
    <g transform="translate(86,42)"><rect x="-18" y="-10" width="36" height="13" rx="6" fill="#C97B47"/><text y="-1" font-size="8" font-weight="700" fill="#FAF6EA" text-anchor="middle">JETZT</text></g>

    <!-- x labels -->
    <g transform="translate(0,184)" font-size="8" fill="#8B7355"><text x="44" text-anchor="middle">06</text><text x="86" text-anchor="middle">11:15</text><text x="210" text-anchor="middle">16:30</text><text x="338" text-anchor="middle">22</text></g>

    <!-- status chips -->
    <g transform="translate(0,202)" font-size="9" font-weight="700">
      <g transform="translate(87,0)"><rect x="-38" width="76" height="18" rx="9" fill="#FBE9E4"/><text y="13" fill="#D7263D" text-anchor="middle">✕ NO-GO</text></g>
      <g transform="translate(210,0)"><rect x="-32" width="64" height="18" rx="9" fill="#ECF1E6"/><text y="13" fill="#5C7A4A" text-anchor="middle">✓ GO</text></g>
      <g transform="translate(312,0)"><rect x="-30" width="60" height="18" rx="9" fill="#FBE9E4"/><text y="13" fill="#D7263D" text-anchor="middle">✕ NO</text></g>
    </g>
    <!-- legend -->
    <g transform="translate(180,16)" font-size="8" fill="#5C5447"><line x1="0" y1="0" x2="14" y2="0" stroke="#D7263D" stroke-width="2.2"/><text x="18" y="3">Böen</text><line x1="56" y1="0" x2="70" y2="0" stroke="#2C2A26" stroke-width="1.8" opacity="0.5"/><text x="74" y="3">Mittel</text></g>
  </g>

  <!-- THRESHOLD slider -->
  <g transform="translate(16,742)" filter="url(#cardShadow)">
    <rect width="358" height="96" rx="16" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="20" y="28" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">BÖEN-LIMIT · GESPEICHERT</text>
    <text x="338" y="28" font-size="16" font-weight="700" fill="#2C2A26" text-anchor="end">40 km/h</text>
    <g transform="translate(20,56)"><rect width="318" height="6" rx="3" fill="#E0D6BE"/><rect width="170" height="6" rx="3" fill="#3A6FA8"/>
      <g transform="translate(170,3)" filter="url(#strongShadow)"><circle r="15" fill="#FAF6EA" stroke="#3A6FA8" stroke-width="3"/><circle r="5" fill="#3A6FA8"/></g>
      <g font-size="9" fill="#8B7355"><text x="0" y="24">20</text><text x="318" y="24" text-anchor="end">80 km/h</text></g></g>
  </g>

  <!-- HEIGHT FACTOR profile -->
  <g transform="translate(16,854)" filter="url(#cardShadow)">
    <rect width="358" height="148" rx="16" fill="#FAF6EA" stroke="#E0D6BE"/>
    <text x="20" y="28" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">HÖHENFAKTOR · BODEN → 120 M</text>
    <g transform="translate(48,44)">
      <line x1="0" y1="0" x2="0" y2="80" stroke="#8B7355"/><line x1="0" y1="80" x2="180" y2="80" stroke="#8B7355"/>
      <path d="M 14 80 L 50 52 L 96 32 L 150 16" fill="none" stroke="#3A6FA8" stroke-width="2.4"/>
      <circle cx="14" cy="80" r="4" fill="#3A6FA8"/><circle cx="150" cy="16" r="5" fill="#C97B47"/>
      <text x="20" y="76" font-size="9" fill="#5C5447">Boden 18</text>
      <text x="146" y="12" font-size="9" font-weight="700" fill="#C97B47" text-anchor="end">120m: 52</text>
      <g font-size="8" fill="#8B7355"><text x="-6" y="4" text-anchor="end">120m</text><text x="-6" y="84" text-anchor="end">0m</text></g>
    </g>
    <g transform="translate(244,52)"><text font-size="9" font-weight="600" fill="#8B7355">FAKTOR</text><text y="38" font-size="36" font-weight="700" fill="#2C2A26">2,9×</text><text y="58" font-size="10" fill="#5C5447">Wind nimmt</text><text y="72" font-size="10" fill="#5C5447">zur Höhe zu</text></g>
  </g>

  <!-- export row -->
  <g transform="translate(16,1018)">
    <g><rect width="174" height="48" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><path d="M 36 16 L 36 28 M 32 24 L 36 28 L 40 24 M 30 34 L 42 34" fill="none" stroke="#3A6FA8" stroke-width="1.6" stroke-linecap="round"/><text x="100" y="30" font-size="13" font-weight="600" fill="#3A6FA8" text-anchor="middle">PDF-Report</text></g>
    <g transform="translate(184,0)"><rect width="174" height="48" rx="14" fill="#3A6FA8"/><text x="87" y="30" font-size="13" font-weight="600" fill="#FAF6EA" text-anchor="middle">Link teilen</text></g>
  </g>

  <!-- evaluation summary -->
  <g transform="translate(16,1082)" filter="url(#cardShadow)">
    <rect width="358" height="132" rx="16" fill="#F8F2E2" stroke="#E0D6BE"/>
    <text x="20" y="28" font-size="10" letter-spacing="0.12em" font-weight="600" fill="#8B7355">AUSWERTUNG</text>
    <g transform="translate(20,40)" font-size="12">
      <g><text y="14" fill="#5C5447">Ort</text><text x="318" y="14" font-weight="600" fill="#2C2A26" text-anchor="end">Feldberg-Süd</text></g>
      <g transform="translate(0,22)"><text y="14" fill="#5C5447">GO-Fenster</text><text x="318" y="14" font-weight="600" fill="#5C7A4A" text-anchor="end">16:30 – 19:45</text></g>
      <g transform="translate(0,44)"><text y="14" fill="#5C5447">Höhe</text><text x="318" y="14" font-weight="600" fill="#2C2A26" text-anchor="end">120 m AGL</text></g>
      <g transform="translate(0,66)"><text y="14" fill="#5C5447">Modelllauf</text><text x="318" y="14" font-weight="600" fill="#2C2A26" text-anchor="end">ICON-D2 · 08:00 UTC</text></g>
    </g>
  </g>

  <!-- disclaimer -->
  <g transform="translate(16,1230)"><rect width="358" height="56" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
    <g transform="translate(20,20)"><circle r="11" fill="#8B7355"/><text y="4" font-size="13" font-weight="700" fill="#FAF6EA" text-anchor="middle">i</text></g>
    <text x="40" y="22" font-size="10" fill="#5C5447">Status mit Symbol + Text, nicht nur Farbe.</text>
    <text x="40" y="38" font-size="10" fill="#5C5447">Keine Gewähr — der Pilot entscheidet.</text></g>

  <g transform="translate(150,1436)"><rect width="90" height="4" rx="2" fill="#2C2A26" opacity="0.4"/></g>
</svg>
