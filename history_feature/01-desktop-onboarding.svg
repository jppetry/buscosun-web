<g transform="translate(64,308)"><text x="0" y="0" font-size="11" letter-spacing="0.22em" font-weight="600" fill="#7A9466">ODER STARTE MIT EINER FRAGE</text></g>
<g transform="translate(64,328)" filter="url(#cardShadow)"><rect width="424" height="150" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/><rect x="0" y="0" width="6" height="150" rx="3" fill="#C97B47"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#2C2A26">Wie warm war der letzte Sommer</text>
<text x="28" y="70" font-size="19" font-weight="700" fill="#2C2A26">im Vergleich zu normal?</text>
<text x="28" y="124" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#C97B47">TEMPERATUR · ANOMALIE</text>
<text x="396" y="128" font-size="20" fill="#8B7355">→</text></g>
<g transform="translate(508,328)" filter="url(#cardShadow)"><rect width="424" height="150" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/><rect x="0" y="0" width="6" height="150" rx="3" fill="#3A6FA8"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#2C2A26">Wann war der letzte Frost?</text>
<text x="28" y="124" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#3A6FA8">FROSTTAGE · GÄRTNERN</text>
<text x="396" y="128" font-size="20" fill="#8B7355">→</text></g>
<g transform="translate(952,328)" filter="url(#cardShadow)"><rect width="424" height="150" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/><rect x="0" y="0" width="6" height="150" rx="3" fill="#7A9466"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#2C2A26">Wie trocken ist mein</text>
<text x="28" y="70" font-size="19" font-weight="700" fill="#2C2A26">Hochzeitsdatum historisch?</text>
<text x="28" y="124" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#7A9466">NIEDERSCHLAG · DATUM</text>
<text x="396" y="128" font-size="20" fill="#8B7355">→</text></g>
<g transform="translate(64,498)" filter="url(#cardShadow)"><rect width="424" height="150" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/><rect x="0" y="0" width="6" height="150" rx="3" fill="#D4A373"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#2C2A26">Wie viele Hitzetage</text>
<text x="28" y="70" font-size="19" font-weight="700" fill="#2C2A26">pro Jahr inzwischen?</text>
<text x="28" y="124" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#D4A373">KENNTAGE · TREND</text>
<text x="396" y="128" font-size="20" fill="#8B7355">→</text></g>
<g transform="translate(508,498)" filter="url(#cardShadow)"><rect width="424" height="150" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/><rect x="0" y="0" width="6" height="150" rx="3" fill="#9E2B25"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#2C2A26">Zeig mir die Klimastreifen</text>
<text x="28" y="70" font-size="19" font-weight="700" fill="#2C2A26">für meinen Ort</text>
<text x="28" y="124" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#9E2B25">WARMING STRIPES</text>
<text x="396" y="128" font-size="20" fill="#8B7355">→</text></g>
<g transform="translate(952,498)" filter="url(#cardShadow)"><rect width="424" height="150" rx="18" fill="#FAF6EA" stroke="#E0D6BE"/><rect x="0" y="0" width="6" height="150" rx="3" fill="#6B7A8F"/>
<text x="28" y="44" font-size="19" font-weight="700" fill="#2C2A26">Wie war das Wetter</text>
<text x="28" y="70" font-size="19" font-weight="700" fill="#2C2A26">an meinem Geburtstag?</text>
<text x="28" y="124" font-size="11" font-weight="600" letter-spacing="0.1em" fill="#6B7A8F">RÜCKBLICK · DATUM</text>
<text x="396" y="128" font-size="20" fill="#8B7355">→</text></g>
<g transform="translate(64,672)" filter="url(#cardShadow)"><rect width="1312" height="64" rx="16" fill="#FBFAF3" stroke="#C4B896" stroke-dasharray="4 3"/><g transform="translate(28,32)"><circle r="13" fill="#3A6FA8"/><path d="M -5 -2 Q -5 -7 0 -7 Q 5 -7 5 -2 Q 5 2 0 2 L 0 5 L -3 2 Z" fill="#FAF6EA"/></g><text x="60" y="32" font-size="15" fill="#8B7355">Frag in eigenen Worten — „war der Mai 2024 zu nass?" — wir wählen Variable, Zeitraum und Diagramm automatisch.</text><text x="60" y="52" font-size="11" fill="#8B7355">Bei Unklarheit fragen wir kurz nach.</text><g transform="translate(1180,16)"><rect width="108" height="32" rx="16" fill="#3A6FA8"/><text x="54" y="21" font-size="13" font-weight="600" fill="#FAF6EA" text-anchor="middle">Fragen</text></g></g>
<g transform="translate(64,768)"><text font-size="12" fill="#8B7355"><tspan font-weight="700" fill="#5C5447">Noch unsicher?</tspan> Wir zeigen dir direkt ein Beispiel für Dillenburg (1881–2024) — alles ist danach frei anpassbar.</text></g>
