<g transform="translate(64,116)"><text x="0" y="0" font-size="11" letter-spacing="0.22em" font-weight="600" fill="#7A9466">WETTERHISTORIE · KLIMA-RÜCKBLICK</text><text y="34" font-size="34" font-weight="700" fill="#2C2A26">Wie hat sich das Wetter bei dir verändert?</text><text y="64" font-size="15" fill="#5C5447">Stell eine Frage oder such deinen Ort — kein Fachwissen nötig.</text></g>
<g transform="translate(64,212)" filter="url(#cardShadow)"><rect width="900" height="60" rx="16" fill="#FAF6EA" stroke="#E0D6BE"/><g transform="translate(24,22)" stroke="#8B7355" stroke-width="2" fill="none"><circle cx="8" cy="8" r="8"/><line x1="14" y1="14" x2="20" y2="20" stroke-linecap="round"/></g><text x="60" y="37" font-size="16" fill="#8B7355">Ort oder PLZ suchen — z. B. „Dillenburg" oder „35683"</text><g transform="translate(760,12)"><rect width="124" height="36" rx="18" fill="#3A6FA8"/><text x="62" y="23" font-size="13" font-weight="600" fill="#FAF6EA" text-anchor="middle">Auf Karte</text></g></g>
