      <g transform="translate(0, 22)">
        <g><text font-size="9" fill="#A89A7A" letter-spacing="1.5">DISTANZ</text><text y="24" font-size="22" fill="#2C2A26" font-weight="500">9,7</text><text x="44" y="24" font-size="13" fill="#5C5447">km</text></g>
        <g transform="translate(140,0)"><text font-size="9" fill="#A89A7A" letter-spacing="1.5">AUFSTIEG</text><text y="24" font-size="22" fill="#2C2A26" font-weight="500">996</text><text x="56" y="24" font-size="13" fill="#5C5447">hm</text></g>
        <g transform="translate(280,0)"><text font-size="9" fill="#A89A7A" letter-spacing="1.5">HÖCHSTER</text><text y="24" font-size="22" fill="#2C2A26" font-weight="500">1279</text><text x="66" y="24" font-size="13" fill="#5C5447">m</text></g>
        <g transform="translate(0,66)"><text font-size="9" fill="#A89A7A" letter-spacing="1.5">TIEFSTER</text><text y="24" font-size="22" fill="#2C2A26" font-weight="500">283</text><text x="48" y="24" font-size="13" fill="#5C5447">m</text></g>
        <g transform="translate(140,66)"><text font-size="9" fill="#A89A7A" letter-spacing="1.5">W-PUNKTE</text><text y="24" font-size="22" fill="#2C2A26" font-weight="500">23</text></g>
        <g transform="translate(280,66)"><text font-size="9" fill="#A89A7A" letter-spacing="1.5">GELÄNDE</text><text y="24" font-size="18" fill="#2C2A26" font-weight="500">alpin</text></g>
      </g>
      <g transform="translate(440, 14)">
        <text font-size="9" fill="#A89A7A" letter-spacing="2" font-weight="500">HÖHENPROFIL</text>
        <g transform="translate(0, 12)"><rect width="448" height="124" rx="12" fill="#FAF6EA" stroke="#E0D6BE"/>
          <g transform="translate(14, 12)">
            <path d="M 0 96 L 60 92 L 120 84 L 180 76 L 240 64 L 300 50 L 360 34 L 410 24 L 420 22 L 420 100 L 0 100 Z" fill="url(#elevT1)"/>
            <path d="M 0 96 L 60 92 L 120 84 L 180 76 L 240 64 L 300 50 L 360 34 L 410 24 L 420 22" fill="none" stroke="#7A9466" stroke-width="2"/>
            <circle cx="0" cy="96" r="4" fill="#2C2A26"/><circle cx="420" cy="22" r="4" fill="#C97B47"/>
          </g>
          <g font-size="9" fill="#A89A7A" transform="translate(14, 120)"><text x="0">0 km</text><text x="420" text-anchor="end">9,7 km</text></g>
        </g>
