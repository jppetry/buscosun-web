    <text y="34" font-size="15" fill="#5C5447">Lade deine geplante Tour hoch — Wind, Regen und Temperatur an jedem Kilometer, zur Ankunftszeit.</text>
  </g>

  <!-- dropzone -->
  <g transform="translate(40, 260)">
