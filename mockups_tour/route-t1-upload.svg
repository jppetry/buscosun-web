    <rect x="16" y="16" width="428" height="248" rx="14" fill="none" stroke="#C4B896" stroke-width="2" stroke-dasharray="6 6"/>
    <g transform="translate(184, 46)">
      <path d="M 22 48 Q 7 48 7 33 Q 7 18 22 18 Q 24 -2 47 -2 Q 67 -6 77 10 Q 90 4 102 16 Q 122 18 122 34 Q 122 48 107 48 Z" transform="translate(-4 4) scale(0.78)" fill="#EDE6D3" stroke="#C4B896" stroke-width="2" stroke-linejoin="round"/>
      <line x1="40" y1="36" x2="40" y2="64" stroke="#C97B47" stroke-width="2.6" stroke-linecap="round"/><path d="M 32 43 L 40 35 L 48 43" fill="none" stroke="#C97B47" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="58" r="2.5" fill="#7A9466"/><circle cx="74" cy="62" r="2.5" fill="#7A9466"/><path d="M 6 58 Q 26 70 74 62" fill="none" stroke="#7A9466" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
