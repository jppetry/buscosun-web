<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1180" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bgT1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F1E8"/><stop offset="100%" stop-color="#EDE6D3"/></linearGradient>
    <linearGradient id="dropT1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFDF6"/><stop offset="100%" stop-color="#F8F2E2"/></linearGradient>
    <linearGradient id="elevT1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7A9466" stop-opacity="0.5"/><stop offset="100%" stop-color="#7A9466" stop-opacity="0.08"/></linearGradient>
  </defs>
  <rect width="1024" height="1180" fill="url(#bgT1)"/>

  <!-- status bar -->
  <g><rect width="1024" height="40" fill="#F5F1E8"/><text x="40" y="26" font-size="14" fill="#2C2A26" font-weight="600">9:41</text>
    <g transform="translate(940, 13)"><rect width="30" height="13" rx="3" fill="none" stroke="#2C2A26" stroke-width="1.4"/><rect x="2" y="2" width="22" height="9" rx="1" fill="#2C2A26"/><rect x="32" y="4" width="2" height="5" rx="1" fill="#2C2A26"/></g></g>
  <!-- top bar -->
  <g transform="translate(0,40)"><rect width="1024" height="72" fill="#FFFFFF"/>
    <g transform="translate(40, 28)" stroke="#2C2A26" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="0" y1="10" x2="20" y2="10"/><polyline points="7,5 0,10 7,15"/></g>
    <g transform="translate(76, 22)"><text font-size="10" fill="#A89A7A" letter-spacing="2" font-weight="500">TOURENPLANUNG · SCHRITT 1</text><text y="22" font-size="18" fill="#2C2A26" font-weight="500" letter-spacing="-0.3">Route hochladen</text></g>
    <g transform="translate(420, 16)" font-size="12">
      <g><text x="30" y="25" fill="#5C5447" text-anchor="middle">Karte</text></g>
      <g transform="translate(64,0)"><rect width="60" height="40" rx="20" fill="#2C2A26"/><text x="30" y="25" fill="#F5F1E8" text-anchor="middle" font-weight="500">Route</text></g>
      <g transform="translate(128,0)"><text x="28" y="25" fill="#5C5447" text-anchor="middle">Event</text></g>
      <g transform="translate(188,0)"><text x="42" y="25" fill="#5C5447" text-anchor="middle">Tagesablauf</text></g>
    </g>
    <g transform="translate(960, 16)"><rect width="40" height="40" rx="20" fill="#FFFFFF" stroke="#D9D0B8"/><circle cx="20" cy="20" r="7" fill="#7A9466"/><text x="20" y="24" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="500">JS</text></g>
  </g>

