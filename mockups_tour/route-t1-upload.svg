      <g transform="translate(0, 22)" font-size="13" fill="#2C2A26">
        <g><rect width="44" height="22" rx="6" fill="#F0F4EA"/><text x="22" y="15" font-size="10" fill="#7A9466" text-anchor="middle" font-weight="600">GPX</text><text x="58" y="15">Komoot, Strava, Garmin, Wikiloc</text></g>
        <g transform="translate(0,38)"><rect width="44" height="22" rx="6" fill="#F0F4EA"/><text x="22" y="15" font-size="10" fill="#7A9466" text-anchor="middle" font-weight="600">TCX</text><text x="58" y="15">Garmin Training Center</text></g>
        <g transform="translate(0,76)"><rect width="44" height="22" rx="6" fill="#F0F4EA"/><text x="22" y="15" font-size="10" fill="#7A9466" text-anchor="middle" font-weight="600">FIT</text><text x="58" y="15">Garmin- &amp; Wahoo-Geräte (binär)</text></g>
        <g transform="translate(0,114)"><rect width="44" height="22" rx="6" fill="#EFE6D2"/><text x="22" y="15" font-size="10" fill="#8B7355" text-anchor="middle" font-weight="600">KML</text><text x="58" y="15">Google Earth</text></g>
        <g transform="translate(0,152)"><rect width="44" height="22" rx="6" fill="#EFE6D2"/><text x="22" y="15" font-size="10" fill="#8B7355" text-anchor="middle" font-weight="600">KMZ</text><text x="58" y="15">Google Earth (gezippt)</text></g>
      </g>
      <line x1="0" y1="208" x2="404" y2="208" stroke="#E0D6BE" stroke-width="0.5"/>
      <text y="230" font-size="12" fill="#8B7355">Max. 25 MB · DE · AT · CH · keine Tracker</text>
    </g>
  </g>

  <!-- parsed -->
  <g transform="translate(40, 564)">
    <rect width="944" height="300" rx="20" fill="#FFFFFF" stroke="#E0D6BE" stroke-width="0.5"/>
    <g transform="translate(28, 24)">
