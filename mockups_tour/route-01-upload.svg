  <!-- ============ LABEL ============ -->
  <g transform="translate(32, 880)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">RP-01 · TOURENPLANER UPLOAD &amp; PARSE · DESKTOP · v1.8</text>
    <text x="1376" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">Drag-Drop · 5 Formate · Track-Summary · Höhenprofil</text>
  </g>
</svg>
