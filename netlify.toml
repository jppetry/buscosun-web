# Netlify build + redirect config for buscosun.
#
# Build
# -----
# Vite produces a pure-static bundle in `dist/`. Netlify auto-detects this
# but pinning it explicitly avoids surprises if the default ever changes.
#
# Proxy
# -----
# Mirrors the Vite dev-server proxy (`/_dwd_opendata` → opendata.dwd.de) so
# the production deployment can keep using the same client-side URLs. The
# upstream is CORS-free for binary downloads when accessed server-to-server,
# and Netlify's edge proxy fronts the request as same-origin to the browser.
#
# `status = 200` makes this a *rewrite* (no client-side redirect), so the
# user's address bar stays on the buscosun domain and the browser treats the
# response as same-origin — bypassing the CORS block that prevents a direct
# `fetch('https://opendata.dwd.de/…')` from the page.

[build]
  # `git fetch --unshallow` holt den vollen Verlauf, falls der Clone flach ist: die
  # Sitemap-lastmod (scripts/seo/gitDate.mjs) liest Commit-Daten. Bei vollem Clone
  # schlägt der Befehl harmlos fehl (`|| true`); bleibt der Clone flach, fehlt lastmod.
  command   = "git fetch --unshallow || true; npm run build"
  publish   = "dist"

# ── Header (SEO/GEO 2026, E1 — „Ebene B") ────────────────────────────────────
#
# Gehashte Bundles bleiben für Googlebot ABRUFBAR (sonst kann Google die App nicht
# rendern und meldet blockierte Ressourcen), erscheinen aber nie als Suchtreffer:
# `X-Robots-Tag: noindex, nofollow`. Dazu `immutable`-Caching, weil Vite jede
# Datei mit Inhalts-Hash benennt — der Service Worker (`ASSET_RE`, stale-while-
# revalidate) bleibt davon unberührt. Datenartefakte (public/fire, params, …),
# Manifeste und der Service Worker tragen dasselbe noindex.
#
# Für die Proxy-Rewrites (/_dwd_opendata u. a.) wirken Header NICHT (Netlify setzt
# eigene Header nicht auf proxied Antworten) — dort schützt nur robots.txt; eine
# Origin-/Referer-Prüfung wäre eine Edge Function (STOPP & FRAGEN, s. MANUELLE-SCHRITTE.md).
# `scripts/verify-routing.mjs` prüft, dass dieser Block vorhanden ist.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag  = "noindex, nofollow"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/params/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fire/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/countries/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/globe/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wind/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/latest-grib.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/climaGrid.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
