# SH6: die Vorschaubilder. Ein Tag Cache statt eines Jahres, weil die Dateinamen
# KEINEN Inhalts-Hash tragen — eine neu gerenderte Karte muss sich innerhalb
# eines Tages durchsetzen koennen. Das nimmt trotzdem den Grossteil der
# Crawler-Zugriffe von der Netlify-Bandbreite.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# DWD OpenData proxy — used by `src/sources/radolan.ts` to fetch RADOLAN-RY
# live frames and RADVOR-RE nowcast forecasts as BZ2/GZIP binary streams.
# Muss VOR dem SPA-Fallback stehen (Regeln werden von oben nach unten geprüft).
# /quellen = Kurzadresse des zentralen Quellen- und Lizenzverzeichnisses (/lizenzen/).
[[redirects]]
  from   = "/quellen"
  to     = "/lizenzen/"
  status = 301
  force  = true

[[redirects]]
  from   = "/quellen/"
  to     = "/lizenzen/"
  status = 301
  force  = true

[[redirects]]
  from   = "/_dwd_opendata/*"
  to     = "https://opendata.dwd.de/:splat"
  status = 200
  force  = true

# MeteoAlarm (EUMETNET) — amtliche Schweizer Warnungen von MeteoSchweiz
# (`src/sources/meteoAlarmCh.ts`, Phase W2). `feeds.meteoalarm.org` sendet KEIN
# `Access-Control-Allow-Origin` — am 2026-08-08 mit echtem
# `Origin: https://buscosun.com` gegengeprüft, auf Atom- UND CAP-Endpunkt.
#
# Bewusst ein **einfacher Rewrite** wie `/_dwd_opendata` und ausdrücklich KEINE
# Edge Function: `docs/API.md` §7 schließt einen Durable-Cache für Warnungen aus
# („veraltete Warnungen sind gefährlicher als keine"). Die Frische regeln der
# 60-s-Speichercache und der 5-Minuten-Takt im Client.
[[redirects]]
  from   = "/_meteoalarm/*"
  to     = "https://feeds.meteoalarm.org/:splat"
  status = 200
  force  = true

# NOAA GFS (AWS Open Data, S3) — 3D-Globus (`src/globe/gfs.ts`). S3 unterstützt
# HTTP-Range; Netlifys Edge-Proxy reicht Range/Query weiter und liefert die
# Antwort same-origin (kein Browser-CORS). Public Domain, kein Key/Limit.
[[redirects]]
  from   = "/_gfs/*"
  to     = "https://noaa-gfs-bdp-pds.s3.amazonaws.com/:splat"
  status = 200
  force  = true

# MeteoSchweiz OGD (ICON-CH1/CH2-EPS). Der STAC-Katalog (data.geo.admin.ch)
# erlaubt Browser-CORS, der pre-signed S3-Objektspeicher rgw.cscs.ch NICHT.
# ⚠️ Die S3-v2-Signatur wird über Host + Pfad + Query gebildet — Netlify reicht
# den Query-String beim Proxy-Rewrite durch, das ist aber an einem
# Preview-Deploy zu VERIFIZIEREN, bevor V-01 als erledigt gilt.
[[redirects]]
  from   = "/_cscs/*"
  to     = "https://rgw.cscs.ch/:splat"
  status = 200
  force  = true

# Météo-France PNT (AROME-France, ARPEGE): key-freie GRIB2-Pakete auf OVH-S3,
# ohne Browser-CORS. Range-fähig (selektives Nachladen einzelner Nachrichten).
[[redirects]]
  from   = "/_mf/*"
  to     = "https://meteofrance-pnt.s3.rbx.io.cloud.ovh.net/:splat"
  status = 200
  force  = true

# ECMWF Open Data (IFS, AIFS, AIFS-ENS): GRIB2 + .index-Sidecars, CC-BY-4.0,
# kein Key. Browser-CORS blockiert → Proxy.
[[redirects]]
  from   = "/_ecmwf/*"
  to     = "https://data.ecmwf.int/:splat"
  status = 200
  force  = true

# ── Alias-Domain buscosun.de → Primary buscosun.com ──────────────────────────
# Primary ist https://buscosun.com. Das Netlify-Domain-Alias leitet die Apex-Domain
# meist schon selbst um, `www.buscosun.de/<pfad>` lieferte aber 200 (Duplicate Content).
# Host-Regeln mit `force`, Pfad bleibt über :splat erhalten. Stehen vor allen
# App-Routen, weil Netlify von oben nach unten prüft.
[[redirects]]
  from   = "https://buscosun.de/*"
  to     = "https://buscosun.com/:splat"
  status = 301
  force  = true
[[redirects]]
  from   = "https://www.buscosun.de/*"
  to     = "https://buscosun.com/:splat"
  status = 301
  force  = true

# Slug-Korrektur (Akzente werden transliteriert statt zu „-" zu werden):
# /wetter/neuenburg-neuch-tel/ → /wetter/neuenburg-neuchatel/ (Ortsseiten sind
# Ordner mit End-Slash, siehe unten). Ziel mit Slash, damit keine Kette entsteht.
[[redirects]]
  from   = "/wetter/neuenburg-neuch-tel"
  to     = "/wetter/neuenburg-neuchatel/"
  status = 301
  force  = true

# ── App-Routen (Phase RT1, 2026-08-22: React Router 7, pfadbasiert) ──────────
#
# Quelle der Wahrheit ist `src/router/routes.ts`; `scripts/verify-routing.mjs`
# prüft, dass JEDE Route hier genau ein 200-Rewrite und JEDER Alias eine 301
# hat und dass `/* → /404.html` die letzte Regel bleibt (V-101: KEIN
# `/* → /index.html 200`, Fantasie-Adressen bleiben echte 404).
#
# Ziel der Rewrites ist die je Route erzeugte Shell `dist/<route>.html`
# (`scripts/generate-seo.mjs`: eigener Title/Canonical/JSON-LD im Roh-HTML —
# `index.html` trägt den Home-Canonical und wäre Duplicate Content). Flache
# Dateien, nicht `<route>/index.html`: „Pretty URLs" würde sonst auf den
# End-Slash umleiten. Nicht erzwungen — echte Dateien (/assets, /wetter/…,
# sitemap.xml) gewinnen weiterhin.
#
# Netlify matcht `from` OHNE Rücksicht auf den End-Slash; `/x/*` deckt damit
# auch `/x/` ab. Eine Regel `/x/ → /x 301` wäre eine Endlosschleife — die
# Slash-Normalisierung macht der Client (`App.tsx`, replace), der Canonical
# zeigt ohnehin auf den Pfad ohne Slash. Query-Strings reicht Netlify bei 301
# durch (am Deploy-Preview per curl belegen, `audit/routing.md`).

