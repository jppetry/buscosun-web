# 404 für unbekannte Pfade (V-101). Vorher lieferte diese Regel `/index.html`
# mit Status **200**, wodurch jede Fantasie-Adresse als gültige Seite zählte
# (Soft-404) und die erzeugte `404.html` nie ausgeliefert wurde.
#
# Die Regel ist NICHT erzwungen (kein `force`), also gewinnen weiterhin alle
# vorhandenen Dateien: Geo-Seiten /wetter/<ort>/index.html, /wissen/,
# /funktionen/, /impressum/, sitemap.xml, robots.txt, llms.txt, /assets/*.
# App-Routen stehen als 200-Rewrites oberhalb (Phase RT1); jede neue Route
# braucht dort einen Eintrag — `verify:routing` erzwingt das.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
