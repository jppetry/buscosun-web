<!doctype html>
<!--
  OG-Karten-Renderer der APP-SEITEN (SH6, Entscheidung E-5).

  Unterschied zu `_og-card.html` (den 74 Inhaltskarten): dort ist die ganze
  Flaeche hell. Hier ist der Rahmen hell (Sand/Ink, D-27) und das **Kartenfeld
  rechts dunkel** (--nc-radarbg) — genau wie die Decks der App: heller Rahmen,
  dunkle Mitte. Damit ist die Vorschau als buscosun erkennbar UND als Karte.

  Erzeugt von `scripts/render-og-app-cards.mjs`, gescreenshottet nach
  public/og/app/<slug>.png. Nicht fuer Endnutzer — noindex.

  Params: ?e=Eyebrow&t=Titel&s=Unterzeile&c=Akzent&m=Motiv&g=Feldmarke
  Motive: karte radar warn punkt feuer luft event archiv globus route text
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OG-Karte (App)</title>
    <style>
      :root {
        --sand:#FAF6EA; --ink:#2C2A26; --stone:#5C5447; --terra:#C97B47;
        --border:#E0D6BE; --field:#0B1016; --accent:#C97B47;
      }
      * { margin:0; padding:0; box-sizing:border-box; }
      html,body { width:1200px; height:630px; }
      body {
        font-family:"Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        background:var(--sand); color:var(--ink); overflow:hidden; position:relative;
      }
      .bar { position:absolute; left:0; top:0; bottom:0; width:14px; background:var(--accent); }
      /* `minmax(0, 1fr)` statt `1fr`: sonst darf die Textspalte so breit werden
         wie ihr laengstes Wort ("Unwetterwarnungen") und schiebt das Kartenfeld
         aus der Flaeche heraus — am gerenderten PNG gesehen, nicht vermutet. */
      .card { position:absolute; inset:0; padding:56px 64px 52px 78px;
        display:grid; grid-template-columns:minmax(0, 1fr) 430px; grid-template-rows:auto 1fr auto; column-gap:52px; }

      .brand { grid-column:1 / -1; display:flex; align-items:center; gap:15px; }
      .brand img { width:48px; height:48px; }
      .brand .wm { font-size:31px; font-weight:800; letter-spacing:-.5px; }

      .body { grid-column:1; align-self:center; padding-right:8px; }
      .eyebrow { font-size:24px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--accent); }
      .title { font-size:66px; line-height:1.07; font-weight:800; letter-spacing:-1.2px; margin:16px 0 0; }
      .sub { margin-top:20px; font-size:25px; line-height:1.35; color:var(--stone); font-weight:500; }

      /* Das Kartenfeld: dunkel wie die Deck-Mitte, mit Gitter und Motiv. */
      .field { grid-column:2; grid-row:2; align-self:center; position:relative;
        height:352px; border-radius:18px; background:var(--field);
        border:1px solid #1B2430; overflow:hidden;
        box-shadow:0 18px 40px rgba(44,42,38,.18); }
      .grid { position:absolute; inset:0; opacity:.5;
        background-image:linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
                         linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
        background-size:44px 44px; }
      .glow { position:absolute; inset:0;
        background:radial-gradient(circle at 62% 38%, var(--accent) 0%, transparent 62%); opacity:.20; }
      .field svg { position:absolute; inset:0; width:100%; height:100%; }
      /* Der Pfad im Kartenfeld — klein, kleingeschrieben, wie er in der
         Adresszeile steht. Er darf nie ueber den Rand laufen: lange Pfade
         (z. B. /atmosphaere/arbeitsfenster) werden mit Ellipse gekuerzt. */
      .tag { position:absolute; left:18px; right:18px; bottom:13px; font-size:15px;
        letter-spacing:.6px; font-weight:600; color:rgba(250,246,234,.62);
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; }

      .foot { grid-column:1 / -1; display:flex; align-items:center; gap:13px;
        font-size:21px; color:var(--stone); font-weight:600; }
      .foot .dot { color:var(--accent); }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="card">
      <div class="brand"><img src="/buscosun-mark.svg" alt="" /><span class="wm">buscosun</span></div>
      <div class="body">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 class="title" id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="field">
        <div class="grid"></div><div class="glow"></div>
        <div id="motif"></div>
        <span class="tag" id="tag"></span>
      </div>
      <div class="foot">
        <span>Wetter DE &middot; AT &middot; CH</span><span class="dot">&middot;</span>
        <span>amtliche Quellen, ohne Konto</span><span class="dot">&middot;</span>
        <span>buscosun.com</span>
      </div>
    </div>
    <script>
      const P = new URLSearchParams(location.search);
      const accent = P.get('c') || '#C97B47';
      document.documentElement.style.setProperty('--accent', accent);

      const A = accent, W = 'rgba(250,246,234,.80)', F = 'rgba(250,246,234,.16)';
      const svg = (inner) => '<svg viewBox="0 0 430 352" fill="none" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
      const MOTIF = {
        karte: svg('<g stroke="' + A + '" stroke-width="3" opacity=".85">'
          + '<path d="M-10 92 C 70 52, 150 132, 230 96 S 380 44, 440 82"/>'
          + '<path d="M-10 156 C 80 116, 160 196, 240 160 S 385 108, 440 146" opacity=".7"/>'
          + '<path d="M-10 220 C 70 184, 158 258, 238 222 S 382 172, 440 210" opacity=".5"/>'
          + '<path d="M-10 284 C 80 250, 156 316, 236 284 S 384 238, 440 272" opacity=".33"/></g>'),
        radar: svg('<g stroke="' + A + '" fill="none">'
          + '<circle cx="215" cy="176" r="42" stroke-width="3"/>'
          + '<circle cx="215" cy="176" r="86" stroke-width="2.5" opacity=".65"/>'
          + '<circle cx="215" cy="176" r="130" stroke-width="2" opacity=".4"/>'
          + '<path d="M215 176 L 330 108" stroke-width="3"/></g>'
          + '<circle cx="262" cy="132" r="17" fill="' + A + '" opacity=".55"/>'
          + '<circle cx="176" cy="216" r="11" fill="' + A + '" opacity=".35"/>'),
        warn: svg('<path d="M215 82 L 320 258 L 110 258 Z" stroke="' + A + '" stroke-width="4" stroke-linejoin="round"/>'
          + '<rect x="208" y="140" width="14" height="62" rx="7" fill="' + A + '"/>'
          + '<circle cx="215" cy="224" r="9" fill="' + A + '"/>'),
        punkt: svg('<path d="M20 250 C 90 232, 130 150, 200 142 S 330 96, 410 74" stroke="' + A + '" stroke-width="4"/>'
          + '<path d="M20 274 C 90 260, 130 186, 200 178 S 330 140, 410 120 L 410 30 C 330 52, 270 90, 200 106 S 90 204, 20 226 Z" fill="' + A + '" opacity=".14"/>'
          + '<g fill="' + W + '"><circle cx="110" cy="196" r="6"/><circle cx="200" cy="142" r="6"/>'
          + '<circle cx="300" cy="112" r="6"/><circle cx="390" cy="80" r="6"/></g>'),
        feuer: svg('<g fill="' + A + '"><circle cx="168" cy="150" r="13"/><circle cx="168" cy="150" r="34" opacity=".22"/>'
          + '<circle cx="262" cy="206" r="9"/><circle cx="262" cy="206" r="26" opacity=".18"/>'
          + '<circle cx="118" cy="238" r="6"/><circle cx="312" cy="122" r="6"/></g>'
          + '<path d="M40 292 C 120 264, 200 300, 300 262 S 400 236, 430 244" stroke="' + F + '" stroke-width="3"/>'),
        luft: svg('<g stroke="' + A + '" stroke-width="3" opacity=".8"><path d="M30 288 L 130 214 L 230 244 L 330 150 L 430 176"/></g>'
          + '<g fill="' + A + '" opacity=".16"><rect x="30" y="60" width="400" height="46" rx="6"/>'
          + '<rect x="30" y="122" width="400" height="34" rx="6" opacity=".7"/></g>'
          + '<g stroke="' + F + '" stroke-width="2"><path d="M30 60 L 430 60"/><path d="M30 122 L 430 122"/><path d="M30 190 L 430 190"/></g>'),
        event: svg('<rect x="86" y="76" width="258" height="200" rx="14" stroke="' + A + '" stroke-width="3"/>'
          + '<path d="M86 128 L 344 128" stroke="' + A + '" stroke-width="3"/>'
          + '<g fill="' + F + '"><rect x="110" y="150" width="42" height="30" rx="5"/><rect x="166" y="150" width="42" height="30" rx="5"/>'
          + '<rect x="278" y="150" width="42" height="30" rx="5"/><rect x="110" y="194" width="42" height="30" rx="5"/>'
          + '<rect x="222" y="194" width="42" height="30" rx="5"/><rect x="278" y="194" width="42" height="30" rx="5"/></g>'
          + '<rect x="222" y="150" width="42" height="30" rx="5" fill="' + A + '" opacity=".8"/>'
          + '<rect x="166" y="194" width="42" height="30" rx="5" fill="' + A + '" opacity=".35"/>'),
        archiv: svg('<g fill="' + F + '"><rect x="52" y="196" width="38" height="92" rx="5"/><rect x="106" y="164" width="38" height="124" rx="5"/>'
          + '<rect x="160" y="212" width="38" height="76" rx="5"/><rect x="214" y="140" width="38" height="148" rx="5"/>'
          + '<rect x="268" y="116" width="38" height="172" rx="5"/><rect x="322" y="92" width="38" height="196" rx="5"/></g>'
          + '<rect x="322" y="92" width="38" height="196" rx="5" fill="' + A + '" opacity=".55"/>'
          + '<path d="M71 214 L 125 190 L 179 200 L 233 156 L 287 134 L 341 104" stroke="' + A + '" stroke-width="3.5"/>'),
        globus: svg('<circle cx="215" cy="176" r="118" stroke="' + A + '" stroke-width="3"/>'
          + '<g stroke="' + A + '" stroke-width="2" opacity=".55"><ellipse cx="215" cy="176" rx="48" ry="118"/>'
          + '<ellipse cx="215" cy="176" rx="92" ry="118"/><path d="M97 176 L 333 176"/>'
          + '<path d="M119 112 L 311 112"/><path d="M119 240 L 311 240"/></g>'),
        route: svg('<path d="M20 286 L 96 196 L 158 232 L 236 118 L 312 186 L 410 96" stroke="' + A + '" stroke-width="4" stroke-linejoin="round"/>'
          + '<path d="M20 286 L 96 196 L 158 232 L 236 118 L 312 186 L 410 96 L 410 320 L 20 320 Z" fill="' + A + '" opacity=".13"/>'
          + '<g fill="' + W + '"><circle cx="20" cy="286" r="7"/><circle cx="410" cy="96" r="7"/></g>'),
        text: '',
      };
      document.getElementById('motif').innerHTML = MOTIF[P.get('m') || 'karte'] || MOTIF.karte;

      document.getElementById('eyebrow').textContent = P.get('e') || 'buscosun';
      document.getElementById('sub').textContent = P.get('s') || '';
      document.getElementById('tag').textContent = P.get('g') || '';
      const t = document.getElementById('title');
      t.textContent = P.get('t') || 'Wetter fuer Deutschland, Oesterreich und die Schweiz';
      // Auto-Fit: der Titel darf die Spalte nie sprengen — weder in der Hoehe
      // (drei Zeilen schieben sonst Eyebrow und Unterzeile aus dem Bild) noch
      // in der Breite (ein einzelnes langes Wort wie "Unwetterwarnungen").
      let size = 66;
      const fits = () => t.scrollHeight <= 216 && t.scrollWidth <= t.clientWidth;
      while (!fits() && size > 32) { size -= 2; t.style.fontSize = size + 'px'; }
      window.__ogReady = true;
    </script>
  </body>
</html>
