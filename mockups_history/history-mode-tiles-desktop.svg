<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 768" font-family="ui-sans-serif, system-ui, -apple-system">
  <defs>
    <linearGradient id="bgHM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F1E8"/><stop offset="100%" stop-color="#EDE6D3"/></linearGradient>
    <!-- Warming-Stripes-Skala: tiefes Blau → Stahl → Sand → Terracotta → tiefes Rot -->
    <linearGradient id="stripesA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a5c"/><stop offset="25%" stop-color="#3a6fa8"/><stop offset="50%" stop-color="#ede6d3"/><stop offset="75%" stop-color="#c97b47"/><stop offset="100%" stop-color="#9e2b25"/>
    </linearGradient>
    <linearGradient id="legA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3a5c"/><stop offset="25%" stop-color="#3a6fa8"/><stop offset="50%" stop-color="#ede6d3"/><stop offset="75%" stop-color="#c97b47"/><stop offset="100%" stop-color="#9e2b25"/>
    </linearGradient>
    <clipPath id="cardA"><rect width="620" height="470" rx="20"/></clipPath>
    <clipPath id="cardB"><rect width="620" height="470" rx="20"/></clipPath>
  </defs>
  <rect width="1440" height="768" fill="url(#bgHM)"/>

  <!-- TOP NAV -->
  <g transform="translate(32, 28)">
    <circle cx="12" cy="11" r="6" fill="#2C2A26"/>
    <g stroke="#2C2A26" stroke-width="1.4" stroke-linecap="round"><line x1="12" y1="-2" x2="12" y2="1"/><line x1="12" y1="21" x2="12" y2="24"/><line x1="-1" y1="11" x2="2" y2="11"/><line x1="22" y1="11" x2="25" y2="11"/><line x1="2.5" y1="1.5" x2="4.5" y2="3.5"/><line x1="19.5" y1="18.5" x2="21.5" y2="20.5"/><line x1="2.5" y1="20.5" x2="4.5" y2="18.5"/><line x1="19.5" y1="3.5" x2="21.5" y2="1.5"/></g>
    <text x="36" y="16" font-size="17" font-weight="500" fill="#2C2A26" letter-spacing="-0.4">buscosun</text>
    <g transform="translate(150, 2)" font-size="13"><text fill="#5C5447">Start</text><text x="58" fill="#2C2A26" font-weight="500">Historie</text><rect x="56" y="20" width="56" height="2" rx="1" fill="#2C2A26"/></g>
  </g>
  <g transform="translate(1408, 30)" text-anchor="end">
    <g transform="translate(-150,-6)"><rect width="120" height="26" rx="13" fill="#FFFFFF" stroke="#E0D6BE"/><circle cx="16" cy="13" r="3.5" fill="#7A9466"/><text x="30" y="17" font-size="11" fill="#5C5447" text-anchor="start">1940–2025</text></g>
    <g transform="translate(-22,-8)"><rect width="40" height="30" rx="15" fill="#FFFFFF" stroke="#D9D0B8"/><circle cx="20" cy="15" r="7" fill="#7A9466"/><text x="20" y="19" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="500">JK</text></g>
  </g>

  <!-- HEADER (nach Ortswahl) -->
  <g transform="translate(80, 92)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">WETTERHISTORIE · DILLENBURG · PUNKT</text>
    <text y="42" font-size="38" font-weight="300" fill="#2C2A26" letter-spacing="-1.1">Dillenburg<tspan fill="#A89A7A" font-size="22"> · 1940–2025</tspan></text>
  </g>
  <g transform="translate(80, 172)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">WAS MÖCHTEST DU SEHEN?</text>
    <text y="22" font-size="14" fill="#5C5447">Zwei Sichten auf dieselben Archivdaten — wähle, wie du das Klima von Dillenburg erkunden willst.</text>
  </g>

  <!-- ============ KACHEL A · VERÄNDERUNG ============ -->
  <g transform="translate(80, 226)">
    <rect width="620" height="470" rx="20" fill="#FFFFFF" stroke="#E0D6BE"/>
    <!-- aktive/empfohlene Markierung -->
    <rect x="1.5" y="1.5" width="617" height="467" rx="18.5" fill="none" stroke="#2C2A26" stroke-width="1.5" opacity="0.9"/>
    <g clip-path="url(#cardA)">
      <!-- Warming-Stripes-Band -->
      <rect width="620" height="128" fill="url(#stripesA)"/>
      <g stroke="#FFFFFF" stroke-width="1.4" opacity="0.20">
        <line x1="22" y1="0" x2="22" y2="128"/><line x1="44" y1="0" x2="44" y2="128"/><line x1="66" y1="0" x2="66" y2="128"/><line x1="88" y1="0" x2="88" y2="128"/><line x1="110" y1="0" x2="110" y2="128"/><line x1="132" y1="0" x2="132" y2="128"/><line x1="154" y1="0" x2="154" y2="128"/><line x1="176" y1="0" x2="176" y2="128"/><line x1="198" y1="0" x2="198" y2="128"/><line x1="220" y1="0" x2="220" y2="128"/><line x1="242" y1="0" x2="242" y2="128"/><line x1="264" y1="0" x2="264" y2="128"/><line x1="286" y1="0" x2="286" y2="128"/><line x1="308" y1="0" x2="308" y2="128"/><line x1="330" y1="0" x2="330" y2="128"/><line x1="352" y1="0" x2="352" y2="128"/><line x1="374" y1="0" x2="374" y2="128"/><line x1="396" y1="0" x2="396" y2="128"/><line x1="418" y1="0" x2="418" y2="128"/><line x1="440" y1="0" x2="440" y2="128"/><line x1="462" y1="0" x2="462" y2="128"/><line x1="484" y1="0" x2="484" y2="128"/><line x1="506" y1="0" x2="506" y2="128"/><line x1="528" y1="0" x2="528" y2="128"/><line x1="550" y1="0" x2="550" y2="128"/><line x1="572" y1="0" x2="572" y2="128"/><line x1="594" y1="0" x2="594" y2="128"/>
      </g>
      <!-- Trendlinie über die Streifen -->
      <path d="M16 104 L604 38" fill="none" stroke="#2C2A26" stroke-width="2" opacity="0.45" stroke-linecap="round"/>
      <circle cx="16" cy="104" r="3.5" fill="#FFFFFF" stroke="#2C2A26" stroke-width="1.6"/>
      <circle cx="604" cy="38" r="3.5" fill="#FFFFFF" stroke="#2C2A26" stroke-width="1.6"/>
    </g>
    <!-- empfohlen-Badge -->
    <g transform="translate(28, 22)"><rect width="96" height="22" rx="11" fill="rgba(255,255,255,0.85)"/><circle cx="14" cy="11" r="3.5" fill="#7A9466"/><text x="26" y="15" font-size="10" fill="#2C2A26" font-weight="600" letter-spacing="0.5">EMPFOHLEN</text></g>
    <!-- Icon-Badge (Trend) -->
    <g transform="translate(544, 22)"><rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#E0D6BE"/>
      <g transform="translate(9,9)" stroke="#C97B47" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 26 L2 4 M2 26 L28 26"/><path d="M5 22 L12 14 L18 18 L26 7"/><path d="M21 7 L26 7 L26 12"/></g></g>

    <!-- Inhalt -->
    <g transform="translate(28, 156)">
      <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">SEKTION 1 · VERÄNDERUNG</text>
      <text y="34" font-size="25" font-weight="400" fill="#2C2A26" letter-spacing="-0.6">Wie hat sich das Wetter verändert?</text>
      <text y="62" font-size="14" fill="#5C5447">Klimastreifen, Abweichungen, Kenntage und Trends über die Jahrzehnte.</text>

      <!-- Tag-Chips -->
      <g transform="translate(0, 82)" font-size="12">
        <g><rect width="104" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="52" y="18" fill="#3A372F" text-anchor="middle">Klimastreifen</text></g>
        <g transform="translate(112,0)"><rect width="84" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="42" y="18" fill="#3A372F" text-anchor="middle">Anomalien</text></g>
        <g transform="translate(204,0)"><rect width="80" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="40" y="18" fill="#3A372F" text-anchor="middle">Kenntage</text></g>
        <g transform="translate(292,0)"><rect width="60" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="30" y="18" fill="#3A372F" text-anchor="middle">Trend</text></g>
      </g>

      <!-- Flourish: Trendzahl + Legende -->
      <g transform="translate(0, 134)">
        <text font-size="34" font-weight="500" fill="#C97B47" letter-spacing="-1">+1,8 °C</text>
        <text y="22" font-size="11" fill="#8B7355">Jahresmittel · 1940 → 2025</text>
        <g transform="translate(300, -8)">
          <text font-size="9" fill="#A89A7A" letter-spacing="1.5" font-weight="500">KÄLTER</text>
          <text x="240" font-size="9" fill="#A89A7A" letter-spacing="1.5" font-weight="500" text-anchor="end">WÄRMER</text>
          <rect y="12" width="240" height="10" rx="5" fill="url(#legA)"/>
          <g font-size="9" fill="#8B7355" transform="translate(0,38)"><text>−2°</text><text x="120" text-anchor="middle">Normal</text><text x="240" text-anchor="end">+2°</text></g>
        </g>
      </g>

      <!-- Öffnen -->
      <g transform="translate(0, 250)">
        <text x="476" y="16" font-size="13" fill="#2C2A26" font-weight="500" text-anchor="end">Diese Sicht öffnen</text>
        <g transform="translate(528, 0)"><circle cx="18" cy="9" r="18" fill="#2C2A26"/><g transform="translate(18,9)" stroke="#F5F1E8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="-6" y1="0" x2="6" y2="0"/><polyline points="2,-4 6,0 2,4"/></g></g>
      </g>
    </g>
  </g>

  <!-- ============ KACHEL B · RÜCKBLICK ============ -->
  <g transform="translate(740, 226)">
    <rect width="620" height="470" rx="20" fill="#FFFFFF" stroke="#E0D6BE"/>
    <g clip-path="url(#cardB)">
      <!-- ruhiges Sand-Band (archivarisch) -->
      <rect width="620" height="128" fill="#FAF6EA"/>
      <line x1="0" y1="128" x2="620" y2="128" stroke="#E0D6BE"/>
      <text x="28" y="34" font-size="10" fill="#A89A7A" letter-spacing="2.5" font-weight="500">JEDER EINZELNE TAG · 1940 – 2025</text>
      <!-- Tages-Kacheln (Heatmap-Anklang) -->
      <g transform="translate(28, 48)">
        <rect width="16" height="16" rx="3" fill="#3a6fa8"/><rect x="20" width="16" height="16" rx="3" fill="#5e87b1"/><rect x="40" width="16" height="16" rx="3" fill="#a5b6c2"/><rect x="60" width="16" height="16" rx="3" fill="#ede6d3" stroke="#E0D6BE" stroke-width="0.5"/><rect x="80" width="16" height="16" rx="3" fill="#e6d1b7"/><rect x="100" width="16" height="16" rx="3" fill="#d09063"/><rect x="120" width="16" height="16" rx="3" fill="#c97b47"/><rect x="140" width="16" height="16" rx="3" fill="#9e2b25"/>
        <rect y="20" width="16" height="16" rx="3" fill="#5e87b1"/><rect x="20" y="20" width="16" height="16" rx="3" fill="#a5b6c2"/><rect x="40" y="20" width="16" height="16" rx="3" fill="#ede6d3" stroke="#E0D6BE" stroke-width="0.5"/><rect x="60" y="20" width="16" height="16" rx="3" fill="#e6d1b7"/><rect x="80" y="20" width="16" height="16" rx="3" fill="#d09063"/><rect x="100" y="20" width="16" height="16" rx="3" fill="#d7a67f"/><rect x="120" y="20" width="16" height="16" rx="3" fill="#c97b47"/><rect x="140" y="20" width="16" height="16" rx="3" fill="#b85b39"/>
        <rect x="120" y="-3" width="22" height="22" rx="5" fill="none" stroke="#2C2A26" stroke-width="2"/>
      </g>
      <text x="220" y="60" font-size="12" fill="#5C5447">Klick auf einen Tag öffnet</text>
      <text x="220" y="78" font-size="12" fill="#5C5447">sein Tagesdetail.</text>
    </g>
    <!-- Icon-Badge (Kalender) -->
    <g transform="translate(544, 22)"><rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#E0D6BE"/>
      <g transform="translate(11,11)" stroke="#3A6FA8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="24" height="22" rx="3"/><line x1="1" y1="10" x2="25" y2="10"/><line x1="7" y1="1" x2="7" y2="6"/><line x1="19" y1="1" x2="19" y2="6"/><rect x="6" y="14" width="5" height="5" rx="1" fill="#3A6FA8" stroke="none"/></g></g>

    <!-- Inhalt -->
    <g transform="translate(28, 156)">
      <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">SEKTION 2 · RÜCKBLICK</text>
      <text y="34" font-size="25" font-weight="400" fill="#2C2A26" letter-spacing="-0.6">Wie war das Wetter?</text>
      <text y="62" font-size="14" fill="#5C5447">Ein Tag, ein Monat oder ein ganzes Jahr im Detail nachschlagen.</text>

      <!-- Tag-Chips -->
      <g transform="translate(0, 82)" font-size="12">
        <g><rect width="78" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="39" y="18" fill="#3A372F" text-anchor="middle">Kalender</text></g>
        <g transform="translate(86,0)"><rect width="88" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="44" y="18" fill="#3A372F" text-anchor="middle">Tagesband</text></g>
        <g transform="translate(182,0)"><rect width="74" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="37" y="18" fill="#3A372F" text-anchor="middle">Rekorde</text></g>
        <g transform="translate(264,0)"><rect width="124" height="28" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/><text x="62" y="18" fill="#3A372F" text-anchor="middle">Wetter an Datum</text></g>
      </g>

      <!-- Flourish: Nachschlag-Karte -->
      <g transform="translate(0, 122)">
        <rect width="536" height="62" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <g transform="translate(20, 19)" stroke="#8B7355" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="2" width="22" height="20" rx="3"/><line x1="0" y1="8" x2="22" y2="8"/><line x1="6" y1="0" x2="6" y2="4"/><line x1="16" y1="0" x2="16" y2="4"/></g>
        <text x="58" y="28" font-size="15" font-weight="500" fill="#2C2A26">12. August 1976</text>
        <text x="58" y="46" font-size="11" fill="#8B7355">Rekordhitze am Ort · seit Messbeginn</text>
        <g transform="translate(420, 15)"><rect width="96" height="32" rx="16" fill="#F7EBDD" stroke="#E4C3A6"/><text x="48" y="21" font-size="14" font-weight="600" fill="#A85E2E" text-anchor="middle">36,4 °C</text></g>
      </g>

      <!-- Öffnen -->
      <g transform="translate(0, 250)">
        <text x="476" y="16" font-size="13" fill="#2C2A26" font-weight="500" text-anchor="end">Diese Sicht öffnen</text>
        <g transform="translate(528, 0)"><circle cx="18" cy="9" r="18" fill="#2C2A26"/><g transform="translate(18,9)" stroke="#F5F1E8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="-6" y1="0" x2="6" y2="0"/><polyline points="2,-4 6,0 2,4"/></g></g>
      </g>
    </g>
  </g>

  <!-- FOOTER -->
  <line x1="80" y1="724" x2="1360" y2="724" stroke="#E0D6BE" stroke-width="0.5"/>
  <g transform="translate(80, 748)">
    <text font-size="10" fill="#A89A7A" letter-spacing="3" font-weight="500">HISTORIE · MODUS-WAHL · ZWEI SEKTIONEN NACH DER ORTSWAHL</text>
    <text x="1280" font-size="10" fill="#A89A7A" letter-spacing="2" text-anchor="end">Veränderung (Streifen/Anomalie/Kenntage/Trend) · Rückblick (Kalender/Tagesband/Rekorde/Datum)</text>
  </g>
</svg>
