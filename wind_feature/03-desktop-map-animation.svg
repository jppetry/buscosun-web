<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EA"/>
      <stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="transparent"/>
      <circle cx="20" cy="40" r="0.7" fill="#C4B896" opacity="0.18"/>
      <circle cx="80" cy="20" r="0.5" fill="#C4B896" opacity="0.14"/>
      <circle cx="55" cy="95" r="0.6" fill="#C4B896" opacity="0.16"/>
    </pattern>
    <pattern id="mapTextureBig" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#EDE6D3"/>
      <path d="M 0 32 Q 16 30 32 32 Q 48 34 64 32" fill="none" stroke="#C4B896" stroke-width="0.5" opacity="0.5"/>
      <path d="M 32 0 Q 30 16 32 32 Q 34 48 32 64" fill="none" stroke="#C4B896" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <radialGradient id="livePulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7A9466" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7A9466" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bgSand)"/>
  <rect width="1440" height="900" fill="url(#grain)"/>

  <!-- ====== VOLLBILD-KARTE als Hauptfläche ====== -->
  <g>
    <rect width="1440" height="900" fill="url(#mapTextureBig)"/>

    <!-- Big topo system: outlines of regions -->
    <g opacity="0.4">
      <!-- Country borders (stylized DACH) -->
      <path d="M 200 760 Q 280 720 340 700 Q 400 680 460 700 Q 520 740 580 750 L 600 800"
            fill="none" stroke="#8B7355" stroke-width="1" stroke-dasharray="4 3"/>
      <!-- River lines -->
      <path d="M 100 540 Q 200 500 280 540 Q 360 580 460 540 Q 540 510 620 540 Q 700 580 820 540 Q 900 520 1000 540 Q 1080 580 1180 540"
            fill="none" stroke="#3A6FA8" stroke-width="1.4" opacity="0.5"/>
      <text x="540" y="528" font-size="9" font-style="italic" fill="#3A6FA8" opacity="0.7">Rhein</text>
      <path d="M 600 200 Q 700 240 760 220 Q 820 200 920 240 Q 1000 280 1080 260 Q 1160 240 1240 280"
            fill="none" stroke="#3A6FA8" stroke-width="1.4" opacity="0.5"/>
      <text x="820" y="212" font-size="9" font-style="italic" fill="#3A6FA8" opacity="0.7">Main</text>

      <!-- Cities -->
      <g font-size="11" fill="#5C5447">
        <text x="220" y="320">Düsseldorf</text>
        <text x="180" y="500">Köln</text>
        <text x="420" y="320">Hannover</text>
        <text x="640" y="450">Frankfurt</text>
        <text x="510" y="540">Mainz</text>
        <text x="450" y="270">Kassel</text>
        <text x="780" y="540">Würzburg</text>
        <text x="640" y="640">Stuttgart</text>
        <text x="940" y="660">München</text>
        <text x="350" y="660">Saarbrücken</text>
      </g>

      <g fill="#5C5447">
        <circle cx="216" cy="316" r="2.5"/>
        <circle cx="176" cy="496" r="2.5"/>
        <circle cx="416" cy="316" r="2.5"/>
        <circle cx="636" cy="446" r="2.5"/>
        <circle cx="506" cy="536" r="2.5"/>
        <circle cx="446" cy="266" r="2.5"/>
        <circle cx="776" cy="536" r="2.5"/>
        <circle cx="636" cy="636" r="2.5"/>
        <circle cx="936" cy="656" r="2.5"/>
        <circle cx="346" cy="656" r="2.5"/>
      </g>
    </g>

    <!-- ====== NIEDERSCHLAGS-FELDER ====== -->
    <!-- Lage: konvektive Schauer-Linie zieht von West nach Ost -->
    <g>
      <!-- Light outer envelope (Region West/Süd) -->
      <ellipse cx="280" cy="380" rx="170" ry="120" fill="#9AB8CF" opacity="0.42"/>
      <ellipse cx="320" cy="420" rx="140" ry="100" fill="#3A6FA8" opacity="0.42"/>
      <ellipse cx="380" cy="480" rx="120" ry="80" fill="#3A6FA8" opacity="0.55"/>
      <!-- Heavy core (Starkregen) -->
      <ellipse cx="420" cy="500" rx="80" ry="55" fill="#1F4878" opacity="0.7"/>
      <ellipse cx="440" cy="510" rx="50" ry="38" fill="#1F4878" opacity="0.9"/>
      <!-- Very heavy spot -->
      <ellipse cx="450" cy="515" rx="22" ry="16" fill="#D7263D" opacity="0.65"/>

      <!-- Second cell (Eastern) -->
      <ellipse cx="700" cy="380" rx="110" ry="78" fill="#9AB8CF" opacity="0.4"/>
      <ellipse cx="740" cy="400" rx="80" ry="58" fill="#3A6FA8" opacity="0.55"/>
      <ellipse cx="780" cy="410" rx="50" ry="36" fill="#1F4878" opacity="0.65"/>

      <!-- Light scattered to North -->
      <ellipse cx="540" cy="240" rx="90" ry="60" fill="#9AB8CF" opacity="0.3"/>
      <ellipse cx="580" cy="250" rx="50" ry="36" fill="#3A6FA8" opacity="0.4"/>

      <!-- Snow region (alpine) -->
      <g>
        <ellipse cx="990" cy="700" rx="100" ry="60" fill="#B6C8D6" opacity="0.5"/>
        <ellipse cx="1020" cy="710" rx="60" ry="38" fill="#B6C8D6" opacity="0.7"/>
        <!-- Snow flakes -->
        <g fill="#6B7A8F" font-size="14">
          <text x="970" y="690">❄</text>
          <text x="1010" y="715">❄</text>
          <text x="1050" y="705">❄</text>
          <text x="990" y="730">❄</text>
        </g>
      </g>

      <!-- Movement arrows (showing direction) -->
      <g stroke="#1F4878" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <line x1="420" y1="500" x2="480" y2="490"/>
        <path d="M 472 484 L 482 490 L 472 496"/>
        <line x1="780" y1="410" x2="840" y2="396"/>
        <path d="M 832 390 L 842 396 L 832 402"/>
      </g>
    </g>

    <!-- ====== ACTIVE PIN: User-Position ====== -->
    <g transform="translate(440, 460)" filter="url(#strongShadow)">
      <circle r="32" fill="#C97B47" opacity="0.08"/>
      <circle r="24" fill="#C97B47" opacity="0.14"/>
      <circle r="16" fill="#FAF6EA" stroke="#C97B47" stroke-width="3"/>
      <circle r="7" fill="#C97B47"/>
    </g>
    <g transform="translate(464, 460)">
      <text y="2" font-size="13" font-weight="700" fill="#2C2A26">Dillenburg</text>
      <text y="20" font-size="10" fill="#5C5447">dein Standort</text>
    </g>

    <!-- ====== FLOATING TOOLTIP NEAR PIN ====== -->
    <g transform="translate(488, 380)" filter="url(#cardShadow)">
      <rect width="240" height="100" rx="14" fill="#FAF6EA" stroke="#E0D6BE" stroke-width="1.5"/>
      <path d="M 30 100 L 40 116 L 50 100 Z" fill="#FAF6EA" stroke="#E0D6BE" stroke-width="1.5"/>

      <g transform="translate(16, 14)">
        <text font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">DILLENBURG · JETZT</text>
        <g transform="translate(0, 14)">
          <text font-size="28" font-weight="700" fill="#2C2A26">1,8 mm/h</text>
          <text y="18" font-size="11" fill="#5C5447">leicht-mäßig · Regen</text>
        </g>
        <line x1="0" y1="60" x2="208" y2="60" stroke="#E0D6BE"/>
        <g transform="translate(0, 72)" font-size="10">
          <text fill="#8B7355">in 23 min</text>
          <text x="208" font-weight="700" fill="#C97B47" text-anchor="end">Regenbeginn 14:55</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ====== TOP-BAR (transparenter Overlay) ====== -->
  <g>
    <rect width="1440" height="60" fill="#FAF6EA" opacity="0.88"/>
    <line x1="0" y1="60" x2="1440" y2="60" stroke="#E0D6BE"/>

    <g transform="translate(40, 18)">
      <path d="M 8 0 L 0 8 L 8 16" fill="none" stroke="#5C5447" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="14" font-size="13" fill="#5C5447">zurück</text>
    </g>

    <text x="720" y="38" font-size="14" font-weight="600" fill="#2C2A26" text-anchor="middle">Niederschlags-Animation</text>
    <text x="720" y="52" font-size="11" fill="#8B7355" text-anchor="middle">DWD-Radar · −60 min bis +6 h · Frame 14:32</text>

    <g transform="translate(1240, 18)">
      <circle cx="14" cy="14" r="14" fill="url(#livePulse)"/>
      <circle cx="14" cy="14" r="4" fill="#7A9466"/>
      <text x="28" y="19" font-size="12" fill="#5C5447">Radar live</text>
    </g>
  </g>

  <!-- ====== LEGENDE (oben links als Overlay) ====== -->
  <g transform="translate(40, 80)" filter="url(#cardShadow)">
    <rect width="260" height="200" rx="14" fill="#FAF6EA" opacity="0.96" stroke="#E0D6BE"/>

    <text x="20" y="26" font-size="11" letter-spacing="0.22em" font-weight="600" fill="#3A6FA8">LEGENDE</text>
    <line x1="20" y1="34" x2="240" y2="34" stroke="#E0D6BE"/>

    <g transform="translate(20, 44)" font-size="11">
      <text font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">INTENSITÄT MM/H</text>
      <g transform="translate(0, 14)">
        <rect width="22" height="10" fill="#FAF6EA" stroke="#C4B896"/>
        <text x="30" y="9" fill="#5C5447">trocken</text>
        <rect x="116" width="22" height="10" fill="#9AB8CF" opacity="0.6"/>
        <text x="146" y="9" fill="#5C5447">0,1 – 1</text>
      </g>
      <g transform="translate(0, 28)">
        <rect width="22" height="10" fill="#3A6FA8" opacity="0.7"/>
        <text x="30" y="9" fill="#5C5447">1 – 2,5</text>
        <rect x="116" width="22" height="10" fill="#1F4878"/>
        <text x="146" y="9" fill="#5C5447">2,5 – 10</text>
      </g>
      <g transform="translate(0, 42)">
        <rect width="22" height="10" fill="#D7263D" opacity="0.8"/>
        <text x="30" y="9" fill="#5C5447">&gt; 10 stark</text>
      </g>

      <line x1="0" y1="60" x2="220" y2="60" stroke="#E0D6BE"/>

      <text y="78" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">PHASE</text>
      <g transform="translate(0, 92)">
        <rect width="22" height="10" fill="#3A6FA8"/>
        <text x="30" y="9" fill="#5C5447">Regen</text>
        <rect x="116" width="22" height="10" fill="#B6C8D6"/>
        <text x="146" y="9" fill="#5C5447">Schnee</text>
      </g>
      <g transform="translate(0, 106)">
        <rect width="22" height="10" fill="#A994D1"/>
        <text x="30" y="9" fill="#5C5447">Schneeregen</text>
      </g>
      <g transform="translate(0, 120)">
        <rect width="22" height="10" fill="#D7263D" stroke="#1F4878"/>
        <text x="30" y="9" fill="#5C5447">gefr. Regen · Glätte</text>
      </g>
    </g>
  </g>

  <!-- ====== LAYER TOGGLES (rechts oben) ====== -->
  <g transform="translate(1148, 80)" filter="url(#cardShadow)">
    <rect width="252" height="208" rx="14" fill="#FAF6EA" opacity="0.96" stroke="#E0D6BE"/>

    <text x="20" y="26" font-size="11" letter-spacing="0.22em" font-weight="600" fill="#3A6FA8">LAYER</text>
    <line x1="20" y1="34" x2="232" y2="34" stroke="#E0D6BE"/>

    <g transform="translate(20, 50)" font-size="12">
      <!-- Toggle 1: ON -->
      <g>
        <rect width="36" height="20" rx="10" fill="#3A6FA8"/>
        <circle cx="26" cy="10" r="8" fill="#FAF6EA"/>
        <text x="48" y="14" font-weight="600" fill="#2C2A26">Niederschlag</text>
      </g>
      <g transform="translate(0, 30)">
        <rect width="36" height="20" rx="10" fill="#3A6FA8"/>
        <circle cx="26" cy="10" r="8" fill="#FAF6EA"/>
        <text x="48" y="14" font-weight="600" fill="#2C2A26">Phase färben</text>
      </g>
      <g transform="translate(0, 60)">
        <rect width="36" height="20" rx="10" fill="#E0D6BE"/>
        <circle cx="10" cy="10" r="8" fill="#FAF6EA"/>
        <text x="48" y="14" fill="#5C5447">Gewitter-Zellen</text>
      </g>
      <g transform="translate(0, 90)">
        <rect width="36" height="20" rx="10" fill="#3A6FA8"/>
        <circle cx="26" cy="10" r="8" fill="#FAF6EA"/>
        <text x="48" y="14" font-weight="600" fill="#2C2A26">Bewegungs-Pfeile</text>
      </g>
      <g transform="translate(0, 120)">
        <rect width="36" height="20" rx="10" fill="#E0D6BE"/>
        <circle cx="10" cy="10" r="8" fill="#FAF6EA"/>
        <text x="48" y="14" fill="#5C5447">Topo-Konturen</text>
      </g>

      <line x1="0" y1="146" x2="212" y2="146" stroke="#E0D6BE"/>

      <g transform="translate(0, 162)">
        <text font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">QUELLE-FÄRBUNG</text>
        <g transform="translate(0, 16)">
          <rect width="36" height="20" rx="10" fill="#E0D6BE"/>
          <circle cx="10" cy="10" r="8" fill="#FAF6EA"/>
          <text x="48" y="14" fill="#5C5447">Radar/Blend/NWP</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ====== KARTEN-KONTROLLEN (Zoom etc rechts unten) ====== -->
  <g transform="translate(1340, 320)">
    <rect width="60" height="120" rx="14" fill="#FAF6EA" opacity="0.95" stroke="#E0D6BE"/>
    <text x="30" y="34" font-size="26" font-weight="300" fill="#5C5447" text-anchor="middle">+</text>
    <line x1="12" y1="46" x2="48" y2="46" stroke="#E0D6BE"/>
    <text x="30" y="80" font-size="32" font-weight="300" fill="#5C5447" text-anchor="middle">−</text>
    <line x1="12" y1="90" x2="48" y2="90" stroke="#E0D6BE"/>
    <g transform="translate(30, 106)">
      <circle r="9" fill="none" stroke="#5C5447" stroke-width="1.4"/>
      <circle r="2" fill="#C97B47"/>
      <line x1="0" y1="-13" x2="0" y2="-11" stroke="#5C5447" stroke-width="1.4"/>
      <line x1="0" y1="11" x2="0" y2="13" stroke="#5C5447" stroke-width="1.4"/>
      <line x1="-13" y1="0" x2="-11" y2="0" stroke="#5C5447" stroke-width="1.4"/>
      <line x1="11" y1="0" x2="13" y2="0" stroke="#5C5447" stroke-width="1.4"/>
    </g>
  </g>

  <!-- ====== ANIMATIONS-PLAYER UNTEN ====== -->
  <g transform="translate(40, 740)" filter="url(#strongShadow)">
    <rect width="1360" height="120" rx="20" fill="#FAF6EA" opacity="0.96" stroke="#E0D6BE"/>

    <!-- Title + status -->
    <g transform="translate(28, 24)">
      <text font-size="11" letter-spacing="0.22em" font-weight="600" fill="#3A6FA8">ANIMATION · −60 MIN → +6 H</text>

      <!-- Speed control top-right -->
      <g transform="translate(1284, -4)">
        <rect width="80" height="22" rx="11" fill="#EDE6D3"/>
        <text x="40" y="15" font-size="10" font-weight="600" fill="#5C5447" text-anchor="middle">1× · 2× · 4×</text>
      </g>
    </g>

    <!-- Play controls + timeline -->
    <g transform="translate(28, 56)">
      <!-- Skip back -->
      <g transform="translate(16, 24)">
        <circle r="16" fill="#EDE6D3"/>
        <path d="M 4 -6 L -6 0 L 4 6 Z" fill="#5C5447"/>
        <line x1="-8" y1="-6" x2="-8" y2="6" stroke="#5C5447" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Step back -->
      <g transform="translate(58, 24)">
        <circle r="14" fill="#EDE6D3"/>
        <path d="M 3 -5 L -5 0 L 3 5 Z" fill="#5C5447"/>
      </g>

      <!-- Play big -->
      <g transform="translate(108, 24)">
        <circle r="20" fill="#3A6FA8"/>
        <path d="M -5 -8 L -5 8 L 9 0 Z" fill="#FAF6EA"/>
      </g>

      <!-- Step forward -->
      <g transform="translate(160, 24)">
        <circle r="14" fill="#EDE6D3"/>
        <path d="M -3 -5 L 5 0 L -3 5 Z" fill="#5C5447"/>
      </g>

      <!-- Skip forward -->
      <g transform="translate(202, 24)">
        <circle r="16" fill="#EDE6D3"/>
        <path d="M -4 -6 L 6 0 L -4 6 Z" fill="#5C5447"/>
        <line x1="8" y1="-6" x2="8" y2="6" stroke="#5C5447" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- ===== TIMELINE SCRUBBER ===== -->
      <g transform="translate(246, 0)">
        <!-- Background track -->
        <rect x="0" y="20" width="1058" height="6" rx="3" fill="#E0D6BE"/>

        <!-- Past (radar): -60 .. 0 -->
        <rect x="0" y="20" width="148" height="6" rx="3" fill="#3A6FA8" opacity="0.4"/>

        <!-- Position marker at "now" (148px = 0 of total 1058, since past is 148 of 1058) -->
        <!-- Wait: full range is -60..+360 = 420 min; past = 60 min = 14.3% → 148px is wrong -->
        <!-- Let me adjust: 1058 px / 420 min = 2.52 px/min. Past 60 min = 151 px -->

        <!-- Position dot at "now" (current frame) -->
        <g transform="translate(151, 23)">
          <circle r="11" fill="#C97B47" filter="url(#cardShadow)"/>
          <circle r="3" fill="#FAF6EA"/>
        </g>

        <!-- Time markers along scrubber -->
        <g font-size="9" fill="#8B7355">
          <line x1="0" y1="14" x2="0" y2="20" stroke="#8B7355"/>
          <text x="0" y="48" text-anchor="middle">−60</text>
          <text x="0" y="60" font-size="8">13:32</text>

          <line x1="76" y1="16" x2="76" y2="20" stroke="#8B7355"/>
          <text x="76" y="48" text-anchor="middle">−30</text>

          <line x1="151" y1="14" x2="151" y2="20" stroke="#C97B47"/>
          <text x="151" y="48" font-weight="700" fill="#C97B47" text-anchor="middle">JETZT</text>
          <text x="151" y="60" font-size="8" font-weight="700" fill="#C97B47">14:32</text>

          <line x1="378" y1="16" x2="378" y2="20" stroke="#8B7355"/>
          <text x="378" y="48" text-anchor="middle">+90</text>
          <text x="378" y="60" font-size="8">Radar-Ende</text>

          <line x1="453" y1="14" x2="453" y2="20" stroke="#8B7355"/>
          <text x="453" y="48" text-anchor="middle">+2 h</text>
          <text x="453" y="60" font-size="8" font-style="italic">Skill-Horizont</text>

          <line x1="755" y1="14" x2="755" y2="20" stroke="#8B7355"/>
          <text x="755" y="48" text-anchor="middle">+4 h</text>

          <line x1="1058" y1="14" x2="1058" y2="20" stroke="#8B7355"/>
          <text x="1058" y="48" text-anchor="middle">+6 h</text>
          <text x="1058" y="60" font-size="8">20:32</text>
        </g>

        <!-- Source zone labels above the track (Radar / Blend / NWP) -->
        <g transform="translate(0, -2)" font-size="8" letter-spacing="0.08em" font-weight="700">
          <rect x="0" y="0" width="151" height="14" rx="3" fill="#3A6FA8" opacity="0.4"/>
          <text x="75" y="10" fill="#FAF6EA" text-anchor="middle">RADAR-HISTORIE</text>

          <rect x="151" y="0" width="227" height="14" rx="3" fill="#3A6FA8" opacity="0.7"/>
          <text x="265" y="10" fill="#FAF6EA" text-anchor="middle">RADAR + NOWCAST</text>

          <rect x="378" y="0" width="227" height="14" fill="#C97B47" opacity="0.6"/>
          <text x="492" y="10" fill="#FAF6EA" text-anchor="middle">BLEND</text>

          <rect x="605" y="0" width="453" height="14" rx="3" fill="#8B7355" opacity="0.4"/>
          <text x="832" y="10" fill="#FAF6EA" text-anchor="middle">ICON-D2 · NWP</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Scale bottom right -->
  <g transform="translate(1300, 720)" opacity="0.8">
    <line x1="0" y1="6" x2="80" y2="6" stroke="#5C5447" stroke-width="1.5"/>
    <line x1="0" y1="2" x2="0" y2="10" stroke="#5C5447" stroke-width="1.5"/>
    <line x1="80" y1="2" x2="80" y2="10" stroke="#5C5447" stroke-width="1.5"/>
    <text x="0" y="22" font-size="10" fill="#5C5447">50 km</text>
  </g>
</svg>
