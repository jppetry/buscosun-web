<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EA"/>
      <stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="transparent"/>
      <circle cx="20" cy="40" r="0.7" fill="#C4B896" opacity="0.18"/>
      <circle cx="80" cy="20" r="0.5" fill="#C4B896" opacity="0.14"/>
      <circle cx="55" cy="95" r="0.6" fill="#C4B896" opacity="0.16"/>
    </pattern>
    <pattern id="mapTexture" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#EDE6D3"/>
      <path d="M 0 24 Q 12 22 24 24 Q 36 26 48 24" fill="none" stroke="#C4B896" stroke-width="0.5" opacity="0.5"/>
      <path d="M 24 0 Q 22 12 24 24 Q 26 36 24 48" fill="none" stroke="#C4B896" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="390" height="1500" fill="url(#bgSand)"/>
  <rect width="390" height="1500" fill="url(#grain)"/>

  <!-- ====== STATUS BAR ====== -->
  <g>
    <rect width="390" height="44" fill="#FAF6EA"/>
    <text x="22" y="28" font-size="14" font-weight="700" fill="#2C2A26">9:41</text>
    <g transform="translate(330, 14)" fill="#2C2A26">
      <rect x="0" y="2" width="3" height="8" rx="1"/>
      <rect x="5" y="0" width="3" height="10" rx="1"/>
      <rect x="10" y="-2" width="3" height="12" rx="1"/>
      <rect x="22" y="0" width="20" height="10" rx="2" fill="none" stroke="#2C2A26" stroke-width="1"/>
      <rect x="24" y="2" width="14" height="6" rx="1" fill="#7A9466"/>
    </g>
  </g>

  <!-- ====== TOP NAV ====== -->
  <g transform="translate(0, 44)">
    <rect width="390" height="56" fill="#FAF6EA"/>
    <line x1="0" y1="56" x2="390" y2="56" stroke="#E0D6BE"/>
    <g transform="translate(16, 18)">
      <path d="M 8 0 L 0 10 L 8 20" fill="none" stroke="#2C2A26" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="195" y="32" font-size="14" font-weight="600" fill="#2C2A26" text-anchor="middle">Nowcast</text>
    <text x="195" y="46" font-size="10" fill="#8B7355" text-anchor="middle">6 Stunden Niederschlag</text>
    <!-- Settings -->
    <g transform="translate(354, 18)" stroke="#2C2A26" stroke-width="1.6" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="3"/>
      <line x1="0" y1="-9" x2="0" y2="-6"/>
      <line x1="0" y1="6" x2="0" y2="9"/>
      <line x1="-9" y1="0" x2="-6" y2="0"/>
      <line x1="6" y1="0" x2="9" y2="0"/>
      <line x1="-6.4" y1="-6.4" x2="-4.2" y2="-4.2"/>
      <line x1="4.2" y1="4.2" x2="6.4" y2="6.4"/>
      <line x1="-6.4" y1="6.4" x2="-4.2" y2="4.2"/>
      <line x1="4.2" y1="-4.2" x2="6.4" y2="-6.4"/>
    </g>
  </g>

  <!-- ====== LOCATION BAR ====== -->
  <g transform="translate(16, 116)">
    <rect width="358" height="44" rx="22" fill="#FAF6EA" stroke="#E0D6BE"/>
    <g transform="translate(16, 14)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#C97B47" stroke-width="1.6"/>
      <circle cx="8" cy="8" r="2" fill="#C97B47"/>
    </g>
    <text x="44" y="28" font-size="13" font-weight="600" fill="#2C2A26">Dillenburg</text>
    <text x="118" y="28" font-size="11" fill="#8B7355">· dein Standort</text>
    <text x="338" y="28" font-size="11" fill="#3A6FA8" font-weight="600" text-anchor="end">ändern</text>
  </g>

  <!-- ====== HERO ANTWORT ====== -->
  <g transform="translate(16, 188)">
    <text font-size="10" letter-spacing="0.22em" font-weight="600" fill="#3A6FA8">REGNET ES BALD?</text>

    <text y="46" font-size="40" font-weight="700" fill="#2C2A26" letter-spacing="-0.02em">In 23 Minuten</text>
    <text y="86" font-size="40" font-weight="700" fill="#3A6FA8" letter-spacing="-0.02em">Regen.</text>

    <text y="120" font-size="14" fill="#5C5447">
      leicht bis mäßig · <tspan font-weight="600" fill="#2C2A26">1,8 mm/h</tspan>
    </text>
    <text y="140" font-size="14" fill="#5C5447">
      bis ca. <tspan font-weight="600" fill="#2C2A26">15:42</tspan>
    </text>
  </g>

  <!-- ====== DRY WINDOW HIGHLIGHT (positiver Akzent) ====== -->
  <g transform="translate(16, 354)" filter="url(#cardShadow)">
    <rect width="358" height="76" rx="14" fill="#F4F4E6" stroke="#7A9466" stroke-width="1.5"/>
    <g transform="translate(20, 20)">
      <circle r="14" fill="#7A9466"/>
      <text y="5" font-size="16" font-weight="700" fill="#FAF6EA" text-anchor="middle">✓</text>
    </g>
    <text x="52" y="32" font-size="13" font-weight="700" fill="#2C2A26">Danach 47 min trocken</text>
    <text x="52" y="50" font-size="11" fill="#5C5447">15:42 – 16:29 · Zeit für den Spaziergang</text>
    <text x="52" y="66" font-size="10" fill="#7A9466" font-weight="600">Neuer Schauer ab ca. 16:29</text>
  </g>

  <!-- ====== KARTE MINI ====== -->
  <g transform="translate(16, 446)" filter="url(#cardShadow)">
    <rect width="358" height="240" rx="16" fill="url(#mapTexture)"/>

    <!-- Topo lines -->
    <g opacity="0.4">
      <path d="M 20 200 Q 80 170 140 160 Q 200 150 260 160 Q 300 170 340 190" fill="none" stroke="#8B7355" stroke-width="0.8"/>
      <path d="M 20 160 Q 80 130 140 120 Q 200 110 260 120 Q 300 130 340 150" fill="none" stroke="#8B7355" stroke-width="0.8"/>
    </g>

    <!-- River -->
    <path d="M 30 130 Q 100 110 180 130 Q 260 150 340 130" fill="none" stroke="#3A6FA8" stroke-width="1.2" opacity="0.4"/>

    <!-- Precipitation cells -->
    <ellipse cx="100" cy="140" rx="50" ry="32" fill="#9AB8CF" opacity="0.5"/>
    <ellipse cx="120" cy="155" rx="36" ry="24" fill="#3A6FA8" opacity="0.6"/>
    <ellipse cx="160" cy="170" rx="32" ry="22" fill="#1F4878" opacity="0.7"/>

    <!-- Movement arrow -->
    <g stroke="#1F4878" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7">
      <line x1="120" y1="155" x2="180" y2="155"/>
      <path d="M 175 150 L 182 155 L 175 160"/>
    </g>

    <!-- User pin -->
    <g transform="translate(220, 150)" filter="url(#strongShadow)">
      <circle r="18" fill="#C97B47" opacity="0.10"/>
      <circle r="13" fill="#C97B47" opacity="0.16"/>
      <circle r="9" fill="#FAF6EA" stroke="#C97B47" stroke-width="2"/>
      <circle r="4" fill="#C97B47"/>
    </g>

    <!-- Cities -->
    <g font-size="9" fill="#5C5447" opacity="0.7">
      <text x="48" y="76">Köln</text>
      <text x="284" y="92">Frankfurt</text>
    </g>

    <!-- Top-right: tap to expand -->
    <g transform="translate(290, 16)">
      <rect width="56" height="28" rx="14" fill="#FAF6EA" opacity="0.95" stroke="#E0D6BE"/>
      <text x="28" y="18" font-size="11" fill="#3A6FA8" font-weight="600" text-anchor="middle">▶ Karte</text>
    </g>

    <!-- Now-Timestamp -->
    <g transform="translate(16, 210)">
      <circle r="4" fill="#7A9466"/>
      <text x="12" y="4" font-size="10" font-weight="600" fill="#5C5447">Radar 14:32</text>
    </g>
  </g>

  <!-- ====== TIMELINE-DIAGRAMM (MOBILE) ====== -->
  <g transform="translate(16, 706)">
    <text font-size="10" letter-spacing="0.22em" font-weight="600" fill="#8B7355">INTENSITÄT · NÄCHSTE 6 H</text>

    <g transform="translate(0, 16)" filter="url(#cardShadow)">
      <rect width="358" height="200" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>

      <!-- Y axis labels -->
      <g font-size="8" fill="#8B7355">
        <text x="14" y="34">stark</text>
        <text x="14" y="74">mäßig</text>
        <text x="14" y="114">leicht</text>
        <text x="14" y="142">kein</text>
      </g>

      <!-- Plot area: x=40..346, w=306, y=28..144, h=116 -->
      <!-- Guides -->
      <g stroke="#E0D6BE" stroke-width="1" stroke-dasharray="2 3">
        <line x1="40" y1="28" x2="346" y2="28"/>
        <line x1="40" y1="68" x2="346" y2="68"/>
        <line x1="40" y1="108" x2="346" y2="108"/>
        <line x1="40" y1="144" x2="346" y2="144"/>
      </g>

      <!-- Source background hints -->
      <rect x="40" y="28" width="40" height="116" fill="#3A6FA8" opacity="0.05"/>
      <rect x="80" y="28" width="80" height="116" fill="#C97B47" opacity="0.05"/>
      <rect x="160" y="28" width="186" height="116" fill="#8B7355" opacity="0.05"/>

      <!-- Confidence band (wider toward right) -->
      <path d="M 40 132 L 60 118 L 80 76 L 110 56 L 140 80 L 170 116 L 200 130 L 230 90 L 260 60 L 290 80 L 320 110 L 346 122
               L 346 144 L 320 144 L 290 138 L 260 132 L 230 138 L 200 144 L 170 142 L 140 122 L 110 98 L 80 116 L 60 138 L 40 144 Z"
            fill="#3A6FA8" opacity="0.12"/>

      <!-- Intensity bars (most likely) -->
      <g>
        <!-- Now = empty/start -->
        <rect x="42" y="140" width="14" height="4" fill="#9AB8CF" opacity="0.6"/>
        <!-- Rain begins (~+23 min) -->
        <rect x="58" y="100" width="14" height="44" fill="#3A6FA8" opacity="0.9"/>
        <rect x="74" y="84" width="14" height="60" fill="#3A6FA8" opacity="0.95"/>
        <rect x="90" y="96" width="14" height="48" fill="#3A6FA8" opacity="0.9"/>
        <rect x="106" y="118" width="14" height="26" fill="#9AB8CF" opacity="0.7"/>
        <!-- Dry window -->
        <rect x="122" y="142" width="14" height="2" fill="#9AB8CF" opacity="0.3"/>
        <rect x="138" y="142" width="14" height="2" fill="#9AB8CF" opacity="0.3"/>
        <!-- Sage window highlight -->
        <rect x="120" y="28" width="32" height="116" fill="#7A9466" opacity="0.10"/>
        <g transform="translate(136, 24)" text-anchor="middle">
          <text font-size="7" font-weight="700" fill="#7A9466">TROCKEN</text>
        </g>
        <!-- Second shower -->
        <rect x="154" y="96" width="14" height="48" fill="#3A6FA8" opacity="0.88"/>
        <rect x="170" y="82" width="14" height="62" fill="#3A6FA8" opacity="0.92"/>
        <!-- Heavy peak -->
        <rect x="186" y="56" width="14" height="88" fill="#1F4878" opacity="0.95"/>
        <!-- Thunder marker above -->
        <g transform="translate(193, 50)">
          <path d="M 0 0 L 5 0 L 1 4 L 6 4 L -1 12 L 2 6 L -3 6 Z" fill="#D4A373"/>
        </g>
        <rect x="202" y="90" width="14" height="54" fill="#3A6FA8" opacity="0.85"/>
        <rect x="218" y="110" width="14" height="34" fill="#3A6FA8" opacity="0.7"/>
        <!-- Past 4h: dashed -->
        <rect x="234" y="120" width="14" height="24" fill="#3A6FA8" opacity="0.55" stroke-dasharray="2 2" stroke="#3A6FA8"/>
        <rect x="250" y="124" width="14" height="20" fill="#3A6FA8" opacity="0.45" stroke-dasharray="2 2" stroke="#3A6FA8"/>
        <rect x="266" y="128" width="14" height="16" fill="#3A6FA8" opacity="0.4" stroke-dasharray="2 2" stroke="#3A6FA8"/>
        <rect x="282" y="132" width="14" height="12" fill="#3A6FA8" opacity="0.35" stroke-dasharray="2 2" stroke="#3A6FA8"/>
        <rect x="298" y="134" width="14" height="10" fill="#3A6FA8" opacity="0.3" stroke-dasharray="2 2" stroke="#3A6FA8"/>
        <rect x="314" y="136" width="14" height="8" fill="#3A6FA8" opacity="0.3" stroke-dasharray="2 2" stroke="#3A6FA8"/>
      </g>

      <!-- Now line -->
      <line x1="40" y1="22" x2="40" y2="146" stroke="#C97B47" stroke-width="2"/>
      <g transform="translate(40, 18)">
        <rect x="-18" y="-10" width="36" height="14" rx="7" fill="#C97B47"/>
        <text y="0" font-size="9" font-weight="700" fill="#FAF6EA" text-anchor="middle">JETZT</text>
      </g>

      <!-- Skill horizon -->
      <line x1="160" y1="28" x2="160" y2="144" stroke="#8B7355" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

      <!-- X axis labels -->
      <g transform="translate(0, 158)" font-size="9" fill="#8B7355">
        <text x="40" text-anchor="middle">14:32</text>
        <text x="116" text-anchor="middle">15:30</text>
        <text x="192" text-anchor="middle">16:30</text>
        <text x="268" text-anchor="middle">18:00</text>
        <text x="346" text-anchor="middle">20:32</text>
      </g>

      <!-- legend mini -->
      <g transform="translate(40, 184)" font-size="8" fill="#5C5447">
        <rect width="8" height="8" fill="#3A6FA8" opacity="0.85"/>
        <text x="12" y="7">Wahrsch.</text>
        <rect x="64" width="8" height="8" fill="#3A6FA8" opacity="0.18"/>
        <text x="76" y="7">Konfidenz</text>
        <rect x="132" width="8" height="8" fill="#7A9466" opacity="0.5"/>
        <text x="144" y="7">trocken</text>
        <line x1="178" y1="3" x2="186" y2="3" stroke="#8B7355" stroke-dasharray="2 1"/>
        <text x="192" y="7" font-style="italic">unsicher</text>
      </g>
    </g>
  </g>

  <!-- ====== QUICK STATS 2x2 ====== -->
  <g transform="translate(16, 940)">
    <text font-size="10" letter-spacing="0.22em" font-weight="600" fill="#8B7355">SUMME &amp; SIGNALE</text>

    <g transform="translate(0, 16)">
      <!-- Row 1 -->
      <g>
        <rect width="174" height="80" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <text x="14" y="22" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">SUMME 6 H</text>
        <text x="14" y="48" font-size="20" font-weight="700" fill="#2C2A26">3,4 mm</text>
        <text x="14" y="68" font-size="10" fill="#5C5447">Band 2,1 – 5,2 mm</text>
      </g>
      <g transform="translate(184, 0)">
        <rect width="174" height="80" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <text x="14" y="22" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">PHASE</text>
        <text x="14" y="48" font-size="20" font-weight="700" fill="#2C2A26">Regen</text>
        <text x="14" y="68" font-size="10" fill="#5C5447">Schauer-Charakter</text>
        <g transform="translate(148, 38)">
          <path d="M 8 0 Q 1 14 1 22 Q 1 30 8 30 Q 16 30 16 22 Q 16 14 8 0 Z" fill="#3A6FA8"/>
        </g>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 90)">
        <rect width="174" height="80" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <text x="14" y="22" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">GEWITTER</text>
        <text x="14" y="48" font-size="20" font-weight="700" fill="#2C2A26">12 %</text>
        <text x="14" y="68" font-size="10" fill="#5C5447">gering</text>
        <g transform="translate(148, 44)">
          <circle r="12" fill="#D4A373" opacity="0.7"/>
          <path d="M -2 -5 L 4 -5 L 0 1 L 4 1 L -4 9 L 0 3 L -4 3 Z" fill="#FAF6EA"/>
        </g>
      </g>
      <g transform="translate(184, 90)">
        <rect width="174" height="80" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <text x="14" y="22" font-size="9" font-weight="600" letter-spacing="0.12em" fill="#8B7355">SCHNEEGRENZE</text>
        <text x="14" y="48" font-size="20" font-weight="700" fill="#2C2A26">1840 m</text>
        <text x="14" y="68" font-size="10" fill="#5C5447">stabil über 6 h</text>
      </g>
    </g>
  </g>

  <!-- ====== ACTION CARDS ====== -->
  <g transform="translate(16, 1144)">
    <text font-size="10" letter-spacing="0.22em" font-weight="600" fill="#8B7355">MEHR ANSEHEN</text>

    <g transform="translate(0, 16)">
      <g>
        <rect width="358" height="58" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <g transform="translate(16, 17)">
          <rect width="24" height="24" rx="6" fill="#EDE6D3"/>
          <line x1="6" y1="14" x2="18" y2="14" stroke="#3A6FA8" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="8" x2="12" y2="20" stroke="#3A6FA8" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="52" y="26" font-size="13" font-weight="700" fill="#2C2A26">Detail-Modus</text>
        <text x="52" y="44" font-size="11" fill="#8B7355">Konfidenz, Akkumulation, Quellen</text>
        <text x="338" y="36" font-size="18" fill="#8B7355" text-anchor="end">›</text>
      </g>

      <g transform="translate(0, 68)">
        <rect width="358" height="58" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <g transform="translate(16, 17)">
          <rect width="24" height="24" rx="6" fill="#EDE6D3"/>
          <path d="M 6 16 L 6 10 Q 6 6 12 6 Q 18 6 18 10 L 18 16 Z" fill="none" stroke="#3A6FA8" stroke-width="1.4"/>
          <line x1="8" y1="20" x2="16" y2="20" stroke="#3A6FA8" stroke-width="1.4"/>
        </g>
        <text x="52" y="26" font-size="13" font-weight="700" fill="#2C2A26">Alarm einrichten</text>
        <text x="52" y="44" font-size="11" fill="#8B7355">Push vor Regenbeginn</text>
        <text x="338" y="36" font-size="18" fill="#8B7355" text-anchor="end">›</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="358" height="58" rx="14" fill="#FAF6EA" stroke="#E0D6BE"/>
        <g transform="translate(16, 17)">
          <rect width="24" height="24" rx="6" fill="#EDE6D3"/>
          <path d="M 6 18 Q 10 18 12 14 Q 16 18 18 14 Q 22 18 22 18" fill="none" stroke="#3A6FA8" stroke-width="1.4"/>
        </g>
        <text x="52" y="26" font-size="13" font-weight="700" fill="#2C2A26">Animation</text>
        <text x="52" y="44" font-size="11" fill="#8B7355">Niederschlag wandert · −1 h bis +6 h</text>
        <text x="338" y="36" font-size="18" fill="#8B7355" text-anchor="end">›</text>
      </g>
    </g>
  </g>

  <!-- ====== QUELLEN-FOOTER ====== -->
  <g transform="translate(16, 1380)">
    <rect width="358" height="68" rx="12" fill="#F8F2E2" stroke="#E0D6BE"/>
    <circle cx="22" cy="22" r="4" fill="#7A9466"/>
    <text x="36" y="26" font-size="11" font-weight="600" fill="#5C5447">DWD-Radar · ICON-D2</text>
    <text x="14" y="46" font-size="10" fill="#8B7355">Letzter Modelllauf 08:00 UTC · Radar 14:30</text>
    <text x="14" y="60" font-size="10" fill="#8B7355" font-style="italic">Werbefrei · ohne Tracking</text>
  </g>

  <!-- Home indicator -->
  <g transform="translate(150, 1480)">
    <rect width="90" height="4" rx="2" fill="#2C2A26" opacity="0.4"/>
  </g>
</svg>
