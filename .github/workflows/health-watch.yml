# ============================================================================
# health-watch — der Betriebswächter mit Zeitplan (V-AW-69, audit/autobahnwetter.md §19.13)
# ============================================================================
# WARUM: Vom 19.10. 13:02 UTC an scheiterte jeder `point`-Lauf des Daten-Repos am
# Terminregister, ab 21.10. 13:02 UTC stand `road-fc`, ab 21.10. 15:36 UTC war
# `road-archiv` in jedem Lauf rot — und niemand hat es gesehen (Gate E, 23.10.).
# Rote Läufe in fremden Repos erreichen keinen Menschen; ein Issue in DIESEM Repo
# schon (E-Mail an den Besitzer, Mobil-Push, der Reiter „Issues").
#
# Dieser Workflow prüft NICHT die Crons, sondern das ausgelieferte Ergebnis — wie
# ein Besucher, von außen: `scripts/health-manifests.mjs --url https://buscosun.com`
# (H: Warm-Manifeste, I: Index des Daten-Repos, R1–R7: Straßenwetter und Gefahren).
# Rot ⇒ EIN Issue mit Label `health` (bestehendes bekommt einen Kommentar, keine
# Mailflut); grün ⇒ das offene Issue wird mit dem grünen Lauf geschlossen.
#
# Nicht zu verwechseln mit dem gelöschten `health.yml` (E-AW-16): das war seit
# September bei jedem Lauf rot (H2/H3 `latest-grib.json`), seit V-AW-61 gelten
# stillgelegte Manifeste als grün — ein immer roter Wächter meldet nichts.
#
# Takt: stündlich, :17 (abseits der Punkt-Crons :40/:30/:55 und des Archivs :25).
# Der Wächter selbst darf rot sein, ohne dass `main` rot wird: eigener Workflow,
# kein PR-Gate. Beobachtung: wird das Issue zur Gewohnheit, ist der Wächter wertlos
# — dann die Prüfung schärfen oder die Ursache beheben, nie den Wächter dämpfen.
# ============================================================================

name: health-watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: health-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.health.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/health-manifests.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: health-manifests gegen buscosun.com
        id: health
        continue-on-error: true
        # Kein `| tee`: ohne pipefail wäre der Exit-Code der von tee (0) und der Schritt nie rot.
        run: |
          node scripts/health-manifests.mjs --url https://buscosun.com > health.txt; code=$?
          cat health.txt
          exit $code
      - name: Befund festhalten
        if: always()
        run: |
          {
            echo 'HEALTH<<EOF'
            grep -E '^\s*(✓|✗|\[health\])' health.txt | head -60 || true
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Issue öffnen, kommentieren oder schließen
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'health-watch: buscosun.com liefert nicht, was es soll';
            const red = process.env.OUTCOME !== 'success';
            const report = (process.env.HEALTH ?? '').trim();
            const open = (await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'health' })).data.find((i) => i.title === title);
            const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            if (red) {
              const body = [
                `Rot um ${stamp} — Lauf: ${run}`, '',
                'Der Wächter prüft das ausgelieferte Ergebnis von außen (`scripts/health-manifests.mjs`): Warm-Manifeste (H), Index des',
                'Daten-Repos (I), Straßenwetter und Gefahren-Produkt (R1–R7). Rot heißt: ein Cron im Daten-Repo steht oder ein Produkt ist veraltet.',
                '', 'Zuerst ansehen: `point` und `road-fc` im Daten-Repo (`SCHEDULED_CHANGES` in `src/point/sourceMatrix.ts`, V-EX-1), dann `radar.yml`.', '',
                '```', report || '(keine Ausgabe)', '```',
              ].join('\n');
              if (open) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body: `Weiter rot um ${stamp} — ${run}\n\n\`\`\`\n${report || '(keine Ausgabe)'}\n\`\`\`` });
              else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['health'] });
              core.setFailed('health-manifests rot — siehe Issue');
            } else if (open) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, body: `Wieder grün um ${stamp} — ${run}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number, state: 'closed' });
            }
