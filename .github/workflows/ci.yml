# ============================================================================
# PR-Gate (V-93, konkretisiert V-11) — netzfrei, schnell, blockierend
# ============================================================================
# WARUM: Bis heute prüfte KEIN Workflow den Code. `tsc` und `vite build` liefen
# erstmals beim Netlify-Deploy, die Verifier nur manuell. Fehler fielen damit
# frühestens beim Deploy auf — oder in Produktion.
#
# REIHENFOLGE-BEDINGUNG (O-02, Risiko R2 „falsches Grün"): Dieses Gate durfte
# erst NACH der Harness-Reparatur entstehen. V-91 (tautologischer simradar-
# Verifier entfernt, D-07 ehrlich gestellt) und V-29 (Fusions-Gate urteilt
# wieder) sind am 2026-08-03 abgeschlossen — sonst hätte die CI 18 blinde
# Prüfmittel als „grün" zementiert.
#
# HIER LÄUFT NUR NETZFREIES. Die unten aufgeführten Verifier wurden am
# 2026-08-03 empirisch auf Netzfreiheit geprüft (Lauf mit gesperrtem globalem
# `fetch` — alle grün). Alles Netzabhängige läuft in nightly.yml: Upstream-Churn
# bei DWD/ECMWF/MeteoSchweiz darf `main` niemals rot färben, sonst gewöhnt man
# sich an rote Gates und das Gate ist wertlos (die Lehre aus V-91).
# ============================================================================

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'    # ≥ 22.6 wegen --experimental-strip-types
          cache: npm

      - run: npm ci

      # tsc -b zieht seit V-92 drei Projekte: src, vite.config, netlify/edge-functions.
      # Die Edge Functions tragen die Open-Proxy-Abwehr und standen vorher in
      # KEINEM tsconfig.
      - name: Typecheck (App + Vite-Config + Edge Functions)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Ab hier läuft JEDER Schritt, auch wenn ein früherer rot war (`if: !cancelled()`), und über `scripts/ci-run.mjs`:
      # der Wrapper meldet die roten Zeilen als Annotation (Lauf-Übersicht und öffentliche Checks-API). Vorher brach der
      # Lauf am ersten roten Schritt ab — vom 02.10. bis 17.11.2026 verdeckte ein roter Verifier elf weitere.
      - name: SEO-Gate
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:seo

      # SEO/GEO 2026 (E0): Routen-Tabelle, Sub-Routen-Shells und netlify.toml aus EINER Quelle.
      - name: Routing-Gate
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:routing

      - name: Performance-Budget
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs budget

      # Einzeln benannt statt in einer Schleife: fällt einer um, sagt die
      # GitHub-UI sofort WELCHER, ohne dass jemand ein Log aufklappt.
      - name: Verifier — Datenalter (V-19/V-20)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:datenalter
      - name: Verifier — Amtliche Quellen
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:official-sources
      - name: Verifier — Niederschlagsquelle (N1/D-14)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:precip-source
      - name: Verifier — FrameGovernor (WebGL-Parität)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:governor
      - name: Verifier — Feature-Layer (Gewitter, Blitz, Schnee, Rotation)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          node scripts/ci-run.mjs verify:thunder || rc=1
          node scripts/ci-run.mjs verify:lpi || rc=1
          node scripts/ci-run.mjs verify:snow || rc=1
          node scripts/ci-run.mjs verify:rotation || rc=1
          exit $rc
      - name: Verifier — Warm-Budget ⇄ Layer-Dock (V-80)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:warm-budget
      - name: Verifier — Betriebs-Wächter (V-79)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:health
      - name: Verifier — Modellquellen-Resolver
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:model-source
      # GS: GeoSphere-NWP-Zuordnung (v2 C-LAEF, v1 bis 2026-11-04) — Fixtures netzfrei, Live-Zeile ⊘ ohne Netz
      - name: Verifier — GeoSphere-NWP
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:geosphere-nwp
      - name: Verifier — Punkt-Fusion (buscosun Fusion)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:pv-fusion
      # FI: buscosun Fusion auf dem Punkt-Cube (AP2–AP8) — netzfrei gegen eine Fixture in
      # echter Container-Form; prueft auch, dass der Live-Pfad ohne Flag unveraendert bleibt.
      - name: Verifier — Punkt-Cube-Pfad (buscosun Fusion, FI)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:pv-cube
      # Register der Stände von buscosun Fusion: kein fester Stand und keine handkopierte Option außerhalb
      # des Registers, jeder Plattformteil hängt daran (audit/fusion-release.md) — netzfrei.
      - name: Verifier — Stände von buscosun Fusion (Register)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:fusion-release
      # NS: Niederschlagssummen im Regenradar — Rechenregeln (Lücke ≠ 0, keine addierten Quantile), echte Datenform obs/v1,
      # Kartenfeld kumuliert, Zusammensetzung (audit/niederschlagssummen.md) — netzfrei.
      - name: Verifier — Niederschlagssummen (Regenradar, NS)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:precip-sums
      # RC: Regenchance im Regenradar — Schwellen exakt aus der Verteilung, Lücke ≠ 0 %, Konturen (Ringe/Löcher/Ränder),
      # 3-h-Werte nie verteilt, Verdrahtung hinter `?rc=1` (audit/regenchance.md) — netzfrei.
      - name: Verifier — Regenchance (Regenradar, RC)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:regenchance
      # ZO: betroffene Orte und Ankunftsfenster je Gewitterzelle — Kern/Rand aus den amtlichen Ellipsen, Fenster im
      # 5-min-Raster, Satz zum Ort, Reichweite der deutschen Radare, Wortsperre D-19 (audit/zell-orte.md) — netzfrei.
      - name: Verifier — Betroffene Orte der Zellen (Regenradar, ZO)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:cell-places
      # ZT: Zelltürme auf Gelände — Höhen über Grund, Hagelkern, Trend aus zwei Läufen, Rückblick-Slots, Radarbild fürs
      # Relief, Verdrahtung hinter `?z3d=1` (audit/zelltuerme-3d.md) — netzfrei, an echten KONRAD3D-Läufen.
      - name: Verifier — Zelltürme auf Gelände (Regenradar, ZT)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:cell-towers
      # HZS: Höhen-Zeit-Schnitt — Schneefallgrenze/Säulen nur an nativen Schritten aus buscosun Fusion, Nullgradgrenze
      # gegen Handrechnung, Satz „Schnee bis zu dir", Gelände-Scheibe, Verdrahtung hinter `?hzs=1`
      # (audit/hoehen-zeit-schnitt.md) — netzfrei, an echten Antworten von buscosun Fusion.
      - name: Verifier — Höhen-Zeit-Schnitt (Regenradar, HZS)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:height-time
      # SK: Schneefallgrenze als Fläche im Gelände — Feld lesen, Kappe/Band/Linie gegen Gelände, Nässe, Satz am Ort
      # (snowSentence von HZS), Verdrahtung hinter ?sk=1 (audit/schneefallgrenze-flaeche.md) — netzfrei.
      - name: Verifier — Schneefallgrenze als Fläche (Regenradar, SK)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:snowcap
      # HD: hochauflösendes Niederschlagsradar — Schalter, Besitz-Maske = pickCountry Pixel für Pixel auf den echten
      # Gittern, Frame-Regel byte-gleich, Shader-Algebra, Dual-Frames (Log-Ebene), Morph (audit/radar-hochaufloesung.md) — netzfrei.
      - name: Verifier — Niederschlagsradar HD
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:radar-hd
      # RS: Randregel gegen den hellblauen Saum — Schalter, Shader-Nachbau an synthetischen Frames mit Negativkontrollen,
      # Morph/CPU-Mischung, Shader-Text, Verdrahtung (audit/radar-randsaum.md) — netzfrei (echte Frames nur mit RADAR_EDGE_RAW).
      - name: Verifier — Randregel Niederschlagsradar
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:radar-edge
      # R250: 250-m-Kacheln aus den DWD-Standortradaren — Schalter, Kachelgeometrie, Komposit-/Verankerungs-Algebra,
      # Vertrag (audit/radar-250m.md) — netzfrei (die Rundläufe an echten Dateien nur mit RADAR_250_RAW).
      - name: Verifier — Niederschlagsradar 250 m
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:radar-250m
      # RG: Darstellungsschwelle des Niederschlagsradars — Konstante (measured), Schalter, nativer Leseweg byte-gleich ohne
      # Option, Producer-Regel, hd250-Schwelle, Verträge, eingefrorene Messregel + Reproduktion an echten Stationszeilen
      # (audit/radar-regenschwelle.md) — netzfrei (die Rundläufe an echten Dateien nur mit RADAR_RG_RAW).
      - name: Verifier — Darstellungsschwelle Niederschlagsradar
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:radar-threshold
      # SE: Radarechos ohne Niederschlag (Störecho-Filter des Radar-Spiegels) — Geometrie Standortbild ↔ Polarscan, Regel
      # (rauschkorrigiertes ρHV), Maske, Mitnahme in die Vorhersage-Frames, Verträge, eingefrorene Messregel + Reproduktion an
      # echten Stationszeilen (audit/radar-stoerecho.md) — netzfrei (die Rundläufe an echten Dateien nur mit RADAR_SE_RAW).
      - name: Verifier — Störecho-Filter Niederschlagsradar
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:radar-clutter
      # OF: der Leser von buscosun-data obs/v1 (Stationsmessungen) und sein Schalter in den Messpfad — netzfrei auf einem
      # echten Auszug des Produkts (audit/obs-fusion.md).
      - name: Verifier — Stationsmessungen aus obs/v1 (Leser)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:obs-reader
      # WL: Wasserstandsvorhersage des BSH (CC BY 4.0) — Endpunkt-Disziplin, Parser gegen die gemessenen
      # Typfallen, Katalogregeln, Zitierregeln fuer Kategorie und Text, Attribution, Schalter. Netzfrei
      # gegen echte Antworten dreier Pegel (audit/wasserstand-bsh.md); --live fragt den Dienst, nicht in CI.
      - name: Verifier — Wasserstand BSH
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:sea-waterlevel
      # GL: Gletscher-Monitor DACH — Datenvertrag (Pfade, Klassen, Flächenstempel mit Bezugsjahr, Umriss-Stufen ±3 %, amtliche Sätze wörtlich)
      # an einem echten Auszug des Baums, der Baum-Prüfer im Fixture-Modus, und der Publisher gegen ein echtes lokales Remote
      # (Linien teilen ein Repo, abgelehnter Push heilt, nie Force, Archiv nur Hinzufügen; audit/gletscher.md) — netzfrei.
      - name: Verifier — Gletscher (Vertrag, Baum, Publisher)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          node scripts/ci-run.mjs verify:glacier-contract || rc=1
          node scripts/ci-run.mjs verify:glacier-static || rc=1
          node scripts/ci-run.mjs verify:glacier-publish || rc=1
          node scripts/ci-run.mjs verify:glacier-sat || rc=1
          node scripts/ci-run.mjs verify:glacier-melt || rc=1
          node scripts/ci-run.mjs verify:glacier-sheet || rc=1
          node scripts/ci-run.mjs verify:glacier-feed || rc=1
          exit $rc
      # SH: „Auswahl teilen" — Query-Schema, Ort-Slugs, Kanaele, Vorschaubilder
      # UND der Abgleich des Edge-Buendels gegen src/share/* (SH6).
      - name: Verifier — Teilen (Share/OG)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:share
      # PD: Form der Punktdaten im Daten-Repo (Cube-Container, Terrain-Kacheln,
      # Quellenmatrix, Kalibrierung, Manifeste). Netzfrei — die Quellen selbst
      # pruefen die bestehenden verify:icon-*/verify:ifs-Harnische.
      - name: Verifier — Punktdaten (Cube/Terrain/Quellen)
        if: ${{ !cancelled() }}
        run: node scripts/ci-run.mjs verify:point-data
