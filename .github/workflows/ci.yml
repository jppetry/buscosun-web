# ============================================================================
# PR-Gate (V-93, konkretisiert V-11) — netzfrei, schnell, blockierend
# ============================================================================
# WARUM: Bis heute prüfte KEIN Workflow den Code. `tsc` und `vite build` liefen
# erstmals beim Netlify-Deploy, die Verifier nur manuell. Fehler fielen damit
# frühestens beim Deploy auf — oder in Produktion.
#
# REIHENFOLGE-BEDINGUNG (O-02, Risiko R2 „falsches Grün"): Dieses Gate durfte
# erst NACH der Harness-Reparatur entstehen. V-91 (tautologischer simradar-
# Verifier entfernt, D-07 ehrlich gestellt) und V-29 (Fusions-Gate urteilt
# wieder) sind am 2026-08-03 abgeschlossen — sonst hätte die CI 18 blinde
# Prüfmittel als „grün" zementiert.
#
# HIER LÄUFT NUR NETZFREIES. Die unten aufgeführten Verifier wurden am
# 2026-08-03 empirisch auf Netzfreiheit geprüft (Lauf mit gesperrtem globalem
# `fetch` — alle grün). Alles Netzabhängige läuft in nightly.yml: Upstream-Churn
# bei DWD/ECMWF/MeteoSchweiz darf `main` niemals rot färben, sonst gewöhnt man
# sich an rote Gates und das Gate ist wertlos (die Lehre aus V-91).
# ============================================================================

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'    # ≥ 22.6 wegen --experimental-strip-types
          cache: npm

      - run: npm ci

      # tsc -b zieht seit V-92 drei Projekte: src, vite.config, netlify/edge-functions.
      # Die Edge Functions tragen die Open-Proxy-Abwehr und standen vorher in
      # KEINEM tsconfig.
      - name: Typecheck (App + Vite-Config + Edge Functions)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: SEO-Gate
        run: npm run verify:seo

      # SEO/GEO 2026 (E0): Routen-Tabelle, Sub-Routen-Shells und netlify.toml aus EINER Quelle.
      - name: Routing-Gate
        run: npm run verify:routing

      - name: Performance-Budget
        run: npm run budget

      # Einzeln benannt statt in einer Schleife: fällt einer um, sagt die
      # GitHub-UI sofort WELCHER, ohne dass jemand ein Log aufklappt.
      - name: Verifier — Datenalter (V-19/V-20)
        run: npm run verify:datenalter
      - name: Verifier — Amtliche Quellen
        run: npm run verify:official-sources
      - name: Verifier — Niederschlagsquelle (N1/D-14)
        run: npm run verify:precip-source
      - name: Verifier — FrameGovernor (WebGL-Parität)
        run: npm run verify:governor
      - name: Verifier — Feature-Layer (Gewitter, Blitz, Schnee, Rotation)
        run: |
          npm run verify:thunder
          npm run verify:lpi
          npm run verify:snow
          npm run verify:rotation
      - name: Verifier — Warm-Budget ⇄ Layer-Dock (V-80)
        run: npm run verify:warm-budget
      - name: Verifier — Betriebs-Wächter (V-79)
        run: npm run verify:health
      - name: Verifier — Modellquellen-Resolver
        run: npm run verify:model-source
      # GS: GeoSphere-NWP-Zuordnung (v2 C-LAEF, v1 bis 2026-11-04) — Fixtures netzfrei, Live-Zeile ⊘ ohne Netz
      - name: Verifier — GeoSphere-NWP
        run: npm run verify:geosphere-nwp
      - name: Verifier — Punkt-Fusion (buscosun Fusion)
        run: npm run verify:pv-fusion
      # FI: buscosun Fusion auf dem Punkt-Cube (AP2–AP8) — netzfrei gegen eine Fixture in
      # echter Container-Form; prueft auch, dass der Live-Pfad ohne Flag unveraendert bleibt.
      - name: Verifier — Punkt-Cube-Pfad (buscosun Fusion, FI)
        run: npm run verify:pv-cube
      # Register der Stände von buscosun Fusion: kein fester Stand und keine handkopierte Option außerhalb
      # des Registers, jeder Plattformteil hängt daran (audit/fusion-release.md) — netzfrei.
      - name: Verifier — Stände von buscosun Fusion (Register)
        run: npm run verify:fusion-release
      # NS: Niederschlagssummen im Regenradar — Rechenregeln (Lücke ≠ 0, keine addierten Quantile), echte Datenform obs/v1,
      # Kartenfeld kumuliert, Zusammensetzung (audit/niederschlagssummen.md) — netzfrei.
      - name: Verifier — Niederschlagssummen (Regenradar, NS)
        run: npm run verify:precip-sums
      # RC: Regenchance im Regenradar — Schwellen exakt aus der Verteilung, Lücke ≠ 0 %, Konturen (Ringe/Löcher/Ränder),
      # 3-h-Werte nie verteilt, Verdrahtung hinter `?rc=1` (audit/regenchance.md) — netzfrei.
      - name: Verifier — Regenchance (Regenradar, RC)
        run: npm run verify:regenchance
      # ZO: betroffene Orte und Ankunftsfenster je Gewitterzelle — Kern/Rand aus den amtlichen Ellipsen, Fenster im
      # 5-min-Raster, Satz zum Ort, Reichweite der deutschen Radare, Wortsperre D-19 (audit/zell-orte.md) — netzfrei.
      - name: Verifier — Betroffene Orte der Zellen (Regenradar, ZO)
        run: npm run verify:cell-places
      # ZT: Zelltürme auf Gelände — Höhen über Grund, Hagelkern, Trend aus zwei Läufen, Rückblick-Slots, Radarbild fürs
      # Relief, Verdrahtung hinter `?z3d=1` (audit/zelltuerme-3d.md) — netzfrei, an echten KONRAD3D-Läufen.
      - name: Verifier — Zelltürme auf Gelände (Regenradar, ZT)
        run: npm run verify:cell-towers
      # HZS: Höhen-Zeit-Schnitt — Schneefallgrenze/Säulen nur an nativen Schritten aus buscosun Fusion, Nullgradgrenze
      # gegen Handrechnung, Satz „Schnee bis zu dir", Gelände-Scheibe, Verdrahtung hinter `?hzs=1`
      # (audit/hoehen-zeit-schnitt.md) — netzfrei, an echten Antworten von buscosun Fusion.
      - name: Verifier — Höhen-Zeit-Schnitt (Regenradar, HZS)
        run: npm run verify:height-time
      # SK: Schneefallgrenze als Fläche im Gelände — Feld lesen, Kappe/Band/Linie gegen Gelände, Nässe, Satz am Ort
      # (snowSentence von HZS), Verdrahtung hinter ?sk=1 (audit/schneefallgrenze-flaeche.md) — netzfrei.
      - name: Verifier — Schneefallgrenze als Fläche (Regenradar, SK)
        run: npm run verify:snowcap
      # HD: hochauflösendes Niederschlagsradar — Schalter, Besitz-Maske = pickCountry Pixel für Pixel auf den echten
      # Gittern, Frame-Regel byte-gleich, Shader-Algebra, Dual-Frames (Log-Ebene), Morph (audit/radar-hochaufloesung.md) — netzfrei.
      - name: Verifier — Niederschlagsradar HD
        run: npm run verify:radar-hd
      # R250: 250-m-Kacheln aus den DWD-Standortradaren — Schalter, Kachelgeometrie, Komposit-/Verankerungs-Algebra,
      # Vertrag (audit/radar-250m.md) — netzfrei (die Rundläufe an echten Dateien nur mit RADAR_250_RAW).
      - name: Verifier — Niederschlagsradar 250 m
        run: npm run verify:radar-250m
      # SH: „Auswahl teilen" — Query-Schema, Ort-Slugs, Kanaele, Vorschaubilder
      # UND der Abgleich des Edge-Buendels gegen src/share/* (SH6).
      - name: Verifier — Teilen (Share/OG)
        run: npm run verify:share
      # PD: Form der Punktdaten im Daten-Repo (Cube-Container, Terrain-Kacheln,
      # Quellenmatrix, Kalibrierung, Manifeste). Netzfrei — die Quellen selbst
      # pruefen die bestehenden verify:icon-*/verify:ifs-Harnische.
      - name: Verifier — Punktdaten (Cube/Terrain/Quellen)
        run: npm run verify:point-data
