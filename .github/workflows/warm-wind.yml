# ============================================================================
# Warm-Cron für den ICON-D2-Wind-Layer (Phase T1.2)
# ============================================================================
# Aktiv, sobald dieser Branch (main) nach origin gepusht ist. Läuft NUR auf dem
# Default-Branch.
#
# VORAUSSETZUNG (einmalig, sonst No-op): Repo-Variable SITE_URL auf die Netlify-
# Prod-URL setzen (öffentlich, KEIN Secret) — Repo → Settings → Secrets and
# variables → Actions → Variables → New variable: SITE_URL = https://<site>.
#
# Ablauf: DWD pollen → neuesten vollständigen Lauf → Wind-URLs durch
# SITE_URL/_dwd_wind curlen (füllt den Durable-Edge-Cache) → erst DANN
# public/latest-wind.json atomar schreiben und zurück-committen. Der Commit
# löst einen Netlify-Rebuild aus, der das neue Manifest statisch ausliefert
# (deshalb KEIN [skip ci]). Early-Exit bei unverändertem Lauf → nur bei einem
# neuen DWD-Lauf (~alle 3 h) wird committet/deployt; die 15-min-Ticks dazwischen
# sind Sekunden-No-ops.
#
# Persistenz-Alternative (kein Rebuild je Lauf): Manifest in Netlify Blobs
# schreiben + über eine Function ausliefern — bewusst zurückgestellt.
# ============================================================================

name: warm-wind

on:
  schedule:
    - cron: '*/15 * * * *'   # alle 15 min pollen; Early-Exit wenn Manifest aktuell
  workflow_dispatch: {}       # manueller Trigger (erste Wärmung / Test)

# Nur ein Warmer gleichzeitig (überlappende Läufe würden dasselbe Manifest umlegen).
concurrency:
  group: warm-wind
  cancel-in-progress: false

permissions:
  contents: write             # committet public/latest-wind.json zurück

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Warm edge cache + update manifest
        env:
          SITE_URL: ${{ vars.SITE_URL }}            # öffentliche Prod-URL (Edge-Cache-Fill)
          MANIFEST_PATH: public/latest-wind.json
          WARM_MAX_STEP: '12'
          NEAR_REQUIRED: '4'
        run: node scripts/warm-wind.mjs

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- public/latest-wind.json; then
            echo "Manifest unverändert (Early-Exit oder Fail-Safe) — kein Commit."
            exit 0
          fi
          git config user.name  "buscosun-warmer[bot]"
          git config user.email "warmer@users.noreply.github.com"
          git add public/latest-wind.json
          git commit -m "chore(wind): warm cache + advance latest-wind manifest"
          git push
