# ============================================================================
# Nightly — netzabhängige Kontraktprüfung der Upstream-Quellen (V-93/V-87)
# ============================================================================
# WARUM GETRENNT VON ci.yml: buscosun liest DWD-, ECMWF-, Météo-France-,
# MeteoSchweiz- und GeoSphere-Bäume über reverse-engineerte Konstanten
# (Verzeichnislayout, RADOLAN-Header, DE1200-Ecken). Die brechen bei einer
# Upstream-Änderung STILL — Regenraten werden falsch, ohne Fehlermeldung
# (Risiko R4, „die günstigste Versicherung im ganzen Plan").
#
# Genau deshalb darf das aber NICHT das PR-Gate blockieren: Ein DWD-
# Publikationsfenster oder ein kurzer 503 würde sonst `main` rot färben, und
# rote Gates, an die man sich gewöhnt, sind wertlos.
#
# fail-fast: false — es sollen ALLE Quellen geprüft werden, nicht nur bis zur
# ersten kaputten. Ein Sammel-Job öffnet EIN Issue statt dreizehn Mails.
# ============================================================================

name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write        # Sammel-Issue bei Upstream-Bruch

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check:
          - verify:layer-transport
          - verify:wind-transport
          - verify:eps
          - verify:ch-eps
          - verify:arome-fr
          - verify:icon-eu
          - verify:gfs-2d
          - verify:ifs
          - verify:aifs
          - verify:aifs-ens
          - verify:icon-global
          - verify:aicon
          - verify:arpege
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: ${{ matrix.check }}
        run: npm run ${{ matrix.check }}

  report:
    needs: [upstream]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ein Sammel-Issue statt dreizehn Mails
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Nightly: Upstream-Kontraktprüfung fehlgeschlagen';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'nightly',
            });
            const body = [
              'Mindestens eine netzabhängige Quellenprüfung ist fehlgeschlagen.',
              '',
              `Lauf: ${run}`,
              '',
              'Mögliche Ursachen, in dieser Reihenfolge prüfen:',
              '1. **Upstream-Publikationsfenster** — DWD/ECMWF rotieren Läufe; ein einzelner Fehlschlag kann transient sein. Lauf erneut anstoßen.',
              '2. **Layout-Änderung beim Anbieter** — dann bricht die Quelle STILL und liefert falsche Werte statt eines Fehlers (Risiko R4). Das ist der Fall, für den dieser Nightly existiert.',
              '3. **Regression im eigenen Code** — dann hätte allerdings ci.yml schon vorher gemeckert.',
            ].join('\n');
            if (existing.data.find((i) => i.title === title)) {
              const issue = existing.data.find((i) => i.title === title);
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `Erneut fehlgeschlagen: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['nightly'],
              });
            }
