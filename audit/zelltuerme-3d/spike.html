<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///C:/dev/buscosun-web/node_modules/maplibre-gl/dist/maplibre-gl.css">
<script src="file:///C:/dev/buscosun-web/node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<style>html,body,#m{margin:0;height:100%;width:100%}</style></head>
<body><div id="m"></div>
<script>
// THROWAWAY SPIKE: fill-extrusion on terrain, hail core visibility, tile-seam behaviour.
function ring(cx, cy, rx, ry, n) {
  const r = [];
  for (let i = 0; i <= n; i++) { const a = i / n * 2 * Math.PI; r.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a) * (0.8 + 0.2 * Math.sin(3 * a))]); }
  r[n] = r[0]; return r;
}
// Tower A straddles the z10 tile border at lon 10.898 next to the Zugspitze massif.
const towerA = ring(10.898, 47.43, 0.06, 0.035, 40);
const coreA = ring(10.898, 47.43, 0.025, 0.015, 40);
// Tower B in flat foreland for comparison.
const towerB = ring(11.25, 47.62, 0.05, 0.03, 40);
const fc = (rings, props) => ({ type: 'FeatureCollection', features: rings.map((r, i) => ({ type: 'Feature', properties: props[i], geometry: { type: 'Polygon', coordinates: [r] } })) });
const map = new maplibregl.Map({ container: 'm', style: 'https://tiles.openfreemap.org/styles/positron', center: [11.0, 47.47], zoom: 10.2, pitch: 60, bearing: -20, maxPitch: 80, fadeDuration: 0 });
window.__map = map;
map.on('load', () => {
  map.addSource('dem', { type: 'raster-dem', tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 14 });
  map.setTerrain({ source: 'dem', exaggeration: 1.3 });
  map.addSource('hs', { type: 'raster-dem', tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'], encoding: 'terrarium', tileSize: 256, maxzoom: 14 });
  map.addLayer({ id: 'hill', type: 'hillshade', source: 'hs', paint: { 'hillshade-exaggeration': 0.45, 'hillshade-shadow-color': '#4A4234', 'hillshade-accent-color': '#6B5A45' } });
  map.addSource('core', { type: 'geojson', data: fc([coreA], [{ b: 1500, h: 6000 }]) });
  map.addSource('tow', { type: 'geojson', data: fc([towerA, towerB], [{ b: 1200, h: 9000 }, { b: 800, h: 7000 }]) });
  map.addLayer({ id: 'core', type: 'fill-extrusion', source: 'core', paint: { 'fill-extrusion-color': '#5a1020', 'fill-extrusion-base': ['get', 'b'], 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': 1 } });
  map.addLayer({ id: 'tow', type: 'fill-extrusion', source: 'tow', paint: { 'fill-extrusion-color': '#E08A2E', 'fill-extrusion-base': ['get', 'b'], 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-opacity': 0.55 } });
  map.addSource('foot', { type: 'geojson', data: fc([towerA, towerB], [{}, {}]) });
  map.addLayer({ id: 'foot', type: 'line', source: 'foot', paint: { 'line-color': '#2C2A26', 'line-width': 2 } });
  map.once('idle', () => { window.__ready = true; });
});
</script></body></html>
